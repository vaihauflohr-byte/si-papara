<script>
/* =====================================================================
   SI Papara — DS blancs de Terminale SI (entrainements/ds-blanc.html)
   Un DS blanc = un sujet du même type que le DS : mêmes notions, même format (1 h, /20,
   parties indépendantes, DR), autre système. Le sujet est un générateur (ds/dsXXb.js) :
   le 1er essai prend les valeurs du sujet papier, les suivants des valeurs tirées au hasard.
   - réponses chiffrées : vérifiées par le site (écart relatif ≤ 2 %, signe compris) ;
   - bilan des actions (DR) : actions à cocher (avec des pièges), puis point, direction, sens, norme ;
   - justifications et conclusions : rédigées ; une IA (fonction Supabase « corriger », API Claude) dit
     pour chaque élément rédigé du barème s'il est présent, en partie ou absent ; sans elle, l'élève coche
     avec le corrigé les éléments présents dans sa réponse (rien de coché sans réponse rédigée) ;
   - la note /20 et le détail question par question partent dans le suivi du professeur
     (module « dsb-dsXX »), comme les séries ; « Signaler une erreur » sur chaque question.
   Trois façons de le faire :
   - « question par question » (mode "pas") : une question à la fois ; « Vérifier » fige la réponse
     et affiche aussitôt la correction (verdict de chaque case, corrigé, barème, auto-évaluation,
     erreurs fréquentes), puis on passe à la suivante. Pour apprendre. Titre envoyé : « (question par question) » ;
   - « en conditions de DS » (mode "ds") : toute la copie, chrono, correction à la fin ;
   - « à mon rythme » (mode "libre") : toute la copie, sans chrono, correction à la fin.
   Copie en cours gardée sur l'appareil (chrono compris) : on peut fermer et revenir.
   ===================================================================== */
(function () {
  "use strict";
  const SUJETS = window.DSB_SUJETS || [];
  const $app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SIPok = () => !!(window.SIP && SIP.session);
  const session = () => (SIPok() ? SIP.session.get() : null);
  const apercu = () => !!(SIPok() && SIP.apercu && SIP.apercu.actif && SIP.apercu.actif());
  const RACINE = "../";

  /* ---------- nombres ---------- */
  function nb(x, s) {
    s = s || 3;
    if (x == null || !isFinite(x)) return "—";
    if (x === 0) return "0";
    const e = Math.floor(Math.log10(Math.abs(x)));
    let d = Math.max(0, s - 1 - e), v = Math.abs(x).toFixed(d);
    if (d > 0 && Math.floor(Math.log10(Number(v))) > e) v = Math.abs(x).toFixed(d - 1);
    let [ip, fp] = v.split(".");
    ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (x < 0 ? "−" : "") + ip + (fp ? "," + fp : "");
  }
  const pts = (x) => { const v = Math.round(x * 100) / 100; return String(v).replace(".", ",") + (Math.abs(v) > 1 ? " pts" : " pt"); };
  const note20 = (x) => String(Math.round(x * 100) / 100).replace(".", ",");
  /* saisie de l'élève : « 21,8 », « −145,7 », « 1 822 », « 1,82 kN », « 4,5×10^2 », « 37° » */
  function lire(s, unite) {
    if (s == null) return NaN;
    let t = String(s).trim().replace(/[−–—]/g, "-").replace(/[\s  ]/g, "").replace(/,/g, ".");
    t = t.replace(/[×x*]10\^?\(?([-+]?\d+)\)?/i, "e$1");
    const m = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(t);
    if (!m) return NaN;
    let v = parseFloat(m[0]);
    const reste = t.slice(m[0].length);
    if (/^k/i.test(reste) && unite && /^N/.test(unite)) v *= 1000;           /* « 1,82 kN » pour un champ en N */
    return v;
  }
  /* ligne de programme (champ "code") : on compare ce qui remplace les ____, espaces autour des opérateurs ignorés ;
     si l'élève a recopié toute la ligne, le début (pre) et la fin (post) imprimés sont retirés. Majuscules comptées (Python). */
  function normCode(s, ch) {
    let t = String(s == null ? "" : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[−–—]/g, "-").replace(/≥/g, ">=").replace(/≤/g, "<=").replace(/≠/g, "!=").trim();
    if (ch && ch.compact) return t.replace(/\s+/g, "");
    return t.replace(/\s+/g, " ").replace(/ ?([<>=!+\-*/%(),:\[\]]) ?/g, "$1").trim();
  }
  function reponseCode(ch, brut) {
    let t = normCode(brut, ch);
    const pre = normCode(ch.pre || "", ch), post = normCode(ch.post || "", ch);
    if (pre && t.startsWith(pre) && t.length > pre.length) t = t.slice(pre.length).trim();
    if (post && t.endsWith(post) && t.length > post.length) t = t.slice(0, -post.length).trim();
    return t;
  }
  function verdict(ch, brut) {
    if (ch.type === "choix") return brut == null || brut === "" ? { vide: true } : { ok: Number(brut) === ch.bonne };
    if (ch.type === "code") {
      if (brut == null || String(brut).trim() === "") return { vide: true, ok: false };
      const t = reponseCode(ch, brut), acc = ch.acc.map((a) => normCode(a, ch));
      if (acc.includes(t)) return { ok: true };
      const r = { ok: false };
      if (acc.some((a) => a.toLowerCase() === t.toLowerCase())) r.casse = true;
      else if (ch.binaire && /^[01]+$/.test(t) && t.length < 8 && acc.some((a) => a.replace(/^0+/, "") === t.replace(/^0+/, ""))) r.court = true;
      return r;
    }
    const v = lire(brut, ch.unite);
    if (!isFinite(v)) return { vide: brut == null || String(brut).trim() === "", ok: false, illisible: brut != null && String(brut).trim() !== "" };
    const a = ch.val;
    const proche = (x) => (ch.abs != null ? Math.abs(x - a) <= ch.abs + 1e-9 : Math.abs(x - a) / Math.abs(a) <= (ch.tol || 2) / 100 + 1e-9);
    if (proche(v)) return { ok: true, v };
    const r = { ok: false, v };
    if (a !== 0 && proche(-v)) r.signe = true;
    else if (a !== 0 && (proche(v * 1000) || proche(v / 1000))) r.unite = true;
    return r;
  }

  /* ---------- tirage reproductible ---------- */
  function alea(seed) { let a = seed >>> 0; return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------- copies gardées sur l'appareil (une mémoire par élève, une pour l'aperçu) ---------- */
  const memoire = {};
  const cleStock = () => { const s = session(); return "sip_dsb_v1:" + (s ? (s.apercu ? "apercu" : (s.eleve_id || s.nom || "eleve")) : "anonyme"); };
  function lireTout() { const k = cleStock(); try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) { /* stockage indisponible */ } return memoire[k] || {}; }
  function ecrireTout(o) { const k = cleStock(); memoire[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) { /* stockage indisponible : la copie reste en mémoire */ } }
  const dossier = (id) => { const t = lireTout(); return t[id] || { essais: [] }; };
  function garder(id, d) { const t = lireTout(); t[id] = d; ecrireTout(t); }
  /* recopie des champs de l'essai affiché dans la copie gardée sur l'appareil */
  function sauverEssai(S, essai, champs) {
    const d = dossier(S.id), e = d.essais.find((x) => x.n === essai.n);
    if (!e) return;
    champs.forEach((c) => { e[c] = essai[c]; });
    garder(S.id, d);
  }
  const nomMode = (m) => (m === "ds" ? "chrono" : m === "pas" ? "question par question" : "sans chrono");

  /* ---------- sujet instancié pour un essai ---------- */
  const cache = {};
  function instance(S, essai) {
    const k = S.id + ":" + essai.n + ":" + JSON.stringify(essai.P);
    if (!cache[k]) { const m = S.make(essai.P); m.questions = m.DS.parties.reduce((a, p) => a.concat(p.questions), []); cache[k] = m; }
    return cache[k];
  }
  const sujet = (id) => SUJETS.find((s) => s.id === id);
  const enCours = (d) => d.essais.find((e) => !e.rendu && !e.abandon);    /* une copie abandonnée (« Recommencer ») ne compte plus */

  /* ---------- notation ----------
     Éléments rédigés du barème : verdict de l'IA s'il existe (présent 1, en partie ½, absent 0),
     sinon la case cochée par l'élève avec le corrigé (et rien sans réponse rédigée). */
  const IA_FRAC = { present: 1, partiel: 0.5, absent: 0 };
  const iaVerdict = (q, essai, i) => { const x = essai.ia && essai.ia[q.n]; return x && x.etat === "ok" && x.elements ? x.elements[i] || null : null; };
  function noteQuestion(q, essai) {
    const rep = essai.rep || {}, v = rep.v || {}, t = (rep.t || {})[q.n] || "";
    const champ = (id) => q.champs.find((c) => c.id === id);
    const lignes = q.ind.map((ind, i) => {
      let frac = null, auto = false, ia = null;
      if (ind.frac) { auto = true; frac = ind.frac(rep); }
      else if (ind.champs) {
        auto = true;
        const ok = ind.champs.map((id) => verdict(champ(id), v[id]).ok === true);
        frac = ind.partiel ? ok.filter(Boolean).length / ok.length : (ok.every(Boolean) ? 1 : 0);
      } else if (t.trim() && (ia = iaVerdict(q, essai, i))) {
        frac = IA_FRAC[ia.v] || 0;
      } else {
        frac = t.trim() && (essai.coches || {})[q.n + ":" + i] ? 1 : 0;
      }
      return { ind, i, auto, ia, frac, p: ind.p * frac };
    });
    const somme = (f) => lignes.filter(f).reduce((a, l) => a + l.p, 0);
    return { lignes, total: somme(() => true), auto: somme((l) => l.auto), ia: somme((l) => !!l.ia), redige: !!t.trim() };
  }
  function noteEssai(S, essai) {
    const I = instance(S, essai);
    const parQ = I.questions.map((q) => ({ q, r: noteQuestion(q, essai) }));
    const brut = parQ.reduce((a, x) => a + x.r.total, 0), somme = (k) => parQ.reduce((a, x) => a + x.r[k], 0);
    return { I, parQ, note: Math.round(brut * 4) / 4, auto: somme("auto"), ia: somme("ia"), max: parQ.reduce((a, x) => a + x.q.pts, 0) };
  }
  const repondue = (q, essai) => {
    const rep = essai.rep || {};
    if (q.champs.some((c) => c.type === "bilan")) { const b = rep.bilan || {}; return Object.values(b.coches || {}).some(Boolean); }
    return q.champs.some((c) => { const x = (rep.v || {})[c.id]; return x != null && String(x).trim() !== ""; }) || !!((rep.t || {})[q.n] || "").trim();
  };
  /* ce qui reste vide dans une question (avant de la vérifier) */
  function videsDe(q, essai) {
    const rep = essai.rep || {}, v = rep.v || {}, out = [];
    q.champs.forEach((c) => {
      if (c.type === "bilan") { if (!Object.values((rep.bilan || {}).coches || {}).some(Boolean)) out.push("le bilan des actions"); return; }
      if (v[c.id] == null || String(v[c.id]).trim() === "") out.push(texteBrut(c.lab).replace(/\s*:\s*$/, "") || "une case");
    });
    if (q.texte && !((rep.t || {})[q.n] || "").trim()) out.push("ta réponse rédigée");
    return out;
  }

  /* ---------- vérification des réponses rédigées par l'IA (SIP.ia → fonction Supabase « corriger ») ----------
     Seulement pour les essais commencés quand elle est en service (essai.ia = {}). Pour chaque question à
     rédaction non vide : un appel, avec l'énoncé, le corrigé, les éléments rédigés du barème et le texte de
     l'élève ; les verdicts sont gardés dans l'essai (jamais redemandés). Question par question : juste après
     « Vérifier » ; sinon : à l'ouverture de la correction. Sans réponse de l'IA : auto-évaluation, comme avant. */
  /* coupe-circuit : si la fonction ne répond pas du tout (pas encore installée, réseau), on n'insiste pas
     pendant 5 minutes (auto-évaluation, sans message à chaque question) ; « Réessayer avec l'IA » le lève */
  const HS = "sip_ia_hs";
  const iaHS = () => { try { return Date.now() - Number(sessionStorage.getItem(HS) || 0) < 5 * 60000; } catch (e) { return false; } };
  const marquerHS = (oui) => { try { if (oui) sessionStorage.setItem(HS, String(Date.now())); else sessionStorage.removeItem(HS); } catch (e) { /* stockage indisponible */ } };
  const iaDispo = () => !!(window.SIP && SIP.ia && SIP.ia.actif && SIP.ia.actif()) && !iaHS();
  const elementsRediges = (q) => q.ind.map((ind, i) => ({ ind, i })).filter((x) => !x.ind.frac && !x.ind.champs);
  const texteRedige = (q, essai) => String((((essai.rep || {}).t) || {})[q.n] || "").trim();
  const iaDe = (q, essai) => (essai.ia && essai.ia[q.n]) || null;
  const iaAttendue = (q, essai) => !!(essai.ia && iaDispo() && q.texte && texteRedige(q, essai) && elementsRediges(q).length);
  const iaEnVol = new Set();
  const cleIA = (S, essai, q) => `${S.id}:${essai.n}:${q.n}`;
  /* l'IA lit en ce moment cette réponse (appel parti de cette page) */
  const iaLit = (S, essai, q) => iaEnVol.has(cleIA(S, essai, q));
  /* à (re)demander : jamais demandée, ou « en cours » gardé sans appel en vol dans cette page (page fermée pendant l'appel) */
  const iaARelancer = (S, essai, q) => { const x = iaDe(q, essai); return iaAttendue(q, essai) && !iaLit(S, essai, q) && (!x || x.etat === "encours"); };
  let vueIA = null;                /* vue affichée à prévenir quand un verdict arrive : { id, n, maj(qn) } */
  function texteIA(h) { return texteBrut(String(h || "").replace(/<sub>(.*?)<\/sub>/gi, "_$1")); }
  function majIA(S, essai, qn, val) {
    essai.ia = essai.ia || {}; essai.ia[qn] = val;
    const d = dossier(S.id), e = d.essais.find((x) => x.n === essai.n); if (!e) return;
    e.ia = e.ia || {}; e.ia[qn] = val; garder(S.id, d);
  }
  const prevenir = (S, essai, qn) => {
    try { if (vueIA && vueIA.id === S.id && vueIA.n === essai.n) vueIA.maj(qn); }
    catch (e) { console.warn("DS blanc : affichage du verdict de l'IA", e); }
  };
  async function verifierIA(S, essai, q, force) {
    const cle = cleIA(S, essai, q);
    if (force) marquerHS(false);
    if (iaEnVol.has(cle) || !iaAttendue(q, essai)) return;
    /* déjà lue (par une autre vue, ou une file restée en route) : on reprend son verdict, sans nouvel appel */
    const e0 = dossier(S.id).essais.find((x) => x.n === essai.n), x0 = e0 && e0.ia && e0.ia[q.n];
    if (x0 && x0.etat === "ok") { essai.ia = e0.ia; prevenir(S, essai, q.n); return; }
    iaEnVol.add(cle);
    const el = elementsRediges(q);
    majIA(S, essai, q.n, { etat: "encours", t: Date.now() }); prevenir(S, essai, q.n);
    let val;
    try {
      const d = await SIP.ia.corriger({
        sujet: S.id, question: (`Question ${q.n}. ` + texteIA(q.q)).slice(0, 3800), corrige: texteIA(q.rep).slice(0, 5800),
        elements: el.map(({ ind, i }) => ({ i, t: texteIA(ind.h || ind.t).slice(0, 380), p: ind.p })), reponse: texteRedige(q, essai).slice(0, 2000) });
      const elements = {};
      /* un élément sans verdict n'est pas compté absent : l'élève le coche lui-même avec le corrigé */
      d.elements.forEach((x) => { const v = x && String(x.verdict || "").toLowerCase(); if (x && el.some((y) => y.i === x.i) && ["present", "partiel", "absent"].includes(v)) elements[x.i] = { v, r: String(x.raison || "").slice(0, 300) }; });
      val = { etat: "ok", elements, conseil: String(d.conseil || "").slice(0, 400), t: Date.now() };
      marquerHS(false);
    } catch (err) {
      const code = (err && (err.code || err.message)) || "IA";
      if (code === "IA_RESEAU") marquerHS(true);
      val = { etat: "erreur", erreur: code, t: Date.now() };
    }
    iaEnVol.delete(cle);
    majIA(S, essai, q.n, val); prevenir(S, essai, q.n);
  }
  function messageIA(code) {
    if (code === "QUOTA") return "Tu as utilisé toutes tes vérifications par l'IA pour aujourd'hui : coche toi-même, avec le corrigé, ce que ta réponse contient.";
    if (code === "NON_CONNECTE" || code === "SESSION_EXPIREE") return "Connecte-toi pour que l'IA vérifie ta rédaction. En attendant, coche toi-même, avec le corrigé, ce que ta réponse contient.";
    if (code === "PROF_NON_CONNECTE" || code === "NON_AUTORISE") return "Aperçu : connecte-toi à l'espace prof dans ce navigateur pour voir la vérification par l'IA. En attendant, coche avec le corrigé.";
    return "La vérification par l'IA n'a pas pu se faire (réseau ?) : coche toi-même, avec le corrigé, ce que ta réponse contient, ou réessaie.";
  }

  /* ---------- en-tête de page : connexion, aperçu ---------- */
  function etat() {
    const s = session();
    if (!SIPok()) return `<span class="sip ko">Hors site · copie gardée sur cet appareil</span>`;
    if (s && s.apercu) return `<span class="sip ap"><b>Aperçu professeur</b> · rien n'est envoyé · <a href="${RACINE}index.html#/tableau">Tableau de bord</a></span>`;
    if (s) return `<span class="sip ok">Connecté(e) : <b>${esc(s.nom)}</b> · ta note part chez ton professeur · <a href="${RACINE}index.html#/tableau">Mon espace</a></span>`;
    return `<span class="sip ko">Non connecté(e) · <a href="${RACINE}index.html#/connexion/TSI">Me connecter</a> pour que ta note parte chez ton professeur</span>`;
  }
  const dateDS = (S) => {
    const B = window.SIP && SIP.BAC; if (!B) return null;
    const n = B.notions.find((x) => x.ds === S.ds && x.ds_date); if (!n) return null;
    return new Date(n.ds_date + "T12:00:00-10:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "Pacific/Tahiti" });
  };
  const nomNotion = (id) => { const B = window.SIP && SIP.BAC; const n = B && B.notions.find((x) => x.id === id); return n ? n.lab : id; };
  const fmtDate = (ms) => new Date(ms).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Pacific/Tahiti" });

  /* ---------- vues ---------- */
  let minuteur = null;
  let aSauver = null;              /* sauvegarde de la frappe en cours, différée de 250 ms : écrite avant tout changement de vue */
  function vider() { if (aSauver) { const f = aSauver; aSauver = null; f(); } }
  function stopMinuteur() { if (minuteur) { clearInterval(minuteur); minuteur = null; } }
  function aller(h) { if (location.hash === h) afficher(); else location.hash = h; }

  function vueListe() {
    const cartes = SUJETS.slice().reverse().map((S) => {                /* le plus récent (le prochain DS) en premier */
      const d = dossier(S.id), faits = d.essais.filter((e) => e.rendu), c = enCours(d), j = dateDS(S);
      const meilleur = faits.length ? Math.max(...faits.map((e) => e.note || 0)) : null;
      return `<a class="carte dsb-carte" href="#${S.id}">
        <div><div class="eyebrow">Entraînement au ${esc(S.ds)}${j ? " · " + esc(j) : ""}</div>
          <h2 class="dsb-t">${esc(S.ds)} blanc <span>${esc(S.titre)}</span></h2>
          <p class="discret">${S.notions.map((n) => esc(nomNotion(n))).join(" · ")}</p></div>
        <div class="dsb-d">${c ? `<span class="etiquette alerte">copie en cours</span>` : meilleur != null ? `<div class="grand">${note20(meilleur)}<small> / 20</small></div><div class="discret">meilleure note · ${faits.length} essai${faits.length > 1 ? "s" : ""}</div>` : `<span class="discret">${S.duree_min} min</span>`}<span class="btn">${c ? "Reprendre →" : "Ouvrir →"}</span></div></a>`;
    }).join("");
    $app.innerHTML = `<p class="haut"><a href="${RACINE}index.html#/tableau">← Tableau de bord</a></p>
      <div id="sip-etat">${etat()}</div>
      <h1>DS blancs <span class="discret" style="font-size:1rem;text-transform:none;font-family:var(--f-body);font-weight:400">Terminale SI</span></h1>
      <p>Un DS blanc, c'est un sujet du même type que ton prochain DS : mêmes notions, même durée, mêmes types de questions, mais un autre système. Commence question par question, avec la correction après chaque réponse, puis refais-le en conditions de DS.</p>
      ${cartes || `<p class="discret">Aucun DS blanc pour l'instant.</p>`}`;
  }

  /* voulu : « pas » (le défi, lien #ds03/defi) ou « ds » (la revanche, lien #ds03/revanche), depuis la carte « Prochain DS » */
  function vueSujet(S, qn, voulu) {
    const d = dossier(S.id), c = enCours(d), j = dateDS(S);
    if (c) return c.mode === "pas" ? vuePas(S, c, qn) : vueCopie(S, c);
    const faits = d.essais.filter((e) => e.rendu).sort((a, b) => b.n - a.n);
    /* conseil : d'abord question par question, puis en conditions de DS */
    const dejaPas = faits.some((e) => e.mode === "pas"), conseil = voulu || (dejaPas ? "ds" : "pas");
    const etiq = voulu === "pas" ? "le défi" : voulu === "ds" ? "la revanche" : dejaPas ? "conseillé maintenant" : "conseillé pour commencer";
    const mode = (m, titre, txt) => `<button class="mode${m === conseil ? " conseil" : ""}" type="button" data-go="${m}">
        <span class="mode-t">${titre}${m === conseil ? `<span class="etiquette ok">${etiq}</span>` : ""}</span>
        <span class="mode-d">${txt}</span></button>`;
    const bestDe = (f) => { const l = faits.filter(f); return l.length ? Math.max(...l.map((e) => e.note || 0)) : null; };
    const bDefi = bestDe((e) => e.mode !== "ds"), bRev = bestDe((e) => e.mode === "ds");
    const bandeau = voulu === "pas"
      ? `<div class="carte defi"><div class="eyebrow">Le défi</div><p><b>Fais ce DS blanc avant de t'entraîner</b>, question par question : tu vois tout de suite ce qui t'attend au ${esc(S.ds)} et ce que tu sais déjà faire. Ta note ne bloque rien : le défi est fait dès que tu l'as terminé, même avec une note basse.</p><p>Après chaque question ratée, le site te dit <b>quelle étape de la préparation</b> la travaille et quelle fiche relire. Puis viens prendre ta revanche, avec d'autres valeurs, en conditions de DS.</p></div>`
      : voulu === "ds"
      ? `<div class="carte defi"><div class="eyebrow">La revanche</div><p><b>Le même type de sujet, avec d'autres valeurs, en conditions de DS</b> : ${S.duree_min} min de chrono, la correction à la fin.${bDefi != null ? ` Au défi, tu avais <b>${note20(bDefi)} / 20</b>.` : ""}${bRev != null ? ` Ta meilleure revanche : <b>${note20(bRev)} / 20</b>.` : ""}</p><p class="discret">Prends le temps de t'installer : une fois commencé, le chrono continue, même si tu fermes la page.</p></div>`
      : "";
    $app.innerHTML = `<p class="haut"><a href="#">← DS blancs</a> · <a href="${RACINE}index.html#/tableau">Tableau de bord</a></p>
      <div id="sip-etat">${etat()}</div>
      <div class="eyebrow">Entraînement au ${esc(S.ds)}${j ? " du " + esc(j) : ""}</div>
      <h1>${esc(S.ds)} blanc <span class="sous">${esc(S.titre)}</span></h1>
      <div class="badges">${S.notions.map((n) => `<span>${esc(nomNotion(n))}</span>`).join("")}</div>
      ${bandeau}
      <div class="carte intro">
        <p><b>Même format que le ${esc(S.ds)}</b> : ${S.duree_min} min, noté sur 20, parties indépendantes, document réponse. Calculatrice autorisée.</p>
        <ul>
          <li>Tes <b>résultats numériques</b> se tapent dans les cases (virgule ou point) : le site les vérifie.</li>
          <li>Tes <b>justifications et conclusions</b> se rédigent comme sur ta copie. ${iaDispo() ? "Une IA les compare au corrigé et te dit ce qui manque (si elle ne peut pas, tu coches toi-même avec le corrigé)." : "Avec le corrigé, tu coches ce que tu as vraiment écrit."}</li>
          <li>Le <b>document réponse</b> se remplit à l'écran.</li>
          <li>Ta copie est gardée sur ce téléphone : tu peux fermer et revenir (en conditions de DS, le chrono continue).</li>
          <li>À chaque nouvel essai, de nouvelles valeurs.</li>
        </ul>
        <h2 class="modes-t">Comment veux-tu le faire ?</h2>
        <div class="modes">
          ${mode("pas", "Question par question", "Tu réponds à une question puis tu la vérifies : la correction, tes erreurs et tes points s'affichent tout de suite. Puis la suivante. <b>Pour apprendre.</b>")}
          ${mode("ds", `En conditions de DS · ${S.duree_min} min`, "Toute la copie, avec le chrono ; la correction à la fin. <b>Pour te tester avant le vrai DS.</b>")}
          ${mode("libre", "À mon rythme", "Toute la copie, sans chrono ; la correction à la fin.")}
        </div>
      </div>
      ${faits.length ? `<h2>Mes essais</h2><div class="table-defil"><table class="essais"><thead><tr><th>Essai</th><th>Rendu le</th><th>Mode</th><th class="num">Note</th><th>Professeur</th><th></th></tr></thead><tbody>
        ${faits.map((e) => `<tr><td>n° ${e.n}</td><td>${fmtDate(e.fin)}</td><td>${nomMode(e.mode)}</td><td class="num"><b>${note20(e.note || 0)}</b> / 20</td>
          <td>${e.envoye ? `<span class="etiquette ok">reçue</span>` : `<span class="etiquette alerte">à envoyer</span>`}</td><td><a href="#${S.id}/correction/${e.n}">${e.envoye ? "Voir la correction" : "Terminer la correction"}</a></td></tr>`).join("")}
      </tbody></table></div>` : ""}`;
    $app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => commencer(S, b.dataset.go)));
  }

  function commencer(S, mode) {
    const d = dossier(S.id);
    if (enCours(d)) return aller("#" + S.id);
    const n = d.essais.length + 1;
    let P, seed = 0;
    if (n === 1) P = Object.assign({}, S.REF);
    else { seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0; P = S.tirage(alea(seed)); }
    const e = { n, seed, P, mode, debut: Date.now(), fin: null, rep: { v: {}, bilan: { coches: {}, lignes: {} }, t: {} }, coches: {}, rendu: false, envoye: false, note: null };
    if (mode === "pas") { e.etape = 0; e.verif = {}; }          /* question affichée, questions vérifiées (figées) */
    if (iaDispo()) e.ia = {};                                     /* rédactions vérifiées par l'IA (verdicts gardés ici) */
    d.essais.push(e);
    garder(S.id, d);
    window.scrollTo(0, 0);
    aller("#" + S.id);
  }

  /* ---------- la copie ---------- */
  function champHTML(ch, val) {
    if (ch.type === "code") return `<label class="ch code"><span class="ch-l">${ch.lab}</span><span class="ch-ligne">${ch.pre ? `<code>${esc(ch.pre)}</code>` : ""}<input type="text" class="mono" data-ch="${ch.id}" value="${esc(val || "")}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ch.binaire ? "8 bits" : "____"}">${ch.post ? `<code>${esc(ch.post)}</code>` : ""}</span></label>`;
    if (ch.type === "choix") return `<label class="ch choix"><span class="ch-l">${ch.lab}</span><select data-ch="${ch.id}"><option value="">— choisir —</option>${ch.options.map((o, i) => `<option value="${i}"${String(val) === String(i) ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    /* le clavier numérique de l'iPhone n'a pas de signe moins : bouton ± à côté de chaque case (sur toutes, pour ne rien souffler) */
    return `<label class="ch"><span class="ch-l">${ch.lab}${ch.lab ? " =" : ""}</span><span class="ch-g"><span class="ch-in"><button type="button" class="pm" data-pm="${ch.id}" aria-label="Changer le signe" title="Changer le signe">±</button><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-ch="${ch.id}" value="${esc(val || "")}" placeholder="valeur"></span><span class="ch-u">${esc(ch.unite || "")}</span></span></label>`;
  }
  function bilanHTML(S, essai, I) {
    const B = S.BILAN, b = (essai.rep && essai.rep.bilan) || { coches: {}, lignes: {} };
    const sel = (cid, k, opts, v) => `<label><span>${k === "point" ? "Point" : k === "dir" ? "Direction" : k === "sens" ? "Sens" : "Norme"}</span><select data-bilan="${cid}" data-k="${k}"><option value="">—</option>${opts.map((o) => `<option value="${esc(o[0])}"${v === o[0] ? " selected" : ""}>${esc(o[1])}</option>`).join("")}</select></label>`;
    return `<div class="bilan">
      <p class="bilan-aide">Coche les actions mécaniques <b>extérieures</b> à E, puis complète leur ligne du tableau. Le poids est donné.</p>
      <div class="bilan-c donne"><div class="bc-tete"><b>Poids de E</b></div><div class="bc-champs fixe">G · verticale · vers le bas · ${esc(I.c ? "P = m·g = " + nb(I.c.Pd, 4) + " N" : "")}</div></div>
      ${B.candidats.map((x) => { const l = b.lignes[x.id] || {}, on = !!b.coches[x.id];
        return `<div class="bilan-c${on ? " on" : ""}" data-cand="${x.id}"><label class="bc-tete"><input type="checkbox" data-coche="${x.id}"${on ? " checked" : ""}> ${esc(x.lab)}</label>
          <div class="bc-champs"${on ? "" : " hidden"}>${sel(x.id, "point", B.points.map((p) => [p, p]), l.point)}${sel(x.id, "dir", B.dirs, l.dir)}${sel(x.id, "sens", B.sens, l.sens)}${sel(x.id, "norme", B.normes, l.norme)}</div></div>`; }).join("")}
    </div>`;
  }
  function traceHTML(S, essai, I) {
    const v = (essai.rep && essai.rep.v) || {};
    const ps = lire(v.phs), pm = lire(v.phm), th = lire(v.th), cote = v.cote;
    const cones = [];
    if (isFinite(ps) && ps > 0 && ps < 80) cones.push({ phi: ps, lab: "piste sèche" });
    if (isFinite(pm) && pm > 0 && pm < 80) cones.push({ phi: pm, lab: "piste mouillée" });
    const theta = isFinite(th) && cote !== undefined && cote !== "" ? (Number(cote) === 0 ? th : -th) : null;
    return S.cone(I.P, I.c, { cones, theta });
  }
  function questionCopie(S, essai, I, q) {
    const v = (essai.rep && essai.rep.v) || {}, t = (essai.rep && essai.rep.t) || {};
    const champs = q.champs.filter((c) => c.type !== "bilan");
    return `<section class="q" data-q="${esc(q.n)}">
      <div class="q-tete"><span class="q-n">Q ${esc(q.n)}</span>${q.dr ? `<span class="tag">${esc(q.dr)} à l'écran</span>` : ""}<span class="q-pts">${pts(q.pts)}</span></div>
      <div class="q-txt">${q.q}</div>
      <div class="rep">
        ${q.champs.some((c) => c.type === "bilan") ? bilanHTML(S, essai, I) : ""}
        ${champs.length ? `<div class="champs">${champs.map((c) => champHTML(c, v[c.id])).join("")}</div>` : ""}
        ${q.trace ? `<figure class="trace"><figcaption>Ton tracé sur le DR1 : cônes d'après tes angles φ (question B.1), droite d'action d'après θ et le côté choisi.</figcaption><div data-trace>${traceHTML(S, essai, I)}</div></figure>` : ""}
        ${q.texte ? `<label class="redac"><span>Ta réponse rédigée <span class="discret">(${esc(q.texte)})</span></span><textarea data-t="${esc(q.n)}" rows="4" placeholder="Rédige comme sur ta copie : formules, calculs, phrase de conclusion.">${esc(t[q.n] || "")}</textarea></label>` : ""}
      </div></section>`;
  }
  /* saisie des réponses (copie entière ou question seule) : cases, menus, bilan, rédaction, bouton ± */
  function brancherSaisie(S, essai, I, sauver) {
    on("input", (ev) => {
      const el = ev.target, rep = essai.rep;
      if (el.dataset.ch) rep.v[el.dataset.ch] = el.value;
      else if (el.dataset.t) rep.t[el.dataset.t] = el.value;
      else if (el.dataset.bilan) { const l = rep.bilan.lignes[el.dataset.bilan] = rep.bilan.lignes[el.dataset.bilan] || {}; l[el.dataset.k] = el.value; }

  /* « Recommencer à zéro » : la copie en cours est abandonnée (gardée sur l'appareil, jamais envoyée), puis on

  function recommencer(S, essai) {

    boite(`<h2>Recommencer à zéro ?</h2><p>Ta copie en cours est effacée${essai.mode === "ds" ? " et le chrono repart à 0" : ""} : rien n'est envoyé à ton professeur${faites ? (faites > 1 ? ` (même les ${faites} questions déjà vérifiées)` : " (même la question déjà vérifiée)") : ""}. Tu choisis ensuite comment le refaire, avec de nouvelles valeurs.</p>`,

  function rendre(S, essai, tempsEcoule) {
    stopMinuteur(); vider();

    e.rep = essai.rep; e.rendu = true; e.fin = e.mode === "ds" ? Math.min(Date.now(), e.debut + S.duree_min * 60000) : Date.now(); e.ecoule = !!tempsEcoule;

  /* ---------- question par question : une question à la fois, vérifiée et corrigée aussitôt ----------

  const docsOuverts = {};          /* blocs de documents ouverts ou fermés par l'élève, le temps de la page */

  const figuresDe = (html) => { const out = [], re = /Figure\s+(\d+)\s*[–-]\s*([^<(]+)/g; let m; while ((m = re.exec(html))) out.push({ n: m[1], t: m[2].trim().replace(/[\s,.;:]+$/, "") }); return out; };
  const etatQ = (r, q) => (r.total >= q.pts - 1e-9 ? "ok" : r.total > 1e-9 ? "part" : "ko");
  function suivanteDe(Q, essai, k) {
    for (let i = k + 1; i < Q.length; i++) if (!essai.verif[Q[i].n]) return Q[i];
    for (let i = 0; i < k; i++) if (!essai.verif[Q[i].n]) return Q[i];
    return null;
  }
  function vuePas(S, essai, qn) {
    const I = instance(S, essai), D = I.DS, Q = I.questions;

    if (k < 0 || k >= Q.length) k = 0;
    if (essai.etape !== k) { essai.etape = k; sauverEssai(S, essai, ["etape"]); }
    const q = Q[k], partie = D.parties.find((p) => p.questions.includes(q)), vue = !!essai.verif[q.n];
    const cle = `${S.id}:${essai.n}:${q.n}`;

    const R = noteEssai(S, essai);
    const pastilles = D.parties.map((p) => `<span class="pas-g">${p.questions.map((x) => {
      const i = Q.indexOf(x), v = !!essai.verif[x.n], r = R.parQ[i].r;
      return `<a class="pas-p${v ? " " + etatQ(r, x) : repondue(x, essai) ? " ecrit" : ""}${i === k ? " cur" : ""}" href="#${S.id}/q/${encodeURIComponent(x.n)}" data-nav="${esc(x.n)}"${i === k ? ' aria-current="step"' : ""} aria-label="Question ${esc(x.n)}${v ? `, vérifiée : ${pts(r.total)} sur ${pts(x.pts)}` : ""}">${esc(x.n)}</a>`;
    }).join("")}</span>`).join("");
    /* blocs de documents : ouverts par défaut à la première question, quand la question cite une de leurs figures ou une exigence */
    const cites = new Set(((texteBrut(q.q).match(/figures?\s+\d+(?:\s*(?:,|et)\s*\d+)*/gi) || []).join(" ").match(/\d+/g)) || []);
    const doc = (id, titre, html, defaut) => {

      return `<details class="docs" data-doc="${id}"${ouvert ? " open" : ""}><summary><b>${titre}</b>${figs.length ? `<span class="docs-f">${figs.map((f) => `figure ${f.n} : ${esc(f.t.charAt(0).toLowerCase() + f.t.slice(1))}`).join(" · ")}</span>` : ""}</summary>${html}</details>`;

        <span class="avance" id="avance" title="Questions vérifiées">${Q.filter((x) => essai.verif[x.n]).length} / ${Q.length}</span>

      <p class="pas-score" id="pas-score"></p>

        <h2 class="part">${partie.titre}<span>${pts(partie.questions.reduce((a, x) => a + x.pts, 0))}</span></h2>
        ${partie.objectif ? `<p class="obj">${partie.objectif}</p>` : ""}
        ${doc("pres", "Présentation du système", `<div class="pres">${D.presentation}</div>`, k === 0)}
        ${partie.intro ? doc("p" + ip, `Hypothèses et documents de la ${esc(nomPartie)}`, `<div class="part-intro">${partie.intro}</div>`, partie.questions[0] === q) : ""}
        ${vue ? questionCorr(S, essai, I, q, R.parQ[k].r, true) : questionCopie(S, essai, I, q)}
        <div class="pas-act">${vue
          ? (suiv ? `<button class="btn" id="suivante" type="button">Question suivante : ${esc(suiv.n)} →</button>` : `<button class="btn" id="bilan" type="button">Voir mon bilan et envoyer ma note →</button>`)
          : `<button class="btn" id="verifier" type="button">Vérifier ma réponse</button><span class="discret">Une fois vérifiée, ta réponse ne se modifie plus.</span>`}</div>

        : `<span class="discret">Réponds, puis vérifie : la correction et tes points s'affichent tout de suite.</span>`;
      faites.forEach((x) => { const a = $app.querySelector(`[data-nav="${CSS.escape(x.n)}"]`); if (a) { a.classList.remove("ok", "part", "ko", "ecrit"); a.classList.add(etatQ(R2.parQ[Q.indexOf(x)].r, x)); } });
      const b = $app.querySelector(`[data-pq="${CSS.escape(q.n)}"]`); if (b) b.textContent = pts(R2.parQ[k].r.total).replace(/ pts?$/, "");
    };

    on("click", (ev) => { const b = ev.target.closest("[data-ia]"); if (!b) return; const x = Q.find((y) => y.n === b.dataset.ia); if (x) verifierIA(S, essai, x, true); });
    if (!vue) {

      const sauver = () => {
        clearTimeout(t0);

        t0 = setTimeout(() => { vider(); const a = $app.querySelector(`[data-nav="${CSS.escape(q.n)}"]`); if (a) a.classList.toggle("ecrit", repondue(q, essai)); }, 250);

        const go = () => {
          clearTimeout(t0); aSauver = null; essai.verif[q.n] = Date.now(); sauverEssai(S, essai, ["rep", "verif"]);
          if (iaAttendue(q, essai)) verifierIA(S, essai, q);       /* « l'IA lit… » tout de suite, le verdict redessine la question */
          afficher();

        const vides = videsDe(q, essai);
        if (vides.length) return boite(`<h2>Il reste des cases vides</h2><p>${vides.map((x) => esc(x)).join(" · ")}.</p><p>Une fois vérifiée, ta réponse ne se modifie plus.</p>`, [["Vérifier quand même", go], ["Compléter", null]]);
        go();
      };
    } else {
      /* auto-évaluation des éléments rédigés, tout de suite après la correction */

  /* ---------- la correction ---------- */
  function texteBrut(h) { const div = document.createElement("div"); div.innerHTML = String(h || "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n"); div.querySelectorAll("svg").forEach((s) => s.remove()); return div.textContent.replace(/\n{3,}/g, "\n\n").trim(); }
  function repChamp(ch, brut) {
    const r = verdict(ch, brut);
    if (ch.type === "choix") return `<li class="${r.vide ? "vide" : r.ok ? "ok" : "ko"}"><span>${ch.lab}</span> <b>${r.vide ? "sans réponse" : esc(ch.options[Number(brut)])}</b>${r.ok ? " ✓" : ` <span class="att">attendu : ${esc(ch.options[ch.bonne])}</span>`}</li>`;
    if (ch.type === "code") {
      const ligne = (x) => `<code class="ligne">${esc(ch.pre || "")}<b>${esc(x)}</b>${esc(ch.post || "")}</code>`;
      const bt = r.vide ? "" : String(brut).trim(), entiere = !r.vide && reponseCode(ch, bt) !== normCode(bt, ch);   /* ligne recopiée en entier : affichée telle quelle */
      return `<li class="${r.vide ? "vide" : r.ok ? "ok" : "ko"}"><span>${ch.lab} :</span> ${r.vide ? "<b>sans réponse</b>" : entiere ? `<code class="ligne"><b>${esc(bt)}</b></code>` : ligne(bt)}${r.ok ? " ✓" : ` <span class="att">attendu : ${ligne(ch.acc[0])}${r.casse ? " · attention aux majuscules : Python écrit True, False, et les noms exactement comme dans le programme" : r.court ? " · un octet s'écrit avec ses 8 bits" : ""}</span>`}</li>`;
    }
    /* entiers (cases « abs: 0 », valeurs entières) écrits en entier : 65 536, pas 65 540 */
    const ent = (x) => (x < 0 ? "−" : "") + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
    const fmt = (x, s) => (Number.isInteger(x) && Math.abs(x) < 1e7 ? ent(x) : nb(x, s));
    const att = `${fmt(ch.val, ch.val !== 0 && Math.abs(ch.val) >= 1000 ? 4 : 3)}${ch.unite ? " " + esc(ch.unite) : ""}`;
    return `<li class="${r.vide ? "vide" : r.ok ? "ok" : "ko"}"><span>${ch.lab}${ch.lab ? " =" : ""}</span> <b>${r.vide ? "sans réponse" : r.illisible ? esc(brut) + " (illisible)" : fmt(r.v, 4) + (ch.unite ? " " + esc(ch.unite) : "")}</b>${r.ok ? " ✓" : ` <span class="att">attendu : ${att}${r.signe ? " · erreur de signe" : r.unite ? " · erreur d'unité (×1 000 ?)" : ""}</span>`}</li>`;
  }
  function bilanCorr(S, essai) {
    const B = S.BILAN, b = (essai.rep && essai.rep.bilan) || { coches: {}, lignes: {} };
    const libelle = (liste, v) => { const o = liste.find((x) => x[0] === v); return o ? o[1] : "—"; };
    const rows = B.candidats.map((x) => {
      const on = !!b.coches[x.id], l = b.lignes[x.id] || {};
      if (!x.ok) return on ? `<tr class="ko"><td>${esc(x.lab)}</td><td colspan="4">✗ à ne pas mettre : ${esc(x.pourquoi)}</td></tr>` : "";
      if (!on) return `<tr class="ko"><td>${esc(x.lab)}</td><td colspan="4">✗ oubliée · attendu : ${esc(x.point)} · ${esc(libelle(B.dirs, x.dir))} · ${esc(libelle(B.sens, x.sens))} · inconnue</td></tr>`;
      const c = (ok, txt, att, lab) => `<td class="${ok ? "ok" : "ko"}" data-l="${lab}">${esc(txt)}${ok ? " ✓" : `<br><span class="att">attendu : ${esc(att)}</span>`}</td>`;
      return `<tr><td>${esc(x.lab)}</td>${c(l.point === x.point, l.point || "—", x.point, "Point")}${c(l.dir === x.dir, libelle(B.dirs, l.dir), libelle(B.dirs, x.dir), "Direction")}${c(l.sens === x.sens, libelle(B.sens, l.sens), libelle(B.sens, x.sens), "Sens")}${c(l.norme === "inconnue", libelle(B.normes, l.norme), "inconnue", "Norme")}</tr>`;
    }).join("");
    return `<div class="table-defil"><table class="t bilan-corr"><thead><tr><th>Ton bilan</th><th>Point</th><th>Direction</th><th>Sens</th><th>Norme</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  /* question par question : ce que le site a vérifié, ce qui reste à s'attribuer avec le corrigé */

  async function envoyer(S, essai, apres) {

    const titre = `${I.DS.libelle} · ${I.DS.titre} · essai n° ${essai.n}${essai.mode === "ds" ? "" : ` (${nomMode(essai.mode)})`}`;
    const et = document.getElementById("envoi-etat"); if (et) et.textContent = "Envoi…";
    try {
      const parti = await SIP.ecrire("enregistrer", { module: S.module, titre, type: "externe", score: R.note, score_max: 20, duree_s: Math.round(((essai.fin || Date.now()) - essai.debut) / 1000), details });
      const dd = dossier(S.id), e = dd.essais.find((x) => x.n === essai.n);
      e.envoye = true; e.noteEnvoyee = R.note; essai.envoye = true; essai.noteEnvoyee = R.note; garder(S.id, dd);
      if (apres) apres();
      if (et && !apercu()) et.innerHTML = parti ? `Note reçue par ton professeur ✓ <span class="discret">(${note20(R.note)} / 20)</span>` : "Pas de réseau : ta note partira dès que la connexion revient.";
    } catch (err) {
      if (et) et.textContent = err.message === "SESSION_EXPIREE" ? "Ta connexion a expiré : reconnecte-toi, puis renvoie ta note." : "Envoi impossible : " + err.message;
    }
  }

  /* ---------- petite fenêtre (pas de confirm() du navigateur) ---------- */
  function boite(html, boutons) {
    const f = document.createElement("div"); f.className = "dsb-fond";
    f.innerHTML = `<div class="dsb-boite" role="dialog" aria-modal="true">${html}<div class="rang">${boutons.map((b, i) => `<button class="btn${i ? " sec" : ""}" data-i="${i}" type="button">${esc(b[0])}</button>`).join("")}</div></div>`;
    document.body.appendChild(f);
    const fermer = () => f.remove();
    f.addEventListener("click", (e) => { if (e.target === f) fermer(); });
    f.querySelectorAll("button").forEach((b) => (b.onclick = () => { const a = boutons[+b.dataset.i][1]; fermer(); if (a) a(); }));
    f.querySelector("button").focus();
  }

  /* ---------- routeur ---------- */
  let ecouteurs = [];
  function on(type, fn) { $app.addEventListener(type, fn); ecouteurs.push([type, fn]); }
  function nettoyer() { ecouteurs.forEach(([t, f]) => $app.removeEventListener(t, f)); ecouteurs = []; }
  function afficher() {
    vider(); stopMinuteur(); nettoyer(); vueIA = null;
    const h = decodeURIComponent(location.hash.replace(/^#/, "")), [id, vue, n] = h.split("/");
    const S = id && sujet(id);
    if (!S) return vueListe();
    if (vue === "correction" && n) return vueCorrection(S, Number(n));
    return vueSujet(S, vue === "q" ? n : null, vue === "defi" ? "pas" : vue === "revanche" ? "ds" : null);
  }
  window.addEventListener("hashchange", afficher);
  window.addEventListener("pageshow", (e) => { if (e.persisted) afficher(); });
  window.addEventListener("pagehide", vider);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") vider(); });
  if (window.SIP && SIP.session && SIP.session.get() && SIP.viderFile) SIP.viderFile().catch(() => {});
  window.DSB = { afficher, noteEssai, verdict, lire, nb, instance, dossier, garder, sujet };
  afficher();
})();

</script>
