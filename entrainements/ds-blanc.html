*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:15.5px/1.55 var(--f-body)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong{font-weight:600}
main{max-width:860px;margin:0 auto;padding:18px 16px 110px}
h1{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1;margin:.15em 0 .45em;text-wrap:balance}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.badges span{border:1px solid var(--rule);border-radius:4px;padding:1px 8px;font-size:.84rem;color:var(--ink-2);background:var(--paper)}

.dsb-d{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.grand{font-family:var(--f-mono);font-weight:600;font-size:1.9rem;line-height:1}.grand small{font-size:.5em;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;padding:10px 18px;border-radius:var(--r);cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:44px}
.btn.sec{background:var(--paper);color:var(--accent)}

.rang{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.etiquette{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--paper-2);color:var(--ink-2)}
.etiquette.ok{background:var(--good-soft);color:var(--good)}.etiquette.alerte{background:var(--warn-soft);color:var(--warn)}.etiquette.ko{background:var(--bad-soft);color:var(--bad)}
.intro ul{margin:.4em 0 1em;padding-left:1.2em}.intro li{margin:.25em 0}
.table-defil{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 12px}
table.essais{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--paper)}
table.essais th,table.essais td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;white-space:nowrap}

.num{text-align:right}
/* barre de la copie */
.barre{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);margin:0 -16px 12px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.barre .barre-q{color:inherit;text-decoration:none;font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre .chrono{font-family:var(--f-mono);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}

@media (max-width:560px){main{padding:12px 10px 110px}.barre{margin:0 -10px 10px;padding-left:10px;padding-right:10px;gap:10px}.barre .long{display:none}.feuille{padding:12px 10px 16px}}

.feuille{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px 18px 22px;font-size:15px;line-height:1.5}
.cart{display:grid;grid-template-columns:auto minmax(0,1.35fr) minmax(0,1fr);border:1.5px solid var(--line-strong);margin-bottom:12px}
.cart .logo{display:flex;align-items:center;justify-content:center;padding:6px 9px;border-right:1.5px solid var(--line-strong);background:#fff}
.cart .logo img{display:block;width:76px;height:auto}
.cart .left{padding:9px 12px;border-right:1.5px solid var(--line-strong)}
.cart h1{font-size:1.7rem;margin:3px 0 4px}.cart h1 small{display:block;font-size:.6em;text-transform:none;color:var(--ink-2);margin-top:3px;font-weight:600;letter-spacing:.01em}
.cart .right{display:grid;grid-template-columns:1fr 1fr;margin:0}
.cart .cell{padding:5px 9px;border-bottom:1px solid var(--line-strong);border-right:1px solid var(--line-strong)}

.cart dt{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--ink-3)}
.cart dd{margin:0;font-family:var(--f-mono);font-weight:500}
@media (max-width:640px){.cart{grid-template-columns:auto minmax(0,1fr)}.cart .right{grid-column:1 / -1;border-top:1.5px solid var(--line-strong)}.cart .left{border-right:0}.cart .logo img{width:58px}}
.notions{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;font-size:.82rem}
.notions b{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--ink-3);align-self:center;margin-right:4px}
.notions span{border:1px solid var(--rule);border-radius:3px;padding:0 6px;color:var(--ink-2)}
.consignes{font-size:.92rem;color:var(--ink-2);border-left:3px solid var(--accent);padding:3px 10px;margin:0 0 12px}
h2.part{font-size:1.2rem;margin:22px 0 4px;padding-bottom:3px;border-bottom:1.5px solid var(--line-strong);display:flex;justify-content:space-between;gap:10px}

.obj{font-style:italic;color:var(--ink-2);margin:4px 0 8px}
.pres p,.part-intro p{margin:.4rem 0}
figure{margin:10px 0;text-align:center}
figure svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
figure.small svg{max-width:420px}
figcaption{font-size:.8rem;color:var(--ink-3);margin-top:3px}
.duo figure{margin:6px 0}
table.t{border-collapse:collapse;margin:6px auto;font-size:.88rem}
table.t th,table.t td{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--paper-2);font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.74rem}
table.t td.n{font-family:var(--f-mono);text-align:right}
.f{font-family:var(--f-mono);font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.12;margin:0 .12em;font-family:var(--f-mono);font-weight:600}
.frac>.nu{padding:0 .2em .06em;border-bottom:1.5px solid currentColor}.frac>.de{padding:.06em .2em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--ink-2);border-radius:2px;padding:0 4px;color:var(--ink-2)}
/* questions */
.q{border-top:1px dotted var(--rule);padding:12px 0 6px}
.q-tete{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.q-n{font-family:var(--f-mono);font-weight:600}.q-pts{margin-left:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.q-txt p{margin:0 0 .35rem}.q-txt .tag{display:none}
.rep{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;margin:8px 0 4px}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px}
.ch{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ch-l{font-family:var(--f-mono);font-weight:600;font-size:.92rem}
.ch input{width:8.5em;font:inherit;font-family:var(--f-mono);font-size:16px;padding:7px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink)}
.ch-u{font-family:var(--f-mono);font-size:.9rem;color:var(--ink-2)}
.ch-g{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch-in{display:inline-flex;align-items:stretch}

.ch-in input{border-radius:0 5px 5px 0}
.pm{font:inherit;font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:40px;border:1px solid var(--rule);border-right:0;border-radius:5px 0 0 5px;background:var(--paper-2);color:var(--ink-2);cursor:pointer;padding:0 6px}

select{font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);max-width:100%}
.redac{display:block;margin-top:10px}.redac>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:3px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.45;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);resize:vertical;min-height:5.5em}
.bilan-aide{margin:0 0 8px;font-size:.92rem}

.bc-tete{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.bc-tete input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.bc-champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 10px;margin-top:8px}
.bc-champs label{display:flex;flex-direction:column;font-size:.78rem;color:var(--ink-3);gap:2px}
.bc-champs.fixe{display:block;font-size:.9rem;color:var(--ink-2);margin-top:2px}
.bilan-c.donne{background:var(--paper-2)}
.trace{margin:10px 0 0}.trace figcaption{margin:0 0 4px}
.fin-copie{margin-top:20px;text-align:center}

.bilan-note{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bilan-note .grand{font-size:2.6rem}
.consigne-corr{flex:1 1 320px;font-size:.92rem}
.feuille.corr .q{padding-bottom:12px}
details.enonce{margin:4px 0 6px}details.enonce>summary{cursor:pointer;color:var(--accent);font-size:.9rem}
ul.mes-rep{list-style:none;margin:6px 0;padding:0}

ul.mes-rep li.ok{background:var(--good-soft)}ul.mes-rep li.ko{background:var(--bad-soft)}
ul.mes-rep .att{color:var(--ink-2);font-size:.88rem}
.ma-redac{border-left:3px solid var(--ink-3);padding:4px 10px;margin:8px 0;background:var(--paper-2)}.ma-redac p{margin:.25em 0}
.ans{background:var(--good-soft);border-left:3px solid var(--good);padding:8px 12px;border-radius:2px;margin:8px 0;font-size:.95rem}
.ans .eyebrow{color:var(--good)}.ans p{margin:.25rem 0}
table.bareme{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
table.bareme th{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;color:var(--ink-3);text-align:left;padding:3px 6px}
table.bareme td{border-top:1px solid var(--rule);padding:6px;vertical-align:middle}
table.bareme tr.ok td{background:var(--good-soft)}table.bareme tr.part td{background:var(--warn-soft)}table.bareme tr.ko td{background:var(--bad-soft)}
table.bareme td.qui{white-space:nowrap;font-size:.82rem}table.bareme td.num{white-space:nowrap;font-family:var(--f-mono)}
.moi{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.moi input{width:20px;height:20px;accent-color:var(--good)}
@media (max-width:560px){table.bareme thead{display:none}table.bareme tr{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--rule)}
  table.bareme td{border:0}table.bareme td:first-child{grid-column:1 / -1;padding-bottom:0}}
table.bilan-corr td.ok{background:var(--good-soft)}table.bilan-corr td.ko,table.bilan-corr tr.ko td{background:var(--bad-soft)}
table.bilan-corr .att{font-size:.8rem;color:var(--ink-2)}

  table.bilan-corr tr{border:1px solid var(--rule);border-radius:5px;margin:0 0 8px;overflow:hidden}
  table.bilan-corr td{border:0;border-top:1px solid var(--rule-2);padding:5px 9px}table.bilan-corr td:first-child{border-top:0;font-weight:600}
  table.bilan-corr td[data-l]::before{content:attr(data-l) " : ";color:var(--ink-3);font-size:.8rem}table.bilan-corr .att{display:inline}table.bilan-corr td br{display:none}table.bilan-corr .att::before{content:" · "}}
.err{color:var(--warn);font-size:.88rem;margin:6px 0}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:640px){.deux{grid-template-columns:1fr}}
.barre-bas{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--paper);border-top:1px solid var(--rule);padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.barre-bas b{font-family:var(--f-mono);font-size:1.2rem}
.fin-corr{margin:18px 0}
.dsb-fond{position:fixed;inset:0;z-index:1000;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}

/* choix du mode */
h2.modes-t{font-size:1.05rem;margin:16px 0 8px}
.modes{display:grid;gap:8px}
.mode{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-height:44px}

.mode.conseil{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.mode-t{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:1.1rem;color:var(--accent)}
.mode-t .etiquette{font-family:var(--f-body);text-transform:none;letter-spacing:0}
.mode-d{display:block;font-size:.9rem;color:var(--ink-2);margin-top:3px}
/* question par question */
.pas-nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px}
.pas-g{display:flex;flex-wrap:wrap;gap:6px}
.pas-p{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:38px;padding:0 6px;border-radius:5px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-3);font-family:var(--f-mono);font-weight:600;font-size:.88rem;text-decoration:none}
.pas-p.ecrit{border-color:var(--ink-3);color:var(--ink)}
.pas-p.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pas-p.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pas-p.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pas-p.cur{outline:2px solid var(--accent);outline-offset:2px;color:var(--ink)}
.pas-score{margin:0 0 10px;font-size:.92rem}.pas-score b{font-family:var(--f-mono);font-size:1.05rem}
details.docs{border:1px solid var(--rule);border-radius:5px;margin:8px 0;background:var(--paper-2)}
details.docs>summary{cursor:pointer;padding:8px 10px}

function sBloc(o){

function sRoue(o){

function sPente(o){
  const th=o.th!=null?o.th:Math.min(Math.atan(o.p/100*2),0.42), cx=40, cy=215;

/* ===== DS n° 2 BLANC · « Actions mécaniques et équilibre » : monte-charge d'un faré sur les hauteurs =====
   Même format, mêmes notions et même barème que le DS 02, autre système et autres valeurs.
   Le sujet est un générateur : ds02b_make(P) construit le DS (sujet, corrigé, barème) et la couche
   interactive du site (champs de réponse, éléments de barème vérifiés automatiquement ou auto-évalués)
   pour un jeu de valeurs P. Le sujet papier utilise les valeurs de référence ds02b_REF ; sur le site,
   le premier essai d'un élève prend ces mêmes valeurs, les suivants des valeurs tirées par ds02b_tirage.
   Les conclusions (exigences respectées ou non) sont les mêmes pour toutes les valeurs tirées. */

const ds02b_REF = { mc: 80, mq: 120, p: 40, pb: 25, L: 1.00, a: 0.35, h: 0.30, hc: 0.20, r: 60, Cmax: 60, lim11: 80, lim13: 1300, fs: 0.80, fm: 0.50, fb: 0.30 };

/* nombre à s chiffres significatifs, virgule décimale, zéros utiles gardés (37,0) ; au-delà de 1 000 : valeur entière */
function ds02b_n(x, s){
  s = s || 3;
  if (!isFinite(x)) return String(x);
  if (x === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(x)));
  let d = Math.max(0, s - 1 - e), v = Math.abs(x).toFixed(d);
  if (d > 0 && Math.floor(Math.log10(Number(v))) > e) v = Math.abs(x).toFixed(d - 1);
  let [ip, fp] = v.split(".");
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (x < 0 ? "−" : "") + ip + (fp ? "," + fp : "");
}
/* valeur de donnée : décimales imposées (0,80 ; 1,00) */
const ds02b_d = (x, dec) => (x < 0 ? "−" : "") + Math.abs(x).toFixed(dec).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");

function ds02b_calc(P){
  const g = 9.81, m = P.mc + P.mq, Pd = m * g;
  const al = Math.atan(P.p / 100), sa = Math.sin(al), ca = Math.cos(al), alb = Math.atan(P.pb / 100);
  const T = Pd * sa, SN = Pd * ca, d = P.L - P.a;
  const MAp = P.a * Pd * ca + P.h * Pd * sa, MAc = -P.hc * T;            /* moments en A, partie A (+ trigonométrique) */
  const NB = (MAp + MAc) / P.L, NA = SN - NB;
  const Tb = Pd * Math.sin(alb), C = T * P.r / 1000, Cb = Tb * P.r / 1000, Clim = P.lim11 / 100 * P.Cmax;
  const cb = Math.cos(alb), NApb = (d * Pd * cb - P.h * Tb + P.hc * Tb) / P.L, NBpb = Pd * cb - NApb;   /* partie A sur le tronçon bas */
  const TA = Pd * sa, MBp = -d * Pd * ca + P.h * Pd * sa, NAb = -MBp / P.L, NBb = SN - NAb;   /* partie B : roues avant bloquées */
  const rap = TA / NAb, th = deg(Math.atan(rap));
  return { g, m, Pd, al, ad: deg(al), sa, ca, alb, abd: deg(alb), T, SN, d, MAp, MAc, NB, NA, Tb, C, Cb, Clim,
    TA, MBp, NAb, NBb, rap, th, phs: deg(Math.atan(P.fs)), phm: deg(Math.atan(P.fm)), phb: deg(Math.atan(P.fb)),
    pc: P.p / 100, usage: C / P.Cmax * 100, NApb, NBpb, m13: (P.lim13 - NApb) / P.lim13 * 100, m13a: (P.lim13 - NA) / P.lim13 * 100, m11: (Clim - C) / Clim * 100,
    mfm: (P.fm - P.p / 100) / P.fm * 100 };
}

/* les conclusions du sujet ne changent pas avec les valeurs : on ne garde que les tirages qui les respectent,
   avec au moins 3 % d'écart à chaque seuil (jamais de conclusion à la limite) */
function ds02b_valide(P, c){
  return c.NA > c.NB && c.NB > 0 && c.NApb > c.NBpb && c.NApb <= 0.97 * P.lim13 && c.NApb >= 0.80 * P.lim13
    && c.C <= 0.97 * c.Clim && c.C >= 0.75 * c.Clim
    && c.NAb > 0 && c.rap <= 0.97 * P.fs && c.rap >= 1.03 * P.fm && c.th <= 43
    && c.pc <= 0.97 * P.fm && c.pc >= 1.03 * P.fb && P.pb / 100 <= 0.97 * P.fb;
}
function ds02b_tirage(rand){
  const pick = (a) => a[Math.floor(rand() * a.length)];
  for (let k = 0; k < 5000; k++){
    const P = { mc: pick([70, 75, 80, 85, 90]), mq: pick([100, 110, 120, 130, 140]), p: pick([36, 38, 40, 42, 44]), pb: pick([20, 22, 24, 25]),
      L: pick([0.90, 0.95, 1.00, 1.05, 1.10]), a: pick([0.30, 0.35, 0.40]), h: pick([0.25, 0.30, 0.35]), hc: pick([0.15, 0.20, 0.25]),
      r: pick([50, 55, 60, 65, 70]), lim11: 80, fs: pick([0.75, 0.80, 0.85]), fm: pick([0.45, 0.50, 0.55]), fb: pick([0.25, 0.30, 0.35]) };
    const c0 = ds02b_calc(Object.assign({}, P, { Cmax: 60, lim13: 1200 }));
    P.lim13 = Math.ceil(c0.NApb / 0.97 / 100) * 100;                /* seuil Id 1.3 : centaine au-dessus de l'essieu avant sur le tronçon bas, le plus chargé */
    P.Cmax = Math.ceil(c0.C / (0.97 * P.lim11 / 100) / 5) * 5;      /* couple maximal du treuil, multiple de 5 N·m */
    if (ds02b_valide(P, ds02b_calc(P))) return P;
  }
  return Object.assign({}, ds02b_REF);
}

/* svg avec viewBox libre */

const ds02b_fig = (svgHtml, caption, mw) => `<figure>${svgHtml.replace("<svg ", `<svg style="max-width:${mw}mm" `)}<figcaption>${caption}</figcaption></figure>`;

/* Figure 1 : vue d'ensemble (vue de côté, échelle non respectée) */
function ds02b_site(P){

  s += L(D[0] + 12, D[1] - 8, D[0] + 2, D[1] - 34, "v-thin") + T(D[0] - 2, D[1] - 38, "treuil électrique", "v-sm", "middle");
  const cb = M(82, 11.5); s += L(cb[0], cb[1] - 2, cb[0] - 6, cb[1] - 26, "v-thin") + T(cb[0] - 8, cb[1] - 30, "câble", "v-sm", "middle");
  const pk = M(13, 45); s += L(pk[0], pk[1] - 1, pk[0] - 22, pk[1] - 20, "v-thin") + multi(pk[0] - 26, pk[1] - 34, ["packs d'eau, bouteille", "de gaz, courses"], "v-sm", "middle", 11);
  const wA = M(42, 5.5); s += L(wA[0] + 3, wA[1] + 5, wA[0] + 10, wA[1] + 44, "v-thin") + multi(wA[0] + 12, wA[1] + 56, ["frein de sécurité", "(roues avant)"], "v-sm", "middle", 12);
  const ch = M(20, 9); s += L(ch[0] - 1, ch[1] + 3, ch[0] - 22, ch[1] + 42, "v-thin") + T(ch[0] - 26, ch[1] + 53, "chariot", "v-sm", "middle");

}

/* Figure 2 : extrait du diagramme des exigences */
function ds02b_exig(P){
  const R = (x, y, w, h, nom, id, txt, wrap) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="v-box"/>`
    + T(x + w / 2, y + 11, "«requirement»", "v-ster", "middle") + T(x + w / 2, y + 24, esc(nom), "v-smb", "middle")
    + T(x + 6, y + 37, `Id = "${id}"`, "v-sm") + multi(x + 6, y + 50, wrapTxt(`Text = "${txt}"`, wrap), "v-sm", "start", 11.5);
  const nb = " ";
  let s = R(40, 4, 320, 68, "Monter les charges au faré", "1", `Permettre de monter jusqu'au faré ${P.mq}${nb}kg de charges sans les porter dans l'escalier`, 68);
  s += `<circle cx="200" cy="78" r="6" class="v-box"/>` + L(194, 78, 206, 78, "v-thin") + L(200, 72, 200, 84, "v-thin");
  const xs = [2, 136, 270], w = 128, y = 96, h = 90;
  [["Traction", "1.1", `Le couple demandé au treuil ne dépasse pas ${P.lim11}${nb}% de son couple maximal`],
   ["Immobilisation", "1.2", `Câble rompu : le chariot chargé reste immobile sur la piste, même mouillée`],
   ["Appui", "1.3", `Chaque essieu du chariot supporte au plus ${ds02b_d(P.lim13, 0)}${nb}N`]].forEach((r, i) => {
    const cx = xs[i] + w / 2;
    s += `<polyline points="200,84 ${cx},90 ${cx},${y}" class="v-thin"/>` + R(xs[i], y, w, h, r[0], r[1], r[2], 24); });
  ["Treuil électrique", "Frein de sécurité", "Chariot à 4 roues"].forEach((b, i) => {
    const cx = xs[i] + w / 2, by = y + h + 22;
    s += `<rect x="${xs[i] + 14}" y="${by}" width="100" height="34" rx="3" class="v-box"/>` + T(cx, by + 13, "«block»", "v-ster", "middle") + T(cx, by + 27, b, "v-smb", "middle");
    s += `<line x1="${cx}" y1="${by}" x2="${cx}" y2="${y + h + 1}" class="v-inf" marker-end="url(#m-d)"/>` + T(cx + 6, by - 7, "«satisfy»", "v-ster"); });

/* Figure 3 : modèle plan de l'ensemble E sur le tronçon étudié (cotes en m) */
function ds02b_modele(P, c){
  const al = c.al, ca = c.ca, sa = c.sa, k = 150, O = [104, 196], rot = `rotate(${(-deg(al)).toFixed(3)} ${O[0]} ${O[1]})`;
  const f1 = (v) => (+v).toFixed(1);
  const Q = (s, h) => [O[0] + k * (s * ca - h * sa), O[1] - k * (s * sa + h * ca)];     /* s le long de la piste, h perpendiculaire (m) */
  const Qp = (s, h) => Q(s, h).map(f1).join(" ");
  const poly = (a, cl) => `<polygon points="${a.map((p) => Q(p[0], p[1]).map(f1).join(",")).join(" ")}" class="${cl}"/>`;
  const X = (s) => O[0] + k * s, Y = (h) => O[1] - k * h;                                  /* repère tourné */
  const vcote = (s0, h1, h2) => `<line x1="${f1(X(s0))}" y1="${f1(Y(h1))}" x2="${f1(X(s0))}" y2="${f1(Y(h2))}" class="v-cote" marker-start="url(#m-d)" marker-end="url(#m-d)"/>`;
  const Ld = P.L, dG = c.d, rw = 0.09;
  let s = `<g transform="${rot}">` + ground(X(-0.62), X(Ld + 0.62), O[1]);
  s += L(X(0), Y(-0.03), X(0), Y(-0.33), "v-cote") + L(X(Ld), Y(-0.03), X(Ld), Y(-0.33), "v-cote");
  s += L(X(dG), Y(P.h), X(dG), Y(0), "v-dash") + L(X(dG), Y(-0.03), X(dG), Y(-0.19), "v-cote");
  s += cote(X(0), X(dG), Y(-0.15), ds02b_d(dG, 2)) + cote(X(0), X(Ld), Y(-0.29), ds02b_d(Ld, 2));
  s += L(X(dG), Y(P.h), X(-0.50), Y(P.h), "v-dash") + vcote(-0.44, 0, P.h) + T(X(-0.41), Y(P.h / 2) + 4, ds02b_d(P.h, 2), "v-cap");
  s += vcote(Ld + 0.47, 0, P.hc) + T(X(Ld + 0.50), Y(P.hc / 2) + 4, ds02b_d(P.hc, 2), "v-cap");
  s += `</g>`;
  /* roues, châssis, plateau et charges */
  [0, Ld].forEach((x) => { const cc = Q(x, rw); s += `<circle cx="${f1(cc[0])}" cy="${f1(cc[1])}" r="${rw * k}" class="v-wheel"/><circle cx="${f1(cc[0])}" cy="${f1(cc[1])}" r="3" class="v-piv"/>`; });
  s += poly([[-0.12, 0.12], [Ld + 0.12, 0.12], [Ld + 0.12, 0.20], [-0.12, 0.20]], "v-body");
  s += poly([[-0.04, 0.20], [Ld + 0.04, 0.20], [Ld + 0.04, 0.24], [-0.04, 0.24]], "v-box");
  s += poly([[0.04, 0.24], [Ld * 0.46, 0.24], [Ld * 0.46, 0.46], [0.04, 0.46]], "v-body");
  s += poly([[Ld * 0.50, 0.24], [Ld * 0.92, 0.24], [Ld * 0.92, 0.40], [Ld * 0.50, 0.40]], "v-body");
  s += `<g transform="${rot}">` + T(X(Ld * 0.25), Y(0.33), "charges", "v-cap", "middle") + `</g>`;
  /* câble parallèle à la piste, attaché en C à l'avant du châssis */
  const C = Q(Ld + 0.12, P.hc), Ce = Q(Ld + 0.62, P.hc);
  s += L(C[0], C[1], Ce[0], Ce[1], "v-ink");
  const cl = Q(Ld + 0.52, P.hc); s += L(cl[0], cl[1] - 3, cl[0] - 4, 58, "v-thin") + T(cl[0] - 6, 42, "câble", "v-sm", "middle") + T(cl[0] - 14, 54, "(vers le treuil)", "v-sm", "middle");
  const B = Q(0, 0), A = Q(Ld, 0), G = Q(dG, P.h);
  s += pt(B[0], B[1], "B", -27, -3) + pt(A[0], A[1], "A", 9, 15) + pt(C[0], C[1], "", 0, 0) + T(C[0] + 6, C[1] - 7, "C", "v-lab s");
  s += gSym(G[0], G[1]) + T(G[0] + 10, G[1] - 9, "G", "v-lab");
  /* repère lié à la piste et angle α */
  const o = [34, 70], lx = 74, r = 56;
  s += L(o[0], o[1], o[0] + lx + 8, o[1], "v-dash") + T(o[0] + lx + 12, o[1] + 4, "horizontale", "v-cap");
  s += L(o[0], o[1], o[0] + lx * ca, o[1] - lx * sa, "v-ink", "k") + T(o[0] + lx * ca + 5, o[1] - lx * sa - 2, "x", "v-lab s");
  s += L(o[0], o[1], o[0] - lx * 0.72 * sa, o[1] - lx * 0.72 * ca, "v-ink", "k") + T(o[0] - lx * 0.72 * sa - 12, o[1] - lx * 0.72 * ca + 8, "y", "v-lab s");
  s += `<circle cx="${o[0]}" cy="${o[1]}" r="5" class="v-box"/><circle cx="${o[0]}" cy="${o[1]}" r="1.6" class="v-pt"/>` + T(o[0] - 9, o[1] + 5, "z", "v-lab s", "end");
  s += `<path d="M${o[0] + r} ${o[1]} A${r} ${r} 0 0 0 ${f1(o[0] + r * ca)} ${f1(o[1] - r * sa)}" class="v-cote"/>` + T(o[0] + r + 4, o[1] - 3, "α", "v-lab s");
  return svg(262, s, "Modèle plan : chariot chargé sur la piste inclinée d'un angle alpha, roues arrière en B et roues avant en A, centre de gravité G, câble parallèle à la piste fixé en C");
}

/* DR1 : cône d'adhérence au contact des roues avant bloquées.
   o.sol : corrigé ; o.cones : [{phi, lab}] cônes à tracer ; o.theta : inclinaison de R_A (degrés, > 0 vers le haut de la piste) */
function ds02b_cone(P, c, o){
  o = o || {};
  const al = c.al, ca = c.ca, sa = c.sa, A = [200, 196];
  const f1 = (v) => (+v).toFixed(1);
  const u = [ca, -sa], n = [-sa, -ca];
  const at = (psi, r) => { const p = rad(psi); return [A[0] + r * (Math.cos(p) * n[0] + Math.sin(p) * u[0]), A[1] + r * (Math.cos(p) * n[1] + Math.sin(p) * u[1])]; };
  const ap = (psi, r) => at(psi, r).map(f1).join(" ");
  const lc = (x, y, t, a) => `<text x="${f1(x)}" y="${f1(y)}" text-anchor="${a || "start"}" style="fill:var(--coulomb);font-family:var(--f-body);font-size:11px;font-weight:600">${t}</text>`;
  let s = `<g transform="rotate(${(-deg(al)).toFixed(3)} ${A[0]} ${A[1]})">` + ground(52, 372, A[1]) + `</g>`;
  const cc = [A[0] + 26 * n[0], A[1] + 26 * n[1]]; s += `<circle cx="${f1(cc[0])}" cy="${f1(cc[1])}" r="26" class="v-thin"/>`;
  const Rg = 150;
  s += `<path d="M${ap(-45, Rg)} A${Rg} ${Rg} 0 0 1 ${ap(45, Rg)}" class="v-cote"/>`;
  for (let p = -45; p <= 45; p += 5){ const a1 = at(p, Rg), a2 = at(p, Rg + (p % 10 === 0 ? 8 : 4)); s += L(a1[0], a1[1], a2[0], a2[1], "v-cote");
    if (p % 10 === 0){ const t = at(p, Rg + 18); s += T(t[0], t[1] + 4, String(Math.abs(p)), "v-cap", "middle"); } }
  const nn = at(0, Rg + 34); s += L(A[0], A[1], ...at(0, Rg - 4), "v-dash") + T(nn[0], nn[1], "normale à la piste", "v-cap", "middle");
  const cones = o.cones || (o.sol ? [{ phi: c.phs, lab: "piste sèche" }, { phi: c.phm, lab: "piste mouillée" }] : []);
  /* le plus large en tireté, le second en trait plein un peu plus foncé ; légende sous la piste, à droite */
  const sty = ['class="v-cone"', 'style="fill:var(--coulomb);fill-opacity:.2;stroke:var(--coulomb);stroke-width:1.5"'];
  cones.forEach((k, i) => {
    if (!(k.phi > 0 && k.phi < 80)) return;
    s += `<path d="M${A[0]} ${A[1]} L${ap(-k.phi, 122)} A122 122 0 0 1 ${ap(k.phi, 122)} Z" ${sty[i % 2]}/>`;
    const y = 214 + 19 * i;
    s += `<rect x="236" y="${y - 9}" width="15" height="10" ${sty[i % 2]}/>` + lc(257, y, `${k.lab} : φ = ${ds02b_n(k.phi, 3)}°`);
  });
  const th = o.theta != null ? o.theta : (o.sol ? c.th : null);
  if (th != null && isFinite(th) && Math.abs(th) < 89){
    const r1 = at(th, 132); s += L(A[0], A[1], r1[0], r1[1], "v-r", "c");
    const rl = at(th + (th >= 0 ? 6 : -6), 116); s += T(rl[0] + 1, rl[1] + 4, "R", "v-lab c") + T(rl[0] + 12, rl[1] + 9, "A", "v-lab c s");
    const t0 = at(th, 70); s += `<path d="M${ap(0, 70)} A70 70 0 0 ${th >= 0 ? 1 : 0} ${ap(th, 70)}" class="v-cote"/>` + L(t0[0] + 2, t0[1], 252, t0[1], "v-thin") + T(255, t0[1] + 4, "θ = " + ds02b_n(Math.abs(th), 3) + "°", "v-lab c s");
  }
  s += pt(A[0], A[1], "A", 8, 17);
  s += T(14, 214, "vers le bas de la piste", "v-cap") + T(392, 104, "vers le treuil", "v-cap", "end");
  return svg(266, s, o.sol ? `Cônes d'adhérence au point A et action de la piste sur les roues avant bloquées, inclinée de ${ds02b_n(c.th, 3)} degrés sur la normale` : "Contact au point A entre la piste et les roues avant bloquées, avec une échelle angulaire graduée depuis la normale");
}

/* DR1 : tableau du bilan des actions mécaniques extérieures */
function ds02b_bilan(P, c, sol){
  const rows = [["Poids de E", "G", "verticale", "vers le bas", `P = m·g = ${ds02b_n(c.Pd, 4)} N`],
    ["Action du câble sur E", "C", "parallèle à la piste", "vers le haut de la piste (vers le treuil)", `T : inconnue<br>(${ds02b_n(c.T)} N, question A.2)`],
    ["Action de la piste sur les roues avant", "A", "perpendiculaire à la piste", "de la piste vers les roues", `N<sub>A</sub> : inconnue<br>(${ds02b_n(c.NA / 1000)} kN, question A.4)`],
    ["Action de la piste sur les roues arrière", "B", "perpendiculaire à la piste", "de la piste vers les roues", `N<sub>B</sub> : inconnue<br>(${ds02b_n(c.NB)} N, question A.4)`]];
  return `<table class="t" style="width:100%"><thead><tr><th style="width:27%">Action mécanique extérieure</th><th style="width:12%">Point d'application</th><th style="width:19%">Direction</th><th style="width:21%">Sens</th><th>Norme</th></tr></thead><tbody>`
    + rows.map((r, i) => `<tr style="height:${sol || !i ? "auto" : "3.6em"}">` + r.map((cc, j) => `<td${j === 1 ? ' style="text-align:center"' : ""}>${sol || !i ? cc : ""}</td>`).join("") + `</tr>`).join("")
    + `</tbody></table>`;
}

/* le bilan sur le site : actions proposées (dont trois pièges), puis point, direction, sens, norme pour chacune */
const ds02b_BILAN = {
  candidats: [
    { id: "cable", lab: "Action du câble sur E", ok: true, point: "C", dir: "para", sens: "haut" },
    { id: "pisteA", lab: "Action de la piste sur les roues avant", ok: true, point: "A", dir: "perp", sens: "piste" },
    { id: "pisteB", lab: "Action de la piste sur les roues arrière", ok: true, point: "B", dir: "perp", sens: "piste" },
    { id: "treuil", lab: "Action du treuil sur E", ok: false, pourquoi: "le treuil n'est pas en contact avec E : il agit par l'intermédiaire du câble, déjà compté" },
    { id: "charges", lab: "Action des charges sur le chariot", ok: false, pourquoi: "les charges font partie de E : action intérieure" },
    { id: "frein", lab: "Action du frein sur les roues", ok: false, pourquoi: "le frein fait partie de E (et il est desserré pendant la montée)" }
  ],
  points: ["A", "B", "C", "G"],
  dirs: [["verticale", "verticale"], ["para", "parallèle à la piste"], ["perp", "perpendiculaire à la piste"]],
  sens: [["bas", "vers le bas"], ["haut", "vers le haut de la piste (vers le treuil)"], ["descente", "vers le bas de la piste"], ["piste", "de la piste vers les roues"]],
  normes: [["inconnue", "inconnue"], ["connue", "connue"]]
};

function ds02b_make(P){
  const c = ds02b_calc(P), n = ds02b_n, dd = ds02b_d;
  const fr = (a, b) => FRAC(a, b);
  const sub = (x) => `<sub>${x}</sub>`;
  const NA = "N" + sub("A"), NB = "N" + sub("B"), TA = "T" + sub("A"), TB = "T" + sub("B"), RA = "R" + sub("A"), Ct = "C" + sub("t");
  const Pp = n(c.Pd, 4), pc = dd(P.p, 0), pbc = dd(P.pb, 0);
  const Pca = n(c.Pd * c.ca, 5), Psa = n(c.Pd * c.sa, 4);
  const bras = (x) => dd(x, 2);
  const d2 = (x) => dd(x, 2);                                    /* calculs intermédiaires : deux décimales, pour que chaque égalité affichée soit juste */
  const r3 = (x) => Number(Number(x).toPrecision(3));
  /* écart relatif posé en fraction, calculé avec les nombres affichés (l'égalité écrite est juste) */
  const lu = (t) => parseFloat(String(t).replace(/[\s\u202f\u00a0]/g, "").replace("−", "-").replace(",", "."));
  const ecart = (_r, _v, refTxt, vTxt) => `écart relatif ${fr("|" + refTxt + " − " + vTxt + "|", refTxt)}${F(" × 100 = " + n(Math.abs(lu(refTxt) - lu(vTxt)) / Math.abs(lu(refTxt)) * 100) + " %")}`;
  /* champs numériques : val, unité ; tol en % (2 % par défaut) */
  const nb = (id, lab, unite, val, extra) => Object.assign({ id, type: "nombre", lab, unite, val }, extra || {});
  const Q = [];

  /* ---------------- Partie A ---------------- */
  Q.push({ n: "A.1", pts: 2.5, notion: "meca-actions", dr: "DR1",
    q: `<p>On isole l'ensemble E. Compléter, sur le document réponse DR1, le tableau du bilan des actions mécaniques extérieures appliquées à E : nom de l'action, point d'application, direction, sens et norme (valeur si elle est connue, « inconnue » sinon). La première ligne est donnée en exemple.</p><p>Justifier que les actions des charges sur le chariot n'apparaissent pas dans ce bilan, puis, à partir des hypothèses, que l'action de la piste sur une roue non freinée est perpendiculaire à la piste.`,
    rep: `<p>Actions mécaniques extérieures à E (voir le DR1 corrigé) : le poids de E (en G, vertical, vers le bas, ${Pp} N) ; l'action du câble (en C, parallèle à la piste, vers le treuil, norme T inconnue) ; l'action de la piste sur les roues avant (en A, perpendiculaire à la piste, de la piste vers les roues, norme ${NA} inconnue) ; l'action de la piste sur les roues arrière (en B, perpendiculaire à la piste, norme ${NB} inconnue).</p><p>Les charges et le chariot font tous deux partie de E : leurs actions mutuelles sont intérieures à E et n'apparaissent pas dans le bilan. Le treuil n'agit sur E que par le câble, compté une seule fois.</p><p>Justification : une roue non freinée, de poids négligé, n'est soumise qu'à deux actions : celle de l'essieu, qui passe par le centre de la roue puisque la liaison pivot est parfaite, et celle de la piste au point de contact. À l'équilibre, ces deux actions ont la même droite d'action, celle qui joint le point de contact au centre de la roue : elle est perpendiculaire à la piste. Sans frein ni résistance au roulement, la piste n'exerce donc aucun effort tangentiel sur la roue.</p>`,
    ind: [
      { t: "Identification des trois actions : câble, piste en A, piste en B", p: 0.75, frac: (r) => ds02b_noteBilan(r.bilan).ident },
      { t: "Points d'application C, A, B et directions", p: 0.75, frac: (r) => ds02b_noteBilan(r.bilan).pdir },
      { t: "Sens corrects et normes inconnues signalées", p: 0.5, frac: (r) => ds02b_noteBilan(r.bilan).sens },
      { t: "Actions des charges sur le chariot : intérieures à E, elles n'apparaissent pas", p: 0.25 },
      { t: "Justification de la direction perpendiculaire à la piste (deux actions, liaison pivot parfaite, pas d'effort tangentiel)", p: 0.25 }],
    champs: [{ id: "bilan", type: "bilan" }], texte: "Justifications : actions des charges sur le chariot, direction de l'action de la piste sur une roue non freinée.",
    err: "ajouter une action du treuil en plus de celle du câble, ou des actions intérieures à E (charges sur chariot) ; représenter les actions de la piste verticales au lieu de perpendiculaires à la piste." });

  Q.push({ n: "A.2", pts: 2, notion: "meca-statique",
    q: `<p>La pente du tronçon étudié vaut ${pc} %. Calculer l'angle α de la piste. En appliquant le théorème de la résultante statique à E, en projection sur l'axe x puis sur l'axe y, déterminer la norme T de l'action du câble, puis la somme ${NA} + ${NB} (figures 3 et 4).</p>`,
    rep: `<p>Pente de ${pc} % : ${F("tan α = " + dd(P.p / 100, 2))}, d'où ${F("α = arctan " + dd(P.p / 100, 2) + " = " + n(c.ad) + "°")}. Masse de E : ${P.mc} + ${P.mq} = ${c.m} kg, d'où ${F("P = " + c.m + " × 9,81 = " + Pp + " N")}.</p><p>Projection sur x : ${F("T − P·sin α = 0")} ⇒ ${F("T = " + Pp + " × sin " + n(c.ad, 4) + "° = " + n(c.T) + " N")}.</p><p>Projection sur y : ${F(NA + " + " + NB + " − P·cos α = 0")} ⇒ ${F(NA + " + " + NB + " = " + Pp + " × cos " + n(c.ad, 4) + "° = " + n(c.SN, 4) + " N")}, soit ${n(c.SN / 1000)} kN.</p>`,
    ind: [
      { t: `α = arctan ${dd(P.p / 100, 2)} = ${n(c.ad)}°`, p: 0.5, champs: ["alpha"] },
      { t: `Projection sur x et T = ${n(c.T)} N`, p: 0.75, champs: ["T"] },
      { t: `Projection sur y et N_A + N_B = ${n(c.SN / 1000)} kN`, p: 0.75, champs: ["SN"] }],
    champs: [nb("alpha", "α", "°", c.ad), nb("T", "T", "N", c.T), nb("SN", `${NA} + ${NB}`, "N", c.SN)],
    err: `prendre α = ${pc}° ou sin α = ${dd(P.p / 100, 2)} (la pente est la tangente de l'angle) ; inverser sinus et cosinus dans les composantes du poids.` });

  Q.push({ n: "A.3", pts: 1.5, notion: "meca-actions",
    q: `<p>À partir de la figure 3, calculer, ou exprimer en fonction de ${NB}, en projection sur l'axe z, le moment au point A de chacune des actions mécaniques extérieures appliquées à E ; pour le poids, utiliser ses composantes P·sin α et P·cos α. Justifier la valeur du bras de levier de l'action du câble.</p>`,
    rep: `<p>Le long de la piste, G est à ${bras(P.L)} − ${bras(c.d)} = ${bras(P.a)} m de A, du côté de B, et à ${bras(P.h)} m de la piste.</p><p>Poids : la composante P·cos α (perpendiculaire à la piste) a pour bras de levier ${bras(P.a)} m, la composante P·sin α (vers le bas de la piste) a pour bras de levier ${bras(P.h)} m ; elles tendent toutes deux à faire tourner E dans le sens trigonométrique autour de A :<br>${F("M<sub>A</sub>(poids) = +" + bras(P.a) + " × " + d2(c.Pd * c.ca) + " + " + bras(P.h) + " × " + d2(c.Pd * c.sa) + " = +" + d2(c.MAp) + " N·m")}, soit +${n(c.MAp)} N·m.</p><p>Câble : le bras de levier est la distance de A à la droite d'action du câble, parallèle à la piste à ${bras(P.hc)} m de celle-ci (la position de C le long de la piste n'intervient pas) :<br>${F("M<sub>A</sub>(câble) = −" + bras(P.hc) + " × " + d2(c.Pd * c.sa) + " = " + d2(c.MAc) + " N·m")}, soit ${n(c.MAc)} N·m.</p><p>Piste : ${F("M<sub>A</sub>(piste → roues B) = −" + bras(P.L) + " × " + NB)} et ${F("M<sub>A</sub>(piste → roues A) = 0")} (action appliquée en A).</p>`,
    ind: [
      { t: `Moment du poids : +${bras(P.a)}·P·cos α + ${bras(P.h)}·P·sin α = +${n(c.MAp)} N·m (bras de levier et signes)`, p: 0.75, champs: ["MAp"] },
      { t: `Moment du câble : −${bras(P.hc)} × T = ${n(c.MAc)} N·m`, p: 0.25, champs: ["MAc"] },
      { t: `Bras de levier du câble justifié : distance de A à la droite d'action, ${bras(P.hc)} m`, p: 0.25 },
      { t: `Moments des actions de la piste : −${bras(P.L)}·N_B et 0`, p: 0.25, champs: ["kB", "MAA"] }],
    champs: [nb("MAp", "M<sub>A</sub>(poids)", "N·m", c.MAp), nb("MAc", "M<sub>A</sub>(câble)", "N·m", c.MAc),
      nb("kB", `M<sub>A</sub>(piste → roues B) = k × ${NB}, k`, "m", -P.L, { tol: 1 }), nb("MAA", "M<sub>A</sub>(piste → roues A)", "N·m", 0, { abs: 0.5 })],
    texte: "Justification du bras de levier de l'action du câble.",
    err: `prendre ${bras(c.d)} m (distance de B) comme bras de levier du poids, ou oublier la composante P·sin α ; prendre la distance de A à C mesurée le long de la piste comme bras de levier de l'action du câble ; erreurs de signe.` });

  Q.push({ n: "A.4", pts: 1.5, notion: "meca-statique",
    q: `<p>Justifier l'intérêt d'écrire le théorème du moment statique au point A. En appliquant ce théorème à E, au point A et en projection sur l'axe z, déterminer ${NB}, puis en déduire ${NA}. Conclure quant au respect de l'exigence Id 1.3.</p>`,
    rep: `<p>Au point A, le moment de l'action de la piste sur les roues avant est nul : l'équation ne contient plus qu'une inconnue, ${NB}.</p><p>${F("−" + bras(P.L) + "·" + NB + " + " + d2(c.MAp) + " − " + d2(-c.MAc) + " = 0")} ⇒ ${F(NB + " = ")}${fr(d2(c.MAp + c.MAc), bras(P.L))}${F(" = " + n(c.NB) + " N")}.</p><p>Avec la question A.2 : ${F(NA + " = " + d2(c.SN) + " − " + d2(c.MAp + c.MAc) + " = " + n(c.NA, 4) + " N")}, soit ${n(c.NA / 1000)} kN.</p><p>Sur le tronçon de ${pc} %, l'essieu le plus chargé est l'essieu avant : ${NA} = ${n(c.NA / 1000)} kN ≤ ${n(P.lim13 / 1000, 3)} kN (et ${NB} = ${n(c.NB)} N, encore plus bas), ${ecart(P.lim13, r3(c.NA), dd(P.lim13, 0), n(c.NA, 4))} : l'exigence Id 1.3 est respectée sur ce tronçon.</p><p>Remarque : sur le tronçon de ${pbc} %, le même calcul (α = ${n(c.abd, 4)}°) donne ${NA} = ${n(c.NApb / 1000)} kN. L'essieu avant y est un peu plus chargé, car la composante du poids perpendiculaire à la piste, P·cos α, y est plus grande ; ${n(c.NApb / 1000)} kN reste sous ${n(P.lim13 / 1000, 3)} kN (${ecart(P.lim13, r3(c.NApb), dd(P.lim13, 0), n(c.NApb, 4))}) : l'exigence Id 1.3 est respectée sur toute la piste.</p>`,
    ind: [
      { t: "Intérêt du point A : moment de l'action en A nul, une seule inconnue", p: 0.25 },
      { t: `Équation des moments et N_B = ${n(c.NB)} N`, p: 0.5, champs: ["NB"] },
      { t: `N_A = ${n(c.NA / 1000)} kN`, p: 0.25, champs: ["NA"] },
      { t: `Conclusion sur l'exigence Id 1.3 avec l'essieu le plus chargé (N_A = ${n(c.NA / 1000)} kN ≤ ${n(P.lim13 / 1000, 3)} kN)`, p: 0.5 }],
    champs: [nb("NB", NB, "N", c.NB), nb("NA", NA, "N", c.NA)],
    texte: "Intérêt du point A, équation des moments, conclusion sur l'exigence Id 1.3.",
    err: `conclure avec ${NB} seulement, alors que c'est l'essieu le plus chargé, ici l'essieu avant, qui renseigne sur l'exigence ; reprendre ${NA} + ${NB} au lieu de ${NB} dans l'équation des moments.` });

  Q.push({ n: "A.5", pts: 2.5, notion: "ana-exigences",
    q: `<p>Le tambour du treuil a un rayon d'enroulement r = ${P.r} mm (le câble s'y enroule en une seule couche) ; le treuil fournit sur l'arbre du tambour un couple de ${P.Cmax} N·m au maximum. Exprimer le moment, par rapport à l'axe du tambour, de l'action du câble sur le tambour. Expliquer pourquoi le couple demandé au treuil est plus grand sur le tronçon de ${pc} % que sur celui de ${pbc} %. Calculer ce couple dans la situation la plus défavorable, puis conclure quant au respect de l'exigence Id 1.1.</p>`,
    rep: `<p>Le câble, tangent au tambour, exerce sur lui un effort de norme T à la distance r de son axe : le moment de cette action par rapport à l'axe du tambour vaut ${F("M = T × r")}. À vitesse constante, le tambour est en équilibre : le couple fourni par le treuil compense ce moment, ${F("C<sub>t</sub> = T × r")}.</p><p>À vitesse constante, ${F("T = P·sin α")} (question A.2) : à masse égale, T augmente avec l'angle de la pente, donc le couple aussi. Sur le tronçon de ${pbc} % (α = arctan ${dd(P.pb / 100, 2)} = ${n(c.abd, 4)}°), ${F("T = " + Pp + " × sin " + n(c.abd, 4) + "° = " + n(c.Tb) + " N")} ; sur le tronçon de ${pc} %, T = ${n(c.T)} N.</p><p>Situation la plus défavorable : chariot plein sur le tronçon de ${pc} % : ${F("C<sub>t</sub> = " + d2(c.T) + " × " + dd(P.r / 1000, 3) + " = " + n(c.C) + " N·m")} (contre ${n(c.Tb)} × ${dd(P.r / 1000, 3)} = ${n(c.Cb)} N·m sur le tronçon de ${pbc} %). L'exigence Id 1.1 limite le couple à ${F(dd(P.lim11 / 100, 2) + " × " + P.Cmax + " = " + n(c.Clim) + " N·m")}.</p><p>${Ct} = ${n(c.C)} N·m &lt; ${n(c.Clim)} N·m : l'exigence Id 1.1 est respectée sur toute la piste, ${ecart(c.Clim, r3(c.C), n(c.Clim), n(c.C))}. Le treuil n'utilise que ${fr(n(c.C, 4), String(P.Cmax))}${F(" × 100 = " + n(c.usage) + " %")} de son couple maximal, ce qui laisse une marge pour la résistance au roulement, négligée dans l'étude.</p>`,
    ind: [
      { t: "Moment de l'action du câble sur le tambour : M = T × r ; à vitesse constante, couple du treuil C_t = T × r", p: 0.5 },
      { t: `T = P·sin α augmente avec la pente : cas le plus défavorable, tronçon de ${pc} %`, p: 0.75 },
      { t: `C_t = ${n(c.C)} N·m`, p: 0.5, champs: ["C"] },
      { t: `Limite de l'exigence : ${dd(P.lim11 / 100, 2)} × ${P.Cmax} = ${n(c.Clim)} N·m`, p: 0.25, champs: ["Clim"] },
      { t: `Conclusion justifiée sur l'exigence Id 1.1 (${n(c.C)} N·m < ${n(c.Clim)} N·m)`, p: 0.5 }],
    champs: [nb("C", "Couple demandé au treuil, cas le plus défavorable : C<sub>t</sub>", "N·m", c.C), nb("Clim", "Couple autorisé par l'exigence Id 1.1", "N·m", c.Clim)],
    texte: "Expression du moment, explication du cas le plus défavorable, conclusion sur l'exigence Id 1.1.",
    err: `calculer le couple sur le tronçon de ${pbc} % ; oublier la limite de ${P.lim11} % ; oublier de convertir les millimètres en mètres ; écrire un couple en N au lieu de N·m.` });

  /* ---------------- Partie B ---------------- */
  Q.push({ n: "B.1", pts: 2, notion: "meca-frottement",
    q: `<p>Énoncer les lois de Coulomb pour le contact entre la piste et les roues avant bloquées : condition de non-glissement, puis relation vérifiée à la limite du glissement. Calculer l'angle φ du cône d'adhérence pour une piste sèche, puis pour une piste mouillée (figure 5).</p>`,
    rep: `<p>Tant qu'il n'y a pas de glissement : ${F(TA + " ≤ f·" + NA)} ; l'action ${RA} est à l'intérieur du cône d'adhérence de sommet A, d'axe la normale à la piste et de demi-angle φ. À la limite du glissement : ${F(TA + " = f·" + NA)} ; ${RA} est sur le bord du cône.</p><p>${F("f = tan φ")} : piste sèche, ${F("φ = arctan " + dd(P.fs, 2) + " = " + n(c.phs) + "°")} ; piste mouillée, ${F("φ = arctan " + dd(P.fm, 2) + " = " + n(c.phm) + "°")}.</p>`,
    ind: [
      { t: "Non-glissement : T_A ≤ f·N_A (R_A dans le cône)", p: 0.5 },
      { t: "Limite du glissement : T_A = f·N_A (R_A sur le bord du cône)", p: 0.5 },
      { t: "f = tan φ, φ demi-angle du cône autour de la normale", p: 0.5 },
      { t: `φ = ${n(c.phs)}° (piste sèche) et ${n(c.phm)}° (piste mouillée)`, p: 0.5, champs: ["phs", "phm"], partiel: true }],
    champs: [nb("phs", "φ, piste sèche", "°", c.phs), nb("phm", "φ, piste mouillée", "°", c.phm)],
    texte: "Lois de Coulomb : condition de non-glissement, relation à la limite du glissement, lien entre f et φ.",
    err: "écrire T = f·N dans tous les cas, alors que l'égalité n'est vraie qu'à la limite du glissement ; calculatrice réglée en radians." });

  Q.push({ n: "B.2", pts: 2.5, notion: "meca-statique",
    q: `<p>Justifier le sens de la composante tangentielle ${TA}. En appliquant le théorème de la résultante statique à E, en projection sur l'axe x, déterminer ${TA}. En appliquant le théorème du moment statique à E, au point B et en projection sur l'axe z, déterminer ${NA} (figure 3).</p>`,
    rep: `<p>Sans le câble, le poids tend à faire descendre le chariot : les roues bloquées tendent à glisser vers le bas de la piste. ${TA} s'oppose à ce glissement : elle est dirigée vers le haut de la piste (sens de x).</p><p>Projection sur x : ${F(TA + " − P·sin α = 0")} ⇒ ${F(TA + " = " + n(c.TA) + " N")}.</p><p>Moments en B : l'action en B et ${TA}, portée par la droite AB, ont un moment nul ; G est à ${bras(c.d)} m de B le long de la piste et à ${bras(P.h)} m de celle-ci.<br>${F("+" + bras(P.L) + "·" + NA + " − " + bras(c.d) + " × " + d2(c.Pd * c.ca) + " + " + bras(P.h) + " × " + d2(c.Pd * c.sa) + " = 0")}<br>⇒ ${F(NA + " = ")}${fr(d2(c.d * c.Pd * c.ca) + " − " + d2(P.h * c.Pd * c.sa), bras(P.L))}${F(" = " + n(c.NAb) + " N")}.</p><p>${NA} est plus petite qu'en partie A (${n(c.NA / 1000)} kN) : le câble, fixé à ${bras(P.hc)} m de la piste, ne plaque plus l'avant du chariot sur la piste.</p>`,
    ind: [
      { t: "Sens de T_A justifié : vers le haut de la piste, opposé au glissement", p: 0.5 },
      { t: `Projection sur x : T_A = ${n(c.TA)} N`, p: 0.75, champs: ["TA"] },
      { t: `Équation des moments en B (bras de levier ${bras(c.d)} m et ${bras(P.h)} m ; moment de T_A nul)`, p: 0.75 },
      { t: `N_A = ${n(c.NAb)} N`, p: 0.5, champs: ["NAb"] }],
    champs: [nb("TA", TA, "N", c.TA), nb("NAb", NA + " (câble rompu)", "N", c.NAb)],
    texte: "Sens de T_A, équation des moments en B.",
    err: `orienter ${TA} vers le bas de la piste ; reprendre la valeur de ${NA} de la partie A alors que le câble ne tire plus ; oublier le moment de la composante P·sin α.` });

  Q.push({ n: "B.3", pts: 3, notion: "meca-frottement", dr: "DR1",
    q: `<p>Calculer le rapport ${fr(TA, NA)}, puis l'angle θ entre l'action ${RA} et la normale à la piste. Sur le document réponse DR1, tracer au point A les cônes d'adhérence de la piste sèche et de la piste mouillée, puis la droite d'action de ${RA}. Conclure quant au respect de l'exigence Id 1.2.`,
    rep: `<p>${fr(TA, NA)}${F(" = ")}${fr(d2(c.TA), d2(c.NAb))}${F(" = " + n(c.rap, 4))}, soit ${n(c.rap)}, et ${F("θ = arctan " + n(c.rap, 4) + " = " + n(c.th) + "°")}, ${RA} étant inclinée vers le haut de la piste (voir le DR1 corrigé).</p><p>Piste sèche : ${n(c.rap)} &lt; f = ${dd(P.fs, 2)} (θ = ${n(c.th)}° &lt; φ = ${n(c.phs)}°) : ${RA} est à l'intérieur du cône d'adhérence, les roues bloquées ne glissent pas, le chariot reste immobile, mais de peu : ${ecart(P.fs, r3(c.rap), dd(P.fs, 2), n(c.rap))}.</p><p>Piste mouillée : ${n(c.rap)} &gt; f = ${dd(P.fm, 2)} (θ = ${n(c.th)}° &gt; φ = ${n(c.phm)}°) : ${RA} devrait sortir du cône, l'équilibre est impossible ; les roues bloquées glissent et le chariot redescend la piste. L'exigence Id 1.2 n'est pas respectée avec le seul freinage des roues avant.</p>`,
    ind: [
      { t: `T_A / N_A = ${n(c.rap)} et θ = ${n(c.th)}°`, h: `${fr(TA, NA)} = ${n(c.rap)} et θ = ${n(c.th)}°`, p: 1, champs: ["rap", "th"], partiel: true },
      { t: `Cônes autour de la normale (± ${n(c.phs)}° et ± ${n(c.phm)}°) : R_A dans le cône de la piste sèche, hors de celui de la piste mouillée`, p: 0.75, champs: ["cs", "cm"], partiel: true },
      { t: `R_A inclinée de ${n(c.th)}° vers le haut de la piste`, p: 0.5, champs: ["cote"] },
      { t: "Conclusions : immobile sur piste sèche, glissement sur piste mouillée, exigence Id 1.2 non respectée", p: 0.75 }],
    champs: [nb("rap", fr(TA, NA), "", c.rap), nb("th", "θ", "°", c.th),
      { id: "cote", type: "choix", lab: `${RA} est inclinée, par rapport à la normale :`, options: ["vers le haut de la piste (vers le treuil)", "vers le bas de la piste"], bonne: 0 },
      { id: "cs", type: "choix", lab: `Piste sèche : ${RA} est…`, options: ["à l'intérieur du cône d'adhérence", "sur le bord du cône", "à l'extérieur du cône"], bonne: 0 },
      { id: "cm", type: "choix", lab: `Piste mouillée : ${RA} devrait être…`, options: ["à l'intérieur du cône d'adhérence", "sur le bord du cône", "à l'extérieur du cône"], bonne: 2 }],
    trace: true,
    texte: "Conclusion sur l'exigence Id 1.2 pour la piste sèche et pour la piste mouillée.",
    err: "comparer θ à f, ou le rapport des composantes à φ ; tracer les cônes autour de la verticale au lieu de la normale à la piste ; ne conclure que pour la piste sèche." });

  Q.push({ n: "B.4", pts: 2.5, notion: "meca-frottement",
    q: `<p>Pour respecter l'exigence Id 1.2, le constructeur propose une option qui freine aussi les roues arrière ; à la limite du glissement, les quatre roues glissent alors en même temps. En appliquant le théorème de la résultante statique à E, montrer que le chariot reste immobile tant que tan α ≤ f, quelles que soient sa masse et la position de G. Conclure quant au respect de l'exigence Id 1.2 avec cette option.</p><p>Après une forte pluie, la piste devient boueuse. Calculer la pente maximale, en %, sur laquelle le chariot équipé de l'option reste immobile, puis proposer une mesure complémentaire.</p>`,
    rep: `<p>Les quatre roues étant bloquées, chaque essieu reçoit une composante tangentielle, ${TA} et ${TB}. Résultante statique : ${F(TA + " + " + TB + " = P·sin α")} (sur x) et ${F(NA + " + " + NB + " = P·cos α")} (sur y).</p><p>Non-glissement des deux essieux : ${TA} ≤ f·${NA} et ${TB} ≤ f·${NB}. En additionnant : ${F("P·sin α ≤ f·P·cos α")}, soit ${F("tan α ≤ f")} (ou α ≤ φ). Réciproquement, à la limite du glissement les quatre roues glissent ensemble : ${TA} = f·${NA} et ${TB} = f·${NB}, d'où ${F("P·sin α = f·P·cos α")}, soit tan α = f. Tant que tan α ≤ f, la piste peut donc fournir l'effort tangentiel P·sin α : le chariot reste immobile. Cette condition ne dépend ni de la masse ni de la position de G.</p><p>Piste mouillée : tan α = ${dd(P.p / 100, 2)} &lt; f = ${dd(P.fm, 2)} (α = ${n(c.ad)}° &lt; φ = ${n(c.phm)}°) : le chariot reste immobile, l'exigence Id 1.2 est respectée avec l'option, ${ecart(P.fm, P.p / 100, dd(P.fm, 2), dd(P.p / 100, 2))}.</p><p>Piste boueuse : f = ${dd(P.fb, 2)}, la pente maximale est ${F("tan α = f = " + dd(P.fb, 2))}, soit ${dd(P.fb * 100, 0)} %. Le tronçon de ${pbc} % tient encore, mais pas celui de ${pc} % : le chariot glisserait. Mesure complémentaire : ne pas utiliser le monte-charge quand la piste est boueuse et la nettoyer après les fortes pluies (brosse, jet d'eau) ; on peut aussi rainurer le béton, ou ajouter un dispositif anti-recul (crémaillère et cliquet) qui ne dépend pas de l'adhérence.</p>`,
    ind: [
      { t: "Résultante statique sur x et sur y avec T_A et T_B", p: 0.5 },
      { t: "Addition des conditions de Coulomb : tan α ≤ f (égalité à la limite du glissement), indépendante de la masse et de G", p: 1 },
      { t: `Application : ${dd(P.p / 100, 2)} < ${dd(P.fm, 2)}, exigence Id 1.2 respectée avec l'option sur piste mouillée`, p: 0.5 },
      { t: `Pente maximale sur piste boueuse : ${dd(P.fb * 100, 0)} %`, p: 0.25, champs: ["pmax"] },
      { t: "Mesure complémentaire pertinente (piste nettoyée, interdite quand elle est boueuse, rainurée, anti-recul…)", p: 0.25 }],
    champs: [nb("pmax", "Pente maximale sur piste boueuse", "%", P.fb * 100)],
    texte: "Démonstration de tan α ≤ f, conclusion avec l'option, mesure complémentaire.",
    err: `conclure sans comparer tan α = ${dd(P.p / 100, 2)} à f = ${dd(P.fm, 2)} ; comparer l'angle α, en degrés, au coefficient f ; donner la pente maximale en degrés au lieu de %.` });

  const indice = (t) => t.replace(/([NTRC])_([ABCt])/g, "$1<sub>$2</sub>");
  Q.forEach((q) => { q.ind.forEach((i) => { if (!i.h) i.h = indice(esc(i.t)); }); q.bareme = q.ind.map((i) => [i.h, i.p]); if (q.err) q.err = indice(q.err); });

  const DS = {
    n: 2, libelle: "DS 02 blanc", eyebrow: "Terminale SI · DS blanc · entraînement au DS 02", semaine: "Semaine 2", duree: "1 h",
    titre: "Monte-charge d'un faré sur les hauteurs",
    theme: "Actions mécaniques et équilibre",
    notions: ["meca-actions", "meca-statique", "meca-frottement", "ana-exigences"],
    consignes: "Calculatrice autorisée en mode examen. Les parties A et B sont indépendantes. Répondre sur la copie, sauf aux questions A.1 et B.3 qui se traitent en partie sur le document réponse DR1, à rendre avec la copie.",
    presentation: `<p>Sur les hauteurs de Papara, un faré n'est accessible que par un long escalier. Pour ne plus monter à dos d'homme les packs d'eau, les bouteilles de gaz et les courses, la famille fait installer un monte-charge (figure 1) : un chariot à quatre roues roule sur une piste en béton, tiré par le câble d'un treuil électrique fixé en haut de la piste, près du faré. La piste comporte deux tronçons : une pente de ${pbc} % en bas, puis une pente de ${pc} % jusqu'au faré. Si le câble se rompt, un frein de sécurité bloque les roues avant du chariot, côté treuil. Après une forte pluie, la piste se couvre de boue. Un extrait du diagramme des exigences est donné en figure 2.</p>`
      + ds02b_fig(ds02b_site(P), "Figure 1 – Piste du monte-charge, chariot et treuil (vue de côté, échelle non respectée)", 132)
      + fig(ds02b_exig(P), "Figure 2 – Extrait du diagramme des exigences", "small"),
    parties: [
      { titre: "Partie A · Couple du treuil et actions de la piste",
        objectif: `L'objectif de cette partie est de vérifier les exigences Id 1.1 et Id 1.3 pendant la montée sur le tronçon de ${pc} %.`,
        intro: `<p><b>Hypothèses.</b> La montée se fait à vitesse constante : on applique le principe fondamental de la statique à l'ensemble E = {chariot + charges}, chariot plein (cas le plus chargé). Le problème est plan : les actions de la piste sur les deux roues d'un même essieu sont regroupées en une action unique, appliquée au point de contact A (roues avant, côté treuil) ou B (roues arrière, côté bas de la piste). Les liaisons pivot entre les roues et les essieux sont parfaites, le poids des roues et la résistance au roulement sont négligés. Pendant la montée, le frein de sécurité est desserré et le câble reste parallèle à la piste.</p>
<p>Le repère (x, y, z) est lié à la piste : x parallèle à la piste et orienté vers le haut de la piste, y perpendiculaire à la piste, z sortant de la figure ; les moments sont comptés positivement dans le sens trigonométrique.</p>`
          + `<div class="duo" style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 5mm;break-inside:avoid">`
          + `<figure style="flex:1 1 100mm;margin:6px 0">${ds02b_modele(P, c)}<figcaption>Figure 3 – Modèle plan de l'ensemble E sur le tronçon de ${pc} % (cotes en m)</figcaption></figure>`
          + `<div style="flex:0 1 62mm">` + tab(["Donnée", "Valeur"], [
            ["Masse du chariot à vide", P.mc + " kg"],
            ["Masse maximale des charges", P.mq + " kg"],
            ["Accélération de la pesanteur", "9,81 m/s²"]
          ], "Figure 4 – Données de l'ensemble E").replace(/<td class="n">/g, '<td class="n" style="white-space:nowrap">') + `</div></div>`,
        questions: Q.slice(0, 5) },
      { titre: "Partie B · Immobilisation du chariot en cas de rupture du câble",
        objectif: "L'objectif de cette partie est de vérifier l'exigence Id 1.2 en cas de rupture du câble.",
        intro: `<p><b>Frein de sécurité.</b> Tant que le câble est tendu, il maintient le frein desserré. Si le câble se rompt, un ressort serre les mâchoires du frein sur les deux roues avant, qui sont alors bloquées ; les roues arrière restent libres et l'action de la piste sur elles reste perpendiculaire à la piste. On étudie l'ensemble E immobile sur le tronçon de ${pc} % après une rupture du câble ; la masse de E et la position de G sont celles de la partie A (figures 3 et 4). L'action de la piste sur les roues avant bloquées, notée ${RA}, a une composante normale ${NA} et une composante tangentielle ${TA} ; ce contact suit les lois de Coulomb, avec les coefficients d'adhérence f de la figure 5.</p>`
          + `<figure><table class="t"><thead><tr><th>État de la piste en béton</th>${["sèche", "mouillée", "boueuse"].map((h) => `<th style="text-align:center">${h}</th>`).join("")}</tr></thead>`
          + `<tbody><tr><td>Coefficient d'adhérence f</td>${[P.fs, P.fm, P.fb].map((v) => `<td class="n" style="text-align:center">${dd(v, 2)}</td>`).join("")}</tr></tbody></table>`
          + `<figcaption>Figure 5 – Coefficients d'adhérence entre les pneus du chariot et la piste</figcaption></figure>`,
        questions: Q.slice(5) }
    ],
    dr: [{ id: "DR1", titre: "Bilan des actions et cônes d'adhérence",
      html: `<p><b>Question A.1</b> · Compléter le bilan des actions mécaniques extérieures appliquées à E = {chariot + charges}.</p>`
        + ds02b_bilan(P, c, false)
        + `<p style="margin-top:14px"><b>Question B.3</b> · Tracer, au point A, les cônes d'adhérence de la piste sèche et de la piste mouillée, puis la droite d'action de ${RA}. Les graduations, en degrés, sont comptées à partir de la normale à la piste.</p>`
        + fig(ds02b_cone(P, c, {}), "Contact entre la piste et les roues avant bloquées, au point A"),
      corrige: ds02b_bilan(P, c, true)
        + fig(ds02b_cone(P, c, { sol: true }), `Cônes d'adhérence au point A et droite d'action de ${RA}`) }]
  };
  return { DS, c, P };
}

/* note du bilan saisi sur le site : r = { coches: {id: true}, lignes: {id: {point, dir, sens, norme}} } → fractions des trois éléments de barème */
function ds02b_noteBilan(r){
  r = r || {}; const co = r.coches || {}, li = r.lignes || {};
  const C = ds02b_BILAN.candidats, bons = C.filter((x) => x.ok);
  let ident = 0; C.forEach((x) => { if (co[x.id]) ident += x.ok ? 1 / 3 : -1 / 3; });
  let pd = 0, se = 0;
  bons.forEach((x) => { const l = li[x.id] || {}; if (!co[x.id]) return;
    pd += (l.point === x.point ? 0.5 : 0) + (l.dir === x.dir ? 0.5 : 0);
    se += (l.sens === x.sens ? 0.5 : 0) + (l.norme === "inconnue" ? 0.5 : 0); });
  const q = (v) => Math.max(0, Math.min(1, Math.round(v * 12) / 12));
  return { ident: q(ident), pdir: q(pd / 3), sens: q(se / 3) };
}

/* ===== DS n° 3 BLANC · « Programmer et coder l'information » : station d'alerte de crue de la Taharu'u =====
   Mêmes types de questions, même barème et même format que le DS 03 (programme Python et algorigramme, codage et
   trame, moment avec son signe en reprise), autre système et autres valeurs. Le sujet est un générateur :
   ds03b_make(P) construit le sujet, le corrigé, le barème et la couche interactive du site pour un jeu de valeurs P.
   Le premier essai d'un élève prend les valeurs ds03b_REF, les suivants des valeurs tirées par ds03b_tirage.
   Les cases « code » attendent ce qui remplace les ____ d'une ligne de programme (moteur : type "code").
   Chaque question indique l'étape de la préparation qui l'entraîne (etape) et ce qu'il faut y travailler (quoi). */

const ds03b_REF = { a1: 2019, b1: 8, hx: 2347, ht: 1755, HA: 1800, HF: 1500, HP: 2500,
  L5: [1734, 1812, 1906, 1788, 1851], cyc: 15, Tm: 5, motif: 0,
  cy: [[1342, 1987], [1693, 2614], [1871, 2388], [1622, 2205], [1438, 1903]],
  k1: 8, Hmax: 5, st: 5, th: 264, bat: 17, moy: 1654, pic: 2618, b2: 1, scen: 0,
  V: 150, S: 0.50, h: 1.80, m: 310, a: 0.45, vent: "g" };

/* nombre à s chiffres significatifs, virgule décimale ; entiers avec espace des milliers */
function ds03b_n(x, s){
  s = s || 3;
  if (!isFinite(x)) return String(x);
  if (x === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(x)));
  let d = Math.max(0, s - 1 - e), v = Math.abs(x).toFixed(d);
  if (d > 0 && Math.floor(Math.log10(Number(v))) > e) v = Math.abs(x).toFixed(d - 1);
  let [ip, fp] = v.split(".");
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (x < 0 ? "−" : "") + ip + (fp ? "," + fp : "");
}
const ds03b_i = (x) => (x < 0 ? "−" : "") + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");   /* entier : 1 818 */
const ds03b_d = (x, dec) => (x < 0 ? "−" : "") + Math.abs(x).toFixed(dec).replace(".", ",");                  /* donnée : 0,45 */
const ds03b_m = (mm) => ds03b_d(mm / 1000, 3) + " m";                                                      /* 1800 → 1,800 m */
const ds03b_hex = (o) => o.toString(16).toUpperCase().padStart(2, "0");
const ds03b_r3 = (x) => Number(Number(x).toPrecision(3));
/* décomposition d'un entier de 16 bits écrit en hexadécimal : 06 76 → 6 × 256 + 7 × 16 + 6 */
function ds03b_dec16(v){
  const hi = v >> 8, lo = v & 255, t = [];
  if (hi) t.push(hi + " × 256");
  if (lo >> 4) t.push((lo >> 4) + " × 16");
  if (lo & 15) t.push(String(lo & 15));
  return (t.join(" + ") || "0") + " = " + ds03b_i(v);
}
function ds03b_dec8(v){ return (v >> 4) + " × 16 + " + (v & 15) + " = " + v; }
const ds03b_bin = (v) => v.toString(2).padStart(8, "0");

/* motifs des cinq cycles de la question A.5 : catégorie de chaque cycle (le cycle 1, en exemple, est « bas ») */
const ds03b_MOTIFS = [["bas", "pic", "moy", "entre", "bas"], ["bas", "entre", "pic", "entre", "bas"], ["bas", "moy", "entre", "bas", "entre"]];

function ds03b_calc(P){
  const q1 = Math.floor(P.a1 / P.b1), r1 = P.a1 % P.b1, t1 = P.ht >= P.HA;
  const sums = []; P.L5.reduce((s, x) => { s += x; sums.push(s); return s; }, 0);
  const tot = sums[4], ret = Math.floor(tot / 5);
  const N = P.cyc * 60 / P.Tm;
  let al = false;
  const seq = P.cy.map(([mo, pi]) => { if (mo >= P.HA || pi >= P.HP) al = true; else if (mo < P.HF) al = false; return al; });
  const n1 = Math.pow(2, P.k1), Nv = P.Hmax * 1000 + 1, bits = Math.ceil(Math.log2(Nv));
  const etat = (P.scen === 2 ? 0 : 1) + (P.bat < 20 ? 2 : 0) + (P.b2 ? 4 : 0);
  const octets = [P.st, P.th >> 8, P.th & 255, P.bat, P.moy >> 8, P.moy & 255, P.pic >> 8, P.pic & 255, etat];
  const p = Math.round(0.0536 * P.V * P.V / 100) * 100, F = Math.round(p * P.S), sg = P.vent === "g" ? -1 : 1;
  /* partie C : résultats à 3 chiffres significatifs, réutilisés dans la suite du calcul (égalités affichées justes) */
  const MF = sg * F * P.h, Pd = Math.round(P.m * 9.81), Pd3 = ds03b_r3(Pd), MP = -sg * Pd3 * P.a;
  const MF3 = ds03b_r3(MF), MP3 = ds03b_r3(MP), k = Math.abs(MP3) / Math.abs(MF3);
  return { q1, r1, t1, sums, tot, ret, N, seq, n1, Nv, bits, etat, octets, p, F, sg, MF, Pd, Pd3, MP, MF3, MP3, k };
}

/* catégorie d'un couple (h_moy, h_pic) par rapport aux seuils, avec au moins 10 mm d'écart */
function ds03b_cat(P, mo, pi){
  if (Math.abs(mo - P.HA) < 10 || Math.abs(mo - P.HF) < 10 || Math.abs(pi - P.HP) < 10) return "limite";
  if (pi >= P.HP && mo < P.HA) return "pic";
  if (mo >= P.HA && pi < P.HP) return "moy";
  if (mo < P.HF && pi < P.HP) return "bas";
  if (mo >= P.HF && mo < P.HA && pi < P.HP) return "entre";
  return "autre";
}
function ds03b_valide(P, c){
  const cats = ds03b_MOTIFS[P.motif];
  const scen = ["pic", "moy", "bas"][P.scen];
  const hexes = [c.octets[4], c.octets[5], c.octets[6], c.octets[7]].map(ds03b_hex).join("");
  return P.a1 % P.b1 !== 0 && c.tot % 5 !== 0 && Number.isInteger(c.N) && c.N >= 30 && c.N <= 1200
    && P.cy.every((x, i) => ds03b_cat(P, x[0], x[1]) === cats[i] && x[1] > x[0])
    && ds03b_cat(P, P.moy, P.pic) === scen && P.pic > P.moy && /[A-F]/.test(hexes)
    && c.Nv > 256 && c.k >= 0.8 && c.k <= 2.4 && Math.abs(c.k - 1) >= 0.06 && Math.abs(c.k - 1.5) >= 0.08;
}
function ds03b_tirage(rand){
  const pick = (a) => a[Math.floor(rand() * a.length)], ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const CYC = [[5, 2], [5, 3], [5, 5], [10, 2], [10, 4], [10, 5], [10, 6], [15, 3], [15, 5], [15, 6], [15, 10], [20, 4], [20, 5], [20, 6], [20, 10], [20, 12]];
  for (let k = 0; k < 5000; k++){
    const HA = pick([1600, 1700, 1800, 1900, 2000]), HF = HA - pick([200, 300, 400]), HP = HA + pick([500, 600, 700, 800]);
    const gen = (cat) => {
      if (cat === "bas"){ const mo = ri(HF - 350, HF - 20); return [mo, ri(mo + 150, Math.min(HP - 60, mo + 700))]; }
      if (cat === "pic"){ const mo = ri(HF + 20, HA - 20); return [mo, ri(HP + 15, HP + 450)]; }
      if (cat === "moy"){ const mo = ri(HA + 15, HA + 350); return [mo, ri(mo + 120, HP - 30)]; }
      const mo = ri(HF + 20, HA - 20); return [mo, ri(mo + 120, HP - 30)];
    };
    const motif = ri(0, 2), cc = pick(CYC), scen = ri(0, 2);
    let moy, pic;
    if (scen === 0){ moy = ri(HF + 30, HA - 30); pic = ri(HP + 15, HP + 500); }
    else if (scen === 1){ moy = ri(HA + 15, HA + 400); pic = ri(moy + 120, HP - 30); }
    else { moy = ri(HF - 400, HF - 20); pic = ri(moy + 150, HP - 100); }
    const P = { a1: ri(1000, 3000), b1: pick([3, 4, 6, 7, 8, 9]), hx: ri(1200, 2900), ht: pick([HA - ri(15, 90), HA, HA + ri(15, 90)]), HA, HF, HP,
      L5: Array.from({ length: 5 }, () => ri(HA - 260, HA + 260)), cyc: cc[0], Tm: cc[1], motif, cy: ds03b_MOTIFS[motif].map(gen),
      k1: pick([8, 10, 12]), Hmax: pick([3, 4, 5, 6, 8]), st: ri(1, 12), th: ri(225, 298), bat: rand() < 0.5 ? ri(6, 19) : ri(25, 98), moy, pic, b2: rand() < 0.4 ? 1 : 0, scen,
      V: pick([120, 130, 140, 150, 160]), S: pick([0.40, 0.45, 0.50, 0.55, 0.60, 0.70, 0.80]), h: pick([1.40, 1.50, 1.60, 1.80, 2.00, 2.20]),
      m: ri(18, 42) * 10, a: pick([0.30, 0.35, 0.40, 0.45, 0.50, 0.55]), vent: pick(["g", "d"]) };
    if (ds03b_valide(P, ds03b_calc(P))) return P;
  }
  return JSON.parse(JSON.stringify(ds03b_REF));
}

/* ---------- figures ---------- */
const ds03b_c = (s) => `<code style="font-family:var(--f-mono);font-size:.92em">${esc(s)}</code>`;
function ds03b_prog(src, first){
  const h = code(src), inner = h.slice('<pre class="code">'.length, -"</pre>".length);
  const out = inner.split("\n").map((l, i) => `<span style="color:var(--ink-3)">${String(first + i).padStart(2, " ")}</span>  ${l}`).join("\n");
  return `<pre class="code" style="margin:0;font-size:8.5pt;line-height:1.38;padding:5px 9px">${out}</pre>`;
}
function ds03b_src(P){
  const A = [
    `H_ALERTE = ${P.HA}     # ${ds03b_d(P.HA / 1000, 3)} m`,
    `H_FIN = ${P.HF}        # ${ds03b_d(P.HF / 1000, 3)} m`,
    `H_PIC = ${P.HP}        # ${ds03b_d(P.HP / 1000, 3)} m`,
    "",
    "def moyenne(valeurs):",
    "    somme = 0",
    "    for h in valeurs:",
    "        somme = somme + h",
    "    return somme // len(valeurs)",
    "",
    "def maximum(valeurs):",
    "    hmax = valeurs[0]",
    "    for h in valeurs:",
    "        if h ___ hmax:",
    "            hmax = ___",
    "    return hmax"].join("\n");
  const B = [
    "def gerer_alerte(h_moy, h_pic, alerte):",
    "    if h_moy >= H_ALERTE ___ h_pic >= H_PIC:",
    "        alerte = True",
    "    elif ___:",
    "        alerte = ___",
    "    return alerte",
    "",
    "alerte = False",
    "while True:",
    "    hauteurs = []",
    "    for i in range(___):",
    "        hauteurs.append(lire_hauteur())",
    `        attendre(${P.Tm})`,
    "    h_moy = moyenne(hauteurs)",
    "    h_pic = maximum(hauteurs)",
    "    alerte = gerer_alerte(h_moy, h_pic, alerte)",
    "    envoyer(trame(h_moy, h_pic, alerte))"].join("\n");
  return { A, B };
}

/* Figure 4 : algorigramme de gerer_alerte */
function ds03b_algo(P){
  const term = (cx, y, w, t) => `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="24" rx="12" class="v-box"/>` + T(cx, y + 16, esc(t), "v-smb", "middle");

  s += L(275, 62, 298, 62, "v-thin", "k") + T(286, 55, "oui", "v-cap", "middle") + act(300, 48, "alerte ← Vrai");

  s += L(250, 122, 298, 122, "v-thin", "k") + T(274, 115, "oui", "v-cap", "middle") + act(300, 108, "alerte ← Faux");

  s += L(150, 166, 150, 176, "v-thin", "k") + term(150, 178, 170, "Fin : renvoyer alerte");

function ds03b_make(P){
  const c = ds03b_calc(P), n = ds03b_n, I = ds03b_i, d = ds03b_d, M = ds03b_m, C = ds03b_c, H = ds03b_hex;

  const TF = (id, lab, v) => ({ id, type: "choix", lab, options: ["True", "False"], bonne: v ? 0 : 1 });
  const src = ds03b_src(P), Q = [];
  const fl = (x) => d(x, 3);                                         /* 1818 mm → 1,818 */
  const hm = c.ret / 1000;

  /* ---------------- Partie A ---------------- */
  Q.push({ n: "A.1", pts: 1.5, notion: "info-programmation", etape: 1, quoi: "lire une ligne de programme : //, %, unités, booléens",
    q: `<p>Donner les valeurs affichées par l'instruction ${C(`print(${P.a1} // ${P.b1}, ${P.a1} % ${P.b1})`)}. Donner la valeur renvoyée par ${C("lire_hauteur()")} lorsque la hauteur d'eau vaut ${M(P.hx)}, puis la valeur de l'expression ${C("h_moy >= H_ALERTE")} lorsque ${C("h_moy")} vaut ${P.ht} (figure 3).</p>`,
    rep: `<p>${C(`${P.a1} // ${P.b1}`)} = <b>${c.q1}</b> (quotient entier) et ${C(`${P.a1} % ${P.b1}`)} = <b>${c.r1}</b> (reste) : ${F(`${I(P.a1)} = ${P.b1} × ${c.q1} + ${c.r1}`)}.</p><p>${C("lire_hauteur()")} renvoie la hauteur en millimètres, sous la forme d'un entier : <b>${P.hx}</b> pour ${M(P.hx)}.</p><p>Pour ${C("h_moy")} = ${P.ht} : ${P.ht} ≥ ${P.HA} est ${c.t1 ? "vrai" : "faux"}${P.ht === P.HA ? " (égalité : >= est vrai)" : ""}, l'expression vaut <b>${c.t1 ? "True" : "False"}</b>.</p>`,
    ind: [
      { t: `${c.q1} et ${c.r1} (quotient et reste de la division entière)`, p: 0.5, champs: ["q1", "r1"], partiel: true },
      { t: `lire_hauteur() renvoie ${P.hx} (millimètres)`, p: 0.5, champs: ["lire"] },
      { t: `h_moy >= H_ALERTE vaut ${c.t1 ? "True" : "False"} pour ${P.ht}`, p: 0.5, champs: ["t1"] }],

  Q.push({ n: "A.2", pts: 2, notion: "info-programmation", etape: 2, quoi: "faire tourner une boucle à la main",

  Q.push({ n: "A.3", pts: 2, notion: "info-programmation", etape: 3, quoi: "compléter les trous d'un programme",

  Q.push({ n: "A.4", pts: 1.5, notion: "info-programmation", etape: 3, quoi: "traduire un algorigramme en Python",

  const cyRows = P.cy.map((x, i) => `<tr><td ${ds03b_mono}>${i + 1}</td><td ${ds03b_mono}>${I(x[0])}</td><td ${ds03b_mono}>${I(x[1])}</td><td ${ds03b_mono}>${i ? "?" : "False"}</td></tr>`).join("");

  const pourquoi = (x, avant, apres) => {

    return `pas d'alerte (${I(mo)} &lt; ${I(P.HA)} et ${I(pi)} &lt; ${I(P.HP)}) et ${I(mo)} n'est pas inférieur à ${I(P.HF)} : alerte garde sa valeur, ${avant ? "True" : "False"}`;
  };
  const kEntre = P.cy.map((x, i) => i).filter((i) => i > 0 && ds03b_MOTIFS[P.motif][i] === "entre");
  Q.push({ n: "A.5", pts: 2, notion: "info-programmation", etape: 3, quoi: "suivre l'état d'une variable d'un cycle à l'autre",

  /* ---------------- Partie B ---------------- */
  const o = c.octets, th = (o[1] << 8) | o[2];
  Q.push({ n: "B.1", pts: 2, notion: "info-codage", etape: 2, quoi: "nombre de valeurs, nombre de bits, octets",

  const trameQ = `<p>Trame reçue par le serveur (octets en hexadécimal) :</p>${ds03b_trame(c)}<p class="discret">Exemple : température de l'eau, octets ${H(o[1])} ${H(o[2])} → ${ds03b_dec16(th)} → θ = ${d(th / 10, 1)} °C.</p>`;
  Q.push({ n: "B.2", pts: 3, notion: "info-codage", etape: 2, quoi: "décoder une trame (hexadécimal, deux octets)",

      { t: `Hauteur maximale : ${H(o[6])} ${H(o[7])} → ${I(P.pic)} → ${fl(P.pic / 1000)} m`, p: 1, champs: ["picd", "picm"], partiel: true }],

  const sc = P.scen, bit = (k) => (c.etat >> k) & 1;
  const raisons = [`la hauteur moyenne atteint le seuil d'alerte (${M(P.HA)})`, `la hauteur maximale atteint son seuil (${M(P.HP)}), même si la hauteur moyenne reste sous le seuil d'alerte`, `la hauteur moyenne est redescendue sous le seuil de fin d'alerte (${M(P.HF)})`, "il n'est pas cohérent : l'alerte devrait être dans l'autre état"];

    : `h<sub>moy</sub> = ${M(P.moy)} &lt; ${M(P.HF)} et h<sub>pic</sub> = ${M(P.pic)} &lt; ${M(P.HP)} : l'exigence Id 1 impose de lever l'alerte, ce que signale bien le bit 0 à 0`;
  Q.push({ n: "B.3", pts: 2, notion: "info-codage", etape: 3, quoi: "octet d'état bit par bit, puis cohérence avec une exigence",

    ind: [
      { t: `Octet d'état en binaire : ${ds03b_bin(o[8]).replace(/(\d{4})(\d{4})/, "$1 $2")}`, p: 0.5, champs: ["bin"] },
      { t: `Informations : alerte ${bit(0) ? "active" : "inactive"}, batterie ${bit(1) ? "faible" : "normale"}, porte ${bit(2) ? "ouverte" : "fermée"}`, p: 0.75, champs: ["ia", "ib", "ip"], partiel: true },
      { t: "Raison de l'état de l'alerte", p: 0.25, champs: ["coh"] },
      { t: `Cohérence justifiée avec les hauteurs et les seuils de l'exigence Id 1 (${sc === 0 ? "h_pic ≥ " + fl(P.HP / 1000) + " m" : sc === 1 ? "h_moy ≥ " + fl(P.HA / 1000) + " m" : "h_moy < " + fl(P.HF / 1000) + " m"})`, p: 0.5 }],

      { id: "ia", type: "choix", lab: "Bit 0 : l'alerte crue est…", options: ["active", "inactive"], bonne: bit(0) ? 0 : 1 },
      { id: "ib", type: "choix", lab: "Bit 1 : la batterie est…", options: ["faible", "normale"], bonne: bit(1) ? 0 : 1 },

  /* ---------------- Partie C ---------------- */
  const n3 = (x) => n(ds03b_r3(x));                                   /* résultat à 3 chiffres significatifs : 3 041 → 3 040 */
  const g = P.vent === "g", MFt = n3(c.MF3), MPt = n3(c.MP3), kTxt = n(c.k), Pt = n3(c.Pd3), MF15 = n3(1.5 * Math.abs(c.MF3));
  const concl = c.k >= 1.5 ? 0 : c.k >= 1 ? 1 : 2;
  const conclTxt = concl === 0 ? `${kTxt} ≥ 1,5 : le panneau ne bascule pas, avec le coefficient de sécurité exigé ; l'exigence Id 3 est respectée`
    : concl === 1 ? `${kTxt} &gt; 1 : le panneau ne bascule pas ; mais ${kTxt} &lt; 1,5 : le coefficient de sécurité exigé n'est pas atteint, l'exigence Id 3 n'est pas respectée. Il faudrait ${F(`|M<sub>A</sub>(P)| ≥ 1,5 × ${n3(Math.abs(c.MF3))} = ${MF15} N·m`)} : alourdir le socle ou l'élargir (a plus grand)`
    : `${kTxt} &lt; 1 : le moment du vent l'emporte sur celui du poids, le panneau bascule ; l'exigence Id 3 n'est pas respectée. Il faudrait ${F(`|M<sub>A</sub>(P)| ≥ 1,5 × ${n3(Math.abs(c.MF3))} = ${MF15} N·m`)} : alourdir nettement le socle ou l'élargir (a plus grand)`;
  const optsC = ["respectée : le panneau ne bascule pas, avec le coefficient de sécurité exigé", "non respectée : le panneau ne bascule pas, mais le coefficient de sécurité est inférieur à 1,5", "non respectée : le panneau bascule"];
  Q.push({ n: "C.1", pts: 4, notion: "meca-actions", etape: 2, quoi: "force de pression, moment avec son signe, coefficient de sécurité",
    q: `<p>Le sens trigonométrique (sens inverse des aiguilles d'une montre) est positif. Calculer l'intensité de la force F, puis son moment par rapport au point A, avec son signe. Calculer le poids P de l'ensemble, puis son moment par rapport au point A, avec son signe. Calculer le coefficient de sécurité au basculement, puis conclure quant au respect de l'exigence Id 3 (figure 6).</p>`,

  const DS = {

<p>Les capteurs sont reliés à un microcontrôleur programmé en Python. Toutes les ${P.cyc} minutes, celui-ci envoie par radio (liaison LoRa) une trame de 9 octets à une passerelle installée à la mairie, qui la transmet au serveur de la commune ; le serveur enregistre les octets reçus, notés en hexadécimal, puis les décode. Un panneau photovoltaïque et une batterie rendent la station autonome. Un extrait du cahier des charges est donné en figure 2.</p>`

      { titre: "Partie A · Programme de surveillance de la rivière",

            ], "Figure 5 – Format de la trame (un bit d'état vaut 1 lorsque l'information correspondante est vraie)"),
        questions: Q.slice(5, 8) },
      { titre: "Partie C · Tenue au vent des panneaux lumineux (reprise)",

        intro: `<figure>${ds03b_support(P).replace("<svg ", '<svg style="max-width:85mm" ')}<figcaption>Figure 6 – Panneau lumineux sur son socle lesté : modèle plan (échelle non respectée)</figcaption></figure>`
          + `<p>Chaque panneau lumineux est fixé en haut d'un poteau, sur un socle lesté (alourdi par des blocs de béton) simplement posé au bord de la route. Par un vent de ${P.V}&nbsp;km/h, soufflant de la ${g ? "gauche vers la droite" : "droite vers la gauche"} de la figure 6, l'ensemble tend à basculer autour du bord A du socle. Modèle plan retenu :</p><p>– action du vent sur le panneau : force horizontale ${F("F")} appliquée en C, au centre du panneau, à h = ${d(P.h, 2)}&nbsp;m au-dessus du sol, d'intensité F = p·S avec p = ${I(c.p)}&nbsp;Pa (pression du vent à ${P.V}&nbsp;km/h) et S = ${d(P.S, 2)}&nbsp;m² (surface du panneau) ;<br>– ensemble (socle, lest, poteau et panneau) : masse m = ${P.m}&nbsp;kg, centre de gravité G sur l'axe du poteau, à la distance a = ${d(P.a, 2)}&nbsp;m du bord A ; g = 9,81&nbsp;m/s² ;<br>– coefficient de sécurité au basculement : ${F("k = ")}${FRAC("|M<sub>A</sub>(P)|", "|M<sub>A</sub>(F)|")}, moments par rapport au bord A ; résultats à 3 chiffres significatifs.</p>`,
