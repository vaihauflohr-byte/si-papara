<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier schémas · dessiner et simuler un schéma électrique</title>
<meta name="description" content="Dessiner un schéma électrique (commande et puissance) avec les symboles normalisés, puis le simuler : contacteurs, relais, temporisations, moteurs. Exemples et défis corrigés.">
<meta name="theme-color" content="#1d3f7a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d3f7a'/%3E%3Cpath d='M7 9v6h6M13 15l5-4M18 9v14M7 23h18' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css">
<style>
/* ===== Atelier schémas : la page est une application plein écran ===== */
:root{--p-l1:#e03131;--p-l2:#e8590c;--p-l3:#9c36b5;--p-n:#1c7ed6;--p-pe:#2f9e44;--p-plus:#e03131;--p-court:#f700a8;
  --sc-feuille:#fcfdfe;--sc-point:#c3ccd6;--sc-bobine:#ffd43b;--sc-libre:#f08c00;--sc-barre:#f4f7f9;--sc-ombre:0 6px 22px rgba(15,25,40,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p-l1:#ff6b6b;--p-l2:#ffa94d;--p-l3:#da77f2;--p-n:#4dabf7;--p-pe:#69db7c;--p-plus:#ff6b6b;--p-court:#ff4fd8;
  --sc-feuille:#0f161d;--sc-point:#2b3846;--sc-bobine:#d9a400;--sc-libre:#ffa94d;--sc-barre:#141c24;--sc-ombre:0 6px 22px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0d1318;--paper:#141c24;--paper-2:#19232d;--ink:#e2e8ee;--ink-2:#a9b5c1;--ink-3:#7b8894;--rule:#28343f;--rule-2:#1f2a34;--line-strong:#c8d2dc;
  --accent:#8fb0ee;--accent-soft:#1a2a44;--accent-ink:#0d1318;--good:#6ccb97;--good-soft:#132d1f;--bad:#ff8f84;--bad-soft:#3a1714;--warn:#e8b75a;--warn-soft:#32270e;
  --p-l1:#ff6b6b;--p-l2:#ffa94d;--p-l3:#da77f2;--p-n:#4dabf7;--p-pe:#69db7c;--p-plus:#ff6b6b;--p-court:#ff4fd8;
  --sc-feuille:#0f161d;--sc-point:#2b3846;--sc-bobine:#d9a400;--sc-libre:#ffa94d;--sc-barre:#141c24;--sc-ombre:0 6px 22px rgba(0,0,0,.5)}
:root[data-theme="dark"] .logo-img{filter:invert(1)}
html,body{height:100%}
body.sc-app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
.haut{flex:none;position:relative}
.haut-in{max-width:none;padding:6px 14px;gap:12px}
.logo-img{width:46px}.logo-nom{font-size:1.5rem}
.haut .qui{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.haut .qui a{font-weight:600}
@media (max-width:620px){.haut-in{padding:5px 10px}.logo-img{width:36px}.logo-ey{display:none}.logo-nom{font-size:1.2rem}.haut .qui .q-long{display:none}}
/* barre d'outils */
.sc-barre{flex:none;display:flex;align-items:center;gap:3px;padding:5px 8px;background:var(--paper);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin}
.sc-b{appearance:none;font:inherit;font-size:.74rem;line-height:1.1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:50px;height:46px;padding:3px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.sc-b svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sc-b:hover{background:var(--paper-2);border-color:var(--rule)}
.sc-b[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sc-b:disabled{opacity:.38;cursor:default;background:transparent;border-color:transparent}
.sc-b.simuler{min-width:96px;flex-direction:row;gap:7px;font-size:.95rem;font-weight:600;background:var(--good);color:#fff;border-color:var(--good);padding:0 14px;margin:0 4px}
.sc-b.simuler svg{fill:currentColor;stroke:none}
.sc-b.simuler:hover{filter:brightness(1.08)}
body.simu .sc-b.simuler{background:var(--bad);border-color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sc-b.simuler{color:#0d1318}}
:root[data-theme="dark"] .sc-b.simuler{color:#0d1318}
.sc-sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--rule);flex:none}
.sc-zoom{font-family:var(--f-mono);font-size:.78rem;min-width:46px;text-align:center;color:var(--ink-2);flex:none}
.sc-espace{flex:1 0 6px}
.sc-b.seul-tel{display:none}
@media (max-width:980px){.sc-b.seul-tel{display:inline-flex}}
@media (max-width:720px){.sc-b{min-width:44px;font-size:.66rem}.sc-b .lib-long{display:none}.sc-b.simuler{min-width:0;padding:0 12px}.sc-zoom{display:none}}
/* corps : palette | feuille | panneau */
.sc-corps{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 304px;position:relative}
.sc-palette,.sc-panneau{background:var(--paper);overflow:auto;min-height:0;overscroll-behavior:contain}
.sc-palette{border-right:1px solid var(--rule);padding:8px 8px 40px}
.sc-panneau{border-left:1px solid var(--rule);padding:10px 12px 40px}
.sc-vue{position:relative;overflow:hidden;background:var(--sc-feuille);touch-action:none;min-width:0}
#sc-svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}
#sc-svg *{pointer-events:none}
/* palette */
.pal-cat{margin:4px 0 10px}
.pal-cat h3{font-size:.8rem;letter-spacing:.08em;color:var(--ink-3);margin:6px 4px 6px}
.pal-g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pal-i{appearance:none;font:inherit;font-size:.66rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;border:1px solid var(--rule-2);border-radius:6px;background:var(--paper-2);color:var(--ink);cursor:grab;text-align:center;min-height:74px;touch-action:none}
.pal-i:hover{border-color:var(--accent)}
.pal-i[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.pal-i svg{width:100%;height:46px}
.pal-astuce{font-size:.8rem;color:var(--ink-2);margin:2px 4px 10px;line-height:1.4}
body.simu .sc-palette{opacity:.45;pointer-events:none}
/* symboles */
.sy{stroke:var(--ink);color:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sy path[style]{stroke-width:2.3}
.sy .lien{stroke-dasharray:3.2 2.6;stroke-width:1.05}
.sy .fin{stroke-width:.8;stroke:var(--ink-3)}
.sy .act.plein,.sy .plein{fill:var(--ink)}
.sy .act.boite{stroke-width:1.2}
.sy .corps-b,.sy .corps-v,.sy .corps-f,.sy .corps-m,.sy .corps-tr,.sy .corps-t,.sy .pot-boite{fill:var(--sc-feuille)}
.sy .corps-b.plein{fill:var(--ink)}
.sy .corps-b.alim{fill:var(--sc-bobine)}
.sy .corps-b.grille,.sy .corps-m.grille{fill:var(--bad-soft);stroke:var(--bad)}
.sy .corps-b.vibre{animation:sc-vibre .12s linear infinite;fill:var(--warn-soft);stroke:var(--warn)}
.sy .corps-f.fondu,.sy .corps-t.declenche{stroke:var(--bad);fill:var(--bad-soft)}
.sy .barre{stroke:var(--bad);stroke-width:2.2}
.sy .halo{opacity:.32;stroke:none}
.sy .corps-m.tourne{stroke:var(--good);stroke-width:2.2}
.sy .corps-m.peine{stroke:var(--warn);stroke-width:2.2;animation:sc-vibre .1s linear infinite}
.sy .corps-tr.alim{stroke:var(--good)}
.sy .rotor-c{stroke:var(--ink-3);stroke-width:2.2;stroke-dasharray:2.6 5.6;fill:none;opacity:.8}
.sy .sens{stroke:var(--good);stroke-width:2}
.sy .anneau-f{stroke:var(--rule);stroke-width:2.6;fill:var(--sc-feuille)}
.sy .anneau{stroke:var(--accent);stroke-width:2.6;fill:none;stroke-linecap:butt}
.sy-t{font-family:var(--f-mono);font-size:8.5px;fill:var(--ink-2);stroke:var(--sc-feuille);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.sy-t.ref{font-family:var(--f-body);font-weight:600;font-size:11.5px;fill:var(--ink)}
.sy-t.info{font-size:8.5px;fill:var(--ink-3)}
.sy-t.pot{font-family:var(--f-mono);font-weight:600;font-size:10.5px;fill:var(--ink)}
.sy-t.gros{font-family:var(--f-body);font-weight:700;font-size:17px;fill:var(--ink)}
.sy-t.moyen{font-family:var(--f-body);font-size:10.5px;fill:var(--ink)}
.sy-t.petit{font-family:var(--f-body);font-size:7.5px;font-weight:600;fill:var(--ink);stroke:none}
.sy-t.alerte{fill:var(--bad);font-weight:600;font-family:var(--f-body);font-size:10px}
.fil{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fil.vif{stroke-width:2.5}
.fil.sel{stroke:var(--accent);stroke-width:3.2}
.fil.court{stroke:var(--p-court)!important;stroke-width:4.2;animation:sc-cligne .45s steps(2) infinite}
.jonction{fill:var(--ink)}
.libre{fill:var(--sc-feuille);stroke:var(--sc-libre);stroke-width:1.5}
.bout{fill:var(--sc-feuille);stroke:var(--bad);stroke-width:1.5}
.cadre-sel{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.poignee{fill:var(--paper);stroke:var(--accent);stroke-width:1.6}
.rect-sel{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.brouillon{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-dasharray:6 4;stroke-linecap:round}
.cible{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:1.5}
.fantome{opacity:.55}
.act-sim{fill:transparent;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 3;opacity:0}
.survol .act-sim{opacity:1}
.grille-fond{fill:url(#sc-motif)}
@keyframes sc-cligne{50%{opacity:.25}}
@keyframes sc-vibre{0%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.7px,.5px)}75%{transform:translate(.6px,.7px)}}
@media (prefers-reduced-motion:reduce){.fil.court,.sy .corps-b.vibre,.sy .corps-m.peine{animation:none}}
/* bulles sur la feuille */
.sc-bulle{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92%,560px);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:7px 12px;font-size:.88rem;box-shadow:var(--sc-ombre);z-index:6}
.sc-bulle.alerte{border-left-color:var(--bad)}
@media (max-width:620px){.sc-bulle{font-size:.8rem;line-height:1.35;padding:6px 10px;top:6px}}
.pn .btn.ko{background:var(--bad);border-color:var(--bad);color:#fff}
.sc-bulle button{margin-left:8px}
.sc-vide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
.sc-vide>div{max-width:440px;text-align:center;color:var(--ink-2);background:var(--paper);border:1px dashed var(--rule);border-radius:10px;padding:16px 18px;font-size:.93rem;pointer-events:auto}
.sc-vide b{color:var(--ink)}
.sc-legende{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 20px);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:.78rem;color:var(--ink-2);z-index:5;pointer-events:none}
.sc-legende i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:2px;margin-right:5px}
body:not(.simu) .sc-legende{display:none}
.sc-horloge{position:absolute;right:10px;top:10px;font-family:var(--f-mono);font-size:.8rem;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:3px 8px;color:var(--ink-2);z-index:5;pointer-events:none}
body:not(.simu) .sc-horloge{display:none}
/* panneau de droite */
.pn h2{font-size:1.05rem;margin:4px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.pn h3{font-size:.86rem;margin:14px 0 6px;color:var(--ink-2)}
.pn p{margin:.35em 0;font-size:.9rem}
.pn label.ch{display:block;font-size:.84rem;color:var(--ink-2);margin:8px 0 3px}
.pn input[type=text],.pn input[type=number],.pn select{width:100%;font:inherit;font-size:.95rem;padding:7px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);min-height:38px}
.pn input:focus,.pn select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.pn .rang{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pn .btn{min-height:38px;padding:.35rem .8rem;font-size:.88rem}
.pn-carte{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--paper-2)}
.pn-defi{border-left:5px solid var(--accent);background:var(--accent-soft)}
.pn-defi .eyebrow{color:var(--accent)}
.pn-defi h2{border:0;margin:2px 0 6px;padding:0}
.pn-defi ul{margin:.3em 0;padding-left:1.2em;font-size:.9rem}
.res{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.res li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:.86rem;align-items:start}
.res li::before{content:"✓";display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-weight:700;font-size:.75rem}
.res li.ko::before{content:"✕";background:var(--bad)}
.res .pourquoi{grid-column:2;background:var(--bad-soft);color:var(--ink);border-radius:6px;padding:6px 8px;margin-top:2px}
.res .constat{grid-column:2;color:var(--ink-2);font-size:.82rem}
.bravo{background:var(--good-soft);color:var(--good);border-radius:8px;padding:8px 10px;font-weight:600;margin-top:8px}
.msgs{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.msgs li{font-size:.86rem;padding:6px 9px;border-radius:6px;background:var(--paper-2);border-left:4px solid var(--accent)}
.msgs li.erreur{background:var(--bad-soft);border-left-color:var(--bad)}
.msgs li.alerte{background:var(--warn-soft);border-left-color:var(--warn)}
.msgs li.info{border-left-color:var(--accent)}
.msgs li small{display:block;color:var(--ink-3);font-family:var(--f-mono);font-size:.72rem}
.cmd-l{display:grid;gap:6px}
.cmd{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
.cmd>div:first-child{flex:1 1 96px;min-width:0}
.cmd b{font-family:var(--f-mono)}
.cmd small{display:block;color:var(--ink-3);font-size:.75rem}
.cmd .bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto;margin-left:auto}
.cmd button{appearance:none;font:inherit;font-size:.84rem;font-weight:600;min-height:40px;min-width:44px;padding:4px 10px;border-radius:7px;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.cmd button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cmd button.rouge{border-color:var(--bad);color:var(--bad)}
.cmd button.rouge.on{background:var(--bad);color:#fff}
.cmd .etat{font-size:.75rem;font-weight:600}
.cmd .etat.ok{color:var(--good)}.cmd .etat.ko{color:var(--bad)}
.kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper-2);white-space:nowrap}
.pn-poignee{display:none}
/* téléphone et tablette en portrait : palette en tiroir, panneau en bas */
@media (max-width:980px){
  .sc-corps{grid-template-columns:minmax(0,1fr)}
  .sc-palette{position:absolute;left:0;top:0;bottom:0;width:min(300px,88vw);z-index:30;transform:translateX(-104%);transition:transform .2s ease;box-shadow:var(--sc-ombre)}
  body.pal-ouverte .sc-palette{transform:none}
  body.pal-ouverte .sc-voile{display:block}
  .sc-voile{display:none;position:absolute;inset:0;background:rgba(10,15,25,.28);z-index:25}
  .sc-panneau{position:absolute;left:0;right:0;bottom:0;max-height:62%;z-index:20;border-left:0;border-top:1px solid var(--rule);border-radius:12px 12px 0 0;box-shadow:var(--sc-ombre);padding:0 12px 18px;transform:translateY(calc(100% - 46px));transition:transform .2s ease}
  body.pn-ouvert .sc-panneau{transform:none}
  .pn-poignee{display:flex;position:sticky;top:0;z-index:2;align-items:center;justify-content:space-between;gap:10px;width:calc(100% + 24px);margin:0 -12px 6px;height:46px;padding:0 14px;border:0;border-bottom:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;border-radius:12px 12px 0 0}
  .pn-poignee span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .pn-poignee i{font-style:normal;color:var(--ink-3)}
  .sc-legende{bottom:56px}
}
@media (min-width:981px){.sc-voile{display:none}}
/* fenêtres */
dialog.sc-d{border:1px solid var(--rule);border-radius:12px;padding:0;background:var(--paper);color:var(--ink);box-shadow:var(--sc-ombre);width:min(860px,94vw);max-height:88vh}
dialog.sc-d::backdrop{background:rgba(10,15,25,.45)}
.d-tete{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:1}
.d-tete h2{margin:0;padding:0;border:0;font-size:1.3rem;flex:1}
.d-corps{padding:12px 16px 18px;overflow:auto}
.d-x{appearance:none;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:8px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.carte-x{appearance:none;font:inherit;text-align:left;display:flex;flex-direction:column;gap:5px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-2);color:var(--ink);padding:10px;cursor:pointer}
.carte-x:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.carte-x .ap{background:var(--sc-feuille);border:1px solid var(--rule-2);border-radius:7px;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.carte-x .ap svg{width:100%;height:100%}
.carte-x b{font-family:var(--f-disp);font-size:1.12rem;text-transform:uppercase;letter-spacing:.02em}
.carte-x span{font-size:.86rem;color:var(--ink-2)}
.carte-x .etq{align-self:flex-start;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.carte-x .etq.fait{background:var(--good-soft);color:var(--good)}
.menu-l{display:grid;gap:6px}
.menu-l button,.menu-l label.bt{appearance:none;font:inherit;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2);color:var(--ink);cursor:pointer;min-height:46px}
.menu-l button:hover,.menu-l label.bt:hover{border-color:var(--accent)}
.menu-l small{display:block;color:var(--ink-3)}
.copies{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.copies li{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px}
.copies li span{flex:1;min-width:0}
.copies li small{display:block;color:var(--ink-3)}
.aide-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.aide-g figure{margin:0;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--paper-2)}
.aide-g figure svg{display:block;width:100%;height:auto;color:var(--ink)}
.aide-g figcaption{font-size:.88rem;margin-top:6px}
table.raccourcis{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:8px}
table.raccourcis td{border-top:1px solid var(--rule);padding:5px 6px;vertical-align:top}
table.raccourcis td:first-child{white-space:nowrap;width:1%}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:100;box-shadow:var(--sc-ombre);max-width:90vw}
/* impression : seulement le schéma, avec son cartouche */
#sc-impression{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body.sc-app{display:block;height:auto;overflow:visible;background:#fff}
  body.sc-app>*:not(#sc-impression){display:none!important}
  #sc-impression{display:block}
  #sc-impression svg{width:100%;height:auto;max-height:190mm}
}
</style>
</head>
<body class="sc-app">
<header class="haut"><div class="haut-in">
  <a class="logo" href="../index.html#/tableau"><img class="logo-img" src="../assets/logo-papara.svg" alt="Lycée Tuianu Le Gayic, Papara" width="60" height="48"><span class="logo-txt"><span class="logo-ey">Lycée Tuianu Le Gayic · Papara</span><span class="logo-nom">Atelier <em>schémas</em></span></span></a>
  <div class="qui"><span class="q-long discret" id="sc-qui"></span><a href="../index.html#/tableau">Mon espace</a></div>
</div></header>

<nav class="sc-barre" id="sc-barre" aria-label="Outils">
  <button class="sc-b seul-tel" type="button" data-a="palette" title="Les symboles"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Symboles</span></button>
  <button class="sc-b" type="button" data-a="fichier" title="Nouveau, ouvrir, enregistrer, exporter, imprimer"><svg viewBox="0 0 24 24"><path d="M4 6.5h6l2 2.5h8v9.5H4z"/></svg><span>Fichier</span></button>
  <button class="sc-b" type="button" data-a="exemples" title="Ouvrir un schéma tout fait"><svg viewBox="0 0 24 24"><path d="M5 4.5h10l4 4v11H5z"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h4"/></svg><span>Exemples</span></button>
  <button class="sc-b" type="button" data-a="defis" title="Exercices vérifiés automatiquement"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg><span>Défis</span></button>
  <span class="sc-sep"></span>
  <button class="sc-b" type="button" data-o="fleche" aria-pressed="true" title="Choisir et déplacer (V)"><svg viewBox="0 0 24 24"><path d="M6 3.5l12 8.2-5.4 1.2 3.2 6.2-2.4 1.2-3.2-6.2L6 18z"/></svg><span>Choisir</span></button>
  <button class="sc-b" type="button" data-o="fil" aria-pressed="false" title="Tracer des fils (F)"><svg viewBox="0 0 24 24"><path d="M4 18h6V6h10"/><circle cx="4" cy="18" r="1.8" fill="currentColor"/><circle cx="20" cy="6" r="1.8" fill="currentColor"/></svg><span>Fil</span></button>
  <button class="sc-b" type="button" data-o="main" aria-pressed="false" title="Déplacer la feuille (H, ou glisser avec le bouton droit)"><svg viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 013 0V11m0-5.5V5a1.5 1.5 0 013 0v6m0-4.5a1.5 1.5 0 013 0V14c0 3.6-2.4 6-6 6-2.6 0-4.2-1.4-5.6-3.6L4.2 13a1.5 1.5 0 012.5-1.6L8 13"/></svg><span>Feuille</span></button>
  <span class="sc-sep"></span>
  <button class="sc-b" type="button" data-a="tourner" title="Tourner d'un quart de tour (R)"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 11-2.1-5"/><path d="M17.5 3v4.2h-4.2"/></svg><span>Tourner</span></button>
  <button class="sc-b" type="button" data-a="supprimer" title="Supprimer (Suppr)"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/></svg><span>Supprimer</span></button>
  <button class="sc-b" type="button" data-a="annuler" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4.5 9.5 9 5"/><path d="M5 9.5h9a5.5 5.5 0 010 11h-3"/></svg><span>Annuler</span></button>
  <button class="sc-b" type="button" data-a="refaire" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l4.5-4.5L15 5"/><path d="M19 9.5h-9a5.5 5.5 0 000 11h3"/></svg><span>Rétablir</span></button>
  <span class="sc-sep"></span>
  <button class="sc-b" type="button" data-a="moins" title="Dézoomer (−)"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20M7.5 10.5h6"/></svg><span class="lib-long">Dézoomer</span></button>
  <span class="sc-zoom" id="sc-zoom">100 %</span>
  <button class="sc-b" type="button" data-a="plus" title="Zoomer (+)"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20M7.5 10.5h6M10.5 7.5v6"/></svg><span class="lib-long">Zoomer</span></button>
  <button class="sc-b" type="button" data-a="ajuster" title="Voir tout le schéma (0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Tout voir</span></button>
  <span class="sc-espace"></span>
  <button class="sc-b simuler" type="button" data-a="simuler" id="sc-simuler" title="Lancer ou arrêter la simulation"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span>Simuler</span></button>
  <button class="sc-b" type="button" data-a="aide" title="Comment ça marche"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 114.2 1.8c-.9.8-1.8 1.3-1.8 2.6"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg><span>Aide</span></button>
</nav>

<div class="sc-corps" id="sc-corps">
  <aside class="sc-palette" id="sc-palette" aria-label="Symboles"></aside>
  <div class="sc-voile" id="sc-voile"></div>
  <div class="sc-vue" id="sc-vue">
    <svg id="sc-svg" tabindex="0" role="application" aria-label="Feuille de dessin du schéma">
      <defs><pattern id="sc-motif" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="0.9" fill="var(--sc-point)"/><circle cx="10" cy="0" r="0.9" fill="var(--sc-point)"/><circle cx="0" cy="10" r="0.9" fill="var(--sc-point)"/><circle cx="10" cy="10" r="0.9" fill="var(--sc-point)"/></pattern></defs>
      <g id="sc-fond"><rect class="grille-fond" id="sc-grille" x="0" y="0" width="10" height="10"/></g>
      <g id="sc-monde"></g>
    </svg>
    <div class="sc-vide" id="sc-vide" hidden></div>
    <div class="sc-legende" aria-hidden="true"><span><i style="background:var(--p-l1)"></i>L1 (ou L, +24 V)</span><span><i style="background:var(--p-l2)"></i>L2</span><span><i style="background:var(--p-l3)"></i>L3</span><span><i style="background:var(--p-n)"></i>N, 0 V</span><span><i style="background:var(--p-pe)"></i>PE (terre)</span><span><i style="background:var(--ink)"></i>pas de tension</span></div>
    <div class="sc-horloge" id="sc-horloge"></div>
    <div id="sc-bulle"></div>
  </div>
  <aside class="sc-panneau pn" id="sc-panneau" aria-label="Réglages et simulation"></aside>
</div>

<dialog class="sc-d" id="d-fichier"><div class="d-tete"><h2>Fichier</h2><button class="d-x" type="button" data-fermer aria-label="Fermer">×</button></div><div class="d-corps" id="d-fichier-c"></div></dialog>
<dialog class="sc-d" id="d-exemples"><div class="d-tete"><h2>Exemples tout faits</h2><button class="d-x" type="button" data-fermer aria-label="Fermer">×</button></div><div class="d-corps" id="d-exemples-c"></div></dialog>
<dialog class="sc-d" id="d-defis"><div class="d-tete"><h2>Défis</h2><button class="d-x" type="button" data-fermer aria-label="Fermer">×</button></div><div class="d-corps" id="d-defis-c"></div></dialog>
<dialog class="sc-d" id="d-aide"><div class="d-tete"><h2>Comment ça marche</h2><button class="d-x" type="button" data-fermer aria-label="Fermer">×</button></div><div class="d-corps" id="d-aide-c"></div></dialog>
<div id="sc-impression"></div>
<input type="file" id="sc-import" accept=".json,application/json" hidden>
