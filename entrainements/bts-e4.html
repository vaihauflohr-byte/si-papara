<script>
/* =====================================================================
   Entraînement E4 — moteur de la page.
   Parcours = liste de questions (un sujet complet, ou les questions d'une notion
   dans tous les sujets transcrits). Deux modes :
     guidé : correction et auto-évaluation question par question, indices autorisés ;
     blanc : épreuve chronométrée (4 h), sans indice, correction à la fin.
   L'auto-évaluation reprend la grille officielle du barème : l'élève coche les
   indicateurs qu'il a réellement produits (ceux qui dépendent d'un résultat
   numérique sont cochés automatiquement) → niveau N0 à N3 par question.
   Résultats gardés dans le navigateur et transmis au suivi du site (SIP) si l'élève
   est connecté.
   ===================================================================== */
(function () {
  "use strict";
  const E4 = window.E4;
  const SUJETS = E4.SUJETS || [];
  const NOTIONS = E4.NOTIONS || [];
  const CARTE = E4.CARTE || [];

  const nb = (x, d = 3) => Number.isFinite(x) ? Number(x.toPrecision(d)).toLocaleString("fr-FR", { maximumFractionDigits: 10 }) : "—";

  const sujetDe = (id) => SUJETS.find((s) => s.id === id);

  const nomEleve = () => { try { const s = window.SIP && SIP.session && SIP.session.get(); return s ? s.nom : null; } catch (e) { return null; } };

  // ---------- analyse des réponses ----------
  function parseNombre(s) {
    if (s == null) return NaN;
    let t = String(s).trim().replace(/[\s  ]/g, "").replace(/,/g, ".").replace(/[×x*]10\^?\(?(-?\d+)\)?/i, "e$1").replace(/\^/g, "");
    t = t.replace(/[^0-9eE.+-]/g, "");

  function champJuste(ch, val) {
    if (ch.type === "choix") return val != null && Number(val) === ch.attendu;

  const COULEURS = ["#1d4ed8", "#c2410c", "#15803d"];
  function Atelier(hote, it, r, ro, corrige, sauver) {

          <div class="q-enonce">${q.enonce}</div>
          <div class="capacite"><b>Capacité évaluée :</b> ${esc(q.capacite)} · <span class="chip">${esc(notionDe(q.notion).nom)}</span></div>
          ${q.dessin ? `<div class="papier">✎ <b>Document réponse à compléter à l'écran</b>${q.drep ? ` · <button class="btn petit" data-drep="${q.drep}">Voir la page entière</button>` : ""}</div><div id="atelier"></div>` : q.drep ? `<div class="papier">✎ Document réponse à compléter sur papier : <button class="btn petit" data-drep="${q.drep}">Voir le DREP</button></div>` : ""}
          ${champs ? `<div class="champs">${champs}</div>` : ""}
          ${q.texte || !(q.champs && q.champs.length) ? `<p class="discret" style="margin:6px 0 4px">Ta réponse rédigée (facultatif ici, mais obligatoire sur la copie) :</p><textarea name="texte" ${ro ? "readonly" : ""} placeholder="Relation utilisée, données relevées, calcul, conclusion…">${esc(r.valeurs.texte || "")}</textarea>` : ""}
          ${r.indice && q.ou ? `<div class="indice"><b>Où chercher ?</b> ${q.ou}</div>` : ""}
          <div class="actions" id="actions"></div>
          <div id="correction"></div>
        </div>`;
      if (q.dessin) Atelier(document.getElementById("atelier"), it, r, ro, corrige, sauver);
      travail.querySelectorAll("[data-rep]").forEach((b) => b.addEventListener("click", () => { viz.repere(b.dataset.rep); if (window.innerWidth <= 980) docsEl.classList.add("ouvert"); }));
      travail.querySelectorAll("[data-drep]").forEach((b) => b.addEventListener("click", () => { viz.aller("drep", Number(b.dataset.drep)); if (window.innerWidth <= 980) docsEl.classList.add("ouvert"); }));
      // saisie
      const lireSaisies = () => {
        travail.querySelectorAll("input[type=text]:not([data-case]):not(.texte-libre)").forEach((i) => { if (i.value.trim() !== "") r.valeurs[i.name] = i.value.trim(); else delete r.valeurs[i.name]; });
        travail.querySelectorAll("input[type=radio]:checked").forEach((i) => (r.valeurs[i.name] = Number(i.value)));
        const t = travail.querySelector("textarea"); if (t) { if (t.value.trim()) r.valeurs.texte = t.value; else delete r.valeurs.texte; }
        sauver();
      };
      travail.querySelectorAll(".champs input,textarea").forEach((i) => i.addEventListener("change", lireSaisies));
      const actions = document.getElementById("actions");
      const prec = run.idx > 0 ? `<button class="btn" data-go="-1">← Précédente</button>` : "";
      const suiv = run.idx < prc.items.length - 1 ? `<button class="btn ${corrige ? "plein" : ""}" data-go="1">Suivante →</button>` : `<button class="btn plein" data-fin>Terminer → bilan</button>`;
      if (run.phase === "corriger" || corrige) {
        actions.innerHTML = prec + (r.niveau == null && !enRevue ? "" : suiv);
        montrerCorrection(it, r, actions, suiv);
      } else {
        actions.innerHTML = prec + (blanc ? suiv : `${q.ou ? `<button class="btn" data-indice ${r.indice ? "disabled" : ""}>💡 Où chercher ?</button>` : ""}<button class="btn plein" data-verifier>Vérifier et m'évaluer</button>`);
        const bi = actions.querySelector("[data-indice]"); if (bi) bi.addEventListener("click", () => { r.indice = true; run.indices++; sauver(); afficher(); viz.repere((q.docs || [])[0] || ""); });
        const bv = actions.querySelector("[data-verifier]"); if (bv) bv.addEventListener("click", () => { lireSaisies(); r.verifie = true; sauver(); afficher(); });
      }
      actions.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { lireSaisies(); run.idx += Number(b.dataset.go); sauver(); afficher(); }));
      const bf = actions.querySelector("[data-fin]"); if (bf) bf.addEventListener("click", () => { lireSaisies(); if (enRevue) { location.hash = lienBilan; return; } if (run.phase === "corriger" || !blanc) { if (confirm("Terminer et voir le bilan ?")) finir(); } else if (confirm("Terminer l'épreuve et passer à la correction ?")) { run.phase = "corriger"; run.finEpreuve = Date.now(); run.idx = 0; sauver(); afficher(); } });
    }

    function montrerCorrection(it, r, actions, suivHtml) {
      const q = it.q, zone = document.getElementById("correction");
      if (!r.coches) r.coches = q.indicateurs.map(() => false);
      // indicateurs automatiques
      const auto = {}; Object.entries(q.auto || {}).forEach(([ch, idx]) => { const c = (q.champs || []).find((x) => x.id === ch); if (c) { const ok = champJuste(c, r.valeurs[ch]); (Array.isArray(idx) ? idx : [idx]).forEach((i) => { auto[i] = auto[i] === undefined ? ok : auto[i] && ok; }); } });
      Object.entries(auto).forEach(([idx, ok]) => (r.coches[idx] = ok));
      const valide = r.niveau != null;
      const dessinerGrille = () => {
        const n = niveauDe(q, r.coches), cnt = r.coches.filter(Boolean).length;
        zone.innerHTML = `<div class="correction">
          <h3>Corrigé</h3>
          ${q.corrigeImg && !q.dessin ? `<img class="img-corrige" src="${it.s.dossier}${q.corrigeImg}" alt="Document réponse corrigé" data-zoom>` : ""}
          <div class="corrige">${q.corrige}</div>
          ${q.ou && !r.indice ? `<div class="indice"><b>Où était la réponse ?</b> ${q.ou}</div>` : ""}
          <div class="grille">
            <div class="tete"><div><h3 style="margin:0">Grille d'évaluation · barème officiel</h3><span class="discret">Coche <b>honnêtement</b> ce que tu as écrit sur ta copie. Les indicateurs liés à un résultat saisi sont cochés automatiquement.</span></div>
              <div class="niveau n${n}">N${n} <small>${NIVEAUX[n]} · ${cnt} / ${q.indicateurs.length} indicateur${cnt > 1 ? "s" : ""}</small></div></div>
            ${q.indicateurs.map((txt, i) => `<label class="${auto[i] !== undefined ? "auto" : ""}"><input type="checkbox" data-i="${i}" ${r.coches[i] ? "checked" : ""} ${auto[i] !== undefined || valide ? "disabled" : ""}> <span>${txt}</span>${auto[i] !== undefined ? `<span class="tag ${auto[i] ? "ok" : "ko"}">${auto[i] ? "vérifié ✓" : "faux ✗"}</span>` : ""}</label>`).join("")}
            <p class="discret" style="margin:8px 0 0">Seuils : ${["N1", "N2", "N3"].map((k, i) => (q.seuils || [])[i] != null ? k + " dès " + q.seuils[i] : null).filter(Boolean).join(" · ")} indicateur(s).</p>
          </div>
          ${!valide ? `<div class="actions"><button class="btn plein" data-valider>Valider mon évaluation : N${n}</button></div>` : `<p class="discret">Évaluation enregistrée : <b class="n${r.niveau}">N${r.niveau}</b>. ${r.indice ? "Indice utilisé." : ""}</p>`}
        </div>`;
        zone.querySelectorAll("input[type=checkbox]").forEach((c) => c.addEventListener("change", () => { r.coches[c.dataset.i] = c.checked; sauver(); dessinerGrille(); }));
        const im = zone.querySelector("[data-zoom]"); if (im) im.addEventListener("click", () => lightbox(im.src));
        const bv = zone.querySelector("[data-valider]"); if (bv) bv.addEventListener("click", () => { r.niveau = niveauDe(q, r.coches); sauver(); dessinerNav(); dessinerGrille(); if (run.phase === "corriger" || !blanc) { actions.innerHTML = (run.idx > 0 ? `<button class="btn" data-go="-1">← Précédente</button>` : "") + suivHtml; actions.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { run.idx += Number(b.dataset.go); sauver(); afficher(); })); const bf = actions.querySelector("[data-fin]"); if (bf) bf.addEventListener("click", () => { if (enRevue) { location.hash = lienBilan; return; } if (confirm("Terminer et voir le bilan ?")) finir(); }); } });
      };
      dessinerGrille();
    }
    afficher();
  }

  // ---------- bilan ----------
  function vueBilan(prc) {
    if (!prc) return vueAccueil();
    const run = lire(cle(prc.id));
    if (!run) { location.hash = prc.notion ? "#/notion/" + prc.notion.id : "#/sujet/" + prc.sujet.id; return; }
    prc = ordonner(prc, run);
    const items = prc.items.map((it) => ({ it, q: it.q, r: run.reponses[idItem(it)] || {}, niveau: (run.reponses[idItem(it)] || {}).niveau ?? null }));
    const faits = items.filter((i) => i.niveau != null);
    const note = noteSur20(faits);
    const rep = [0, 1, 2, 3].map((n) => faits.filter((i) => i.niveau === n).length);
    const duree = run.termine ? Math.round((run.termine - run.debut) / 60e3) : null;
    const par = (clef, lib) => { const g = {}; faits.forEach((i) => { const k = clef(i); (g[k] = g[k] || []).push(i); });
      return Object.entries(g).map(([k, L]) => ({ k, lib: lib(k, L), n: L.length, note: noteSur20(L), faible: L.filter((i) => i.niveau <= 1).length })); };
    const parPartie = prc.sujet ? par((i) => i.q.partie, (k) => "Partie " + k + " · " + (prc.sujet.parties.find((p) => p.id === k) || {}).titre) : [];
    const parNotion = par((i) => i.q.notion, (k) => notionDe(k).nom).sort((a, b) => (a.note ?? 0) - (b.note ?? 0));
    const lienJeu = prc.notion ? "#/notion/" + prc.notion.id : "#/jouer/" + prc.sujet.id + "/" + prc.mode;
    const lienRevue = (k) => (prc.notion ? "#/revoir/notion/" + prc.notion.id + "/" : "#/revoir/" + prc.sujet.id + "/" + prc.mode + "/") + k;
    app.innerHTML = `
      <p><a href="${prc.notion ? "#/" : "#/sujet/" + prc.sujet.id}">← ${prc.notion ? "Accueil" : esc(prc.titre)}</a></p>
      <div class="eyebrow">${esc(prc.sous)} · ${prc.mode === "blanc" ? "sujet blanc" : "mode guidé"}</div>
      <h1>Bilan · ${esc(prc.titre)}</h1>
      <div class="carte"><div class="score">
        <div><div class="grand">${note == null ? "—" : nb(note, 3)}<small> / 20</small></div><div class="discret">note indicative sur ${faits.length} question${faits.length > 1 ? "s" : ""} évaluée${faits.length > 1 ? "s" : ""}${faits.length < items.length ? " (" + (items.length - faits.length) + " non traitée" + (items.length - faits.length > 1 ? "s" : "") + ")" : ""}</div></div>
        <div><div class="repartition">${[3, 2, 1, 0].map((n) => `<span class="pastille n${n}" style="font-size:.95rem">N${n} · ${rep[n]}</span>`).join("")}</div>
          <div class="discret" style="margin-top:6px">N3 totalement acquise · N2 partiellement · N1 en cours · N0 non acquise${duree != null ? " · durée " + Math.floor(duree / 60) + " h " + String(duree % 60).padStart(2, "0") : ""}${run.indices ? " · " + run.indices + " indice" + (run.indices > 1 ? "s" : "") : ""}</div></div>
        <div style="margin-left:auto" class="actions"><button class="btn" id="btn-faibles" ${faits.some((i) => i.niveau <= 1) ? "" : "disabled"}>Retravailler les N0 et N1</button><button class="btn" id="btn-envoyer">Transmettre au professeur</button></div>
      </div></div>
      ${parPartie.length ? `<h2>Par partie</h2><div class="carte" style="padding:8px 14px"><table><thead><tr><th>Partie</th><th class="num">Questions</th><th class="num">N0–N1</th><th style="width:30%">Niveau</th><th class="num">/ 20</th></tr></thead><tbody>${parPartie.map(ligneGroupe).join("")}</tbody></table></div>` : ""}
      <h2>Par notion <span class="discret" style="font-family:var(--f-body);font-weight:400;text-transform:none;font-size:.88rem">de la plus fragile à la plus solide</span></h2>
      <div class="carte" style="padding:8px 14px"><table><thead><tr><th>Notion</th><th class="num">Questions</th><th class="num">N0–N1</th><th style="width:30%">Niveau</th><th class="num">/ 20</th></tr></thead><tbody>${parNotion.map(ligneGroupe).join("")}</tbody></table></div>
      <h2>Question par question</h2>
      <div class="carte"><div class="liste-q">${items.map((i, k) => `<a href="${lienRevue(k)}"><span class="pastille ${i.niveau == null ? "nn" : "n" + i.niveau}">${i.niveau == null ? "—" : "N" + i.niveau}</span><span>${esc(i.q.id)}${i.r.indice ? " 💡" : ""}</span></a>`).join("")}</div>
        <p class="discret" style="margin-bottom:0">Clique sur une question pour revoir ton évaluation et le corrigé.</p></div>`;
    function ligneGroupe(g) { const niv = g.note == null ? 0 : g.note / 20; return `<tr><td>${esc(g.lib)}</td><td class="num">${g.n}</td><td class="num">${g.faible || ""}</td><td><div class="barre"><span style="width:${Math.round(100 * niv)}%;background:${niv >= .8 ? "var(--good)" : niv >= .5 ? "var(--accent)" : "var(--bad)"}"></span></div></td><td class="num">${g.note == null ? "—" : nb(g.note, 3)}</td></tr>`; }
    document.getElementById("btn-faibles").addEventListener("click", () => {
      items.forEach((i) => { if (i.niveau != null && i.niveau <= 1) { const r = run.reponses[idItem(i.it)]; r.niveau = null; r.coches = null; r.verifie = false; r.valeurs = {}; } });
      run.fini = false; run.transmis = false; run.idx = items.findIndex((i) => (run.reponses[idItem(i.it)] || {}).niveau == null); if (run.idx < 0) run.idx = 0;
      if (prc.mode === "blanc") run.phase = "corriger";
      garder(cle(prc.id), run); location.hash = lienJeu;
    });
    document.getElementById("btn-envoyer").addEventListener("click", () => transmettre(prc, run, true));
  }

  // ---------- transmission au site SI Papara ----------
  async function transmettre(prc, run, manuel) {
    const items = prc.items.map((it) => ({ q: it.q, r: run.reponses[idItem(it)] || {} })).filter((i) => i.r.niveau != null);
    const note = noteSur20(items.map((i) => ({ q: i.q, niveau: i.r.niveau })));
    if (note == null) { if (manuel) toast("Aucune question évaluée : rien à transmettre."); return false; }
    if (!window.SIP || !SIP.session || !SIP.session.get()) { toast(manuel ? "Tu n'es pas connecté(e) au site : connecte-toi sur la page d'accueil du site, puis reviens transmettre." : "Résultat gardé sur cet appareil (non connecté au site)."); return false; }
    const details = items.map((i) => { const d = { q: i.q.id + " · " + i.q.capacite.slice(0, 90), rep: "N" + i.r.niveau + " (" + i.r.coches.filter(Boolean).length + "/" + i.q.indicateurs.length + " indicateurs)" + (i.r.indice ? " · indice" : ""), attendu: "N3", pts: Math.round(100 * i.r.niveau / 3) / 100, erreurs: i.r.niveau <= 1 ? 1 : 0, notion: i.q.notion };
      const tr = i.r.valeurs && i.r.valeurs.dessin; if (Array.isArray(tr) && tr.length && JSON.stringify(tr).length < 30000) d.dessin = tr; return d; });
    try {
      const ok = await SIP.ecrire("enregistrer", { module: prc.module, titre: prc.titreSite, type: "externe", score: note, score_max: 20, duree_s: run.termine ? Math.round((run.termine - run.debut) / 1000) : null, details });
      toast(SIP.apercu && SIP.apercu.actif() ? "Aperçu : résultat gardé dans ce navigateur (rien n'est transmis)." : ok ? "Résultat transmis au professeur ✓" : "Hors ligne : résultat gardé, il partira au retour du réseau.");
      return true;
    } catch (e) { toast(e.message === "SESSION_EXPIREE" ? "Ta connexion a expiré : reconnecte-toi sur le site." : "Transmission impossible : " + e.message); return false; }
  }
  let tmr = null;
  function toast(msg) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(tmr); tmr = setTimeout(() => (t.hidden = true), 6000); }
  function lightbox(src) { const l = document.createElement("div"); l.className = "lightbox"; l.innerHTML = `<img src="${src}" alt="">`; l.addEventListener("click", () => l.remove()); document.body.appendChild(l); }

  // ---------- état de connexion (site SI Papara) ----------
  function etatSip() {
    const el = document.getElementById("sip-etat"); if (!el) return;
    if (!window.SIP || !SIP.session) { el.innerHTML = `<span class="sip ko">Hors site · résultats gardés sur cet appareil</span>`; return; }
    const s = SIP.session.get();
    if (s && s.apercu) { el.innerHTML = `<span class="sip ap"><b>Aperçu professeur</b> · ${esc((SIP.niveau(s.niveau) || {}).court || s.niveau)} · rien n'est transmis · <a href="../index.html#/tableau">Tableau de bord</a></span>`; return; }
    el.innerHTML = s ? `<span class="sip ok">Connecté(e) : <b>${esc(s.nom)}</b> · résultats transmis au professeur · <a href="../index.html#/tableau">Mon espace</a></span>` : `<span class="sip ko">Non connecté(e) · <a href="../index.html#/connexion/BTS2-STI">Me connecter</a> (BTS 2 STI) · <a href="../index.html#/connexion/BTS2-ADM">ADM</a></span>`;
    if (s && SIP.viderFile) SIP.viderFile().then((n) => { if (n) toast(`${n} résultat${n > 1 ? "s" : ""} en attente transmis ✓`); }).catch(() => {});
  }
  window.addEventListener("load", () => { etatSip(); rendre(); });
})();
</script>

<!-- site SI Papara : connexion de l'élève et envoi des résultats au professeur (ignoré si la page est ouverte seule) -->

  if (window.SIP_CONFIG && SIP_CONFIG.supabaseUrl && SIP_CONFIG.supabaseAnonKey)
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
</script>
<script src="../assets/backend.js" onerror="void 0"></script>
</body>
