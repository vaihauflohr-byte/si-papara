<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="hach2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#7F7F7F" stroke-width="3" opacity="0.45"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- lagon et route -->
  <text x="20" y="400" font-size="19" fill="#2E75B6" font-weight="700">← Lagon</text>
  <text x="20" y="424" font-size="17" fill="#2E75B6">à 300 m</text>
  <rect x="1095" y="40" width="90" height="700" fill="#EDEDED"/>
  <text x="1140" y="400" font-size="19" fill="#595959" text-anchor="middle" transform="rotate(-90 1140 400)">Route</text>

  <!-- clôture du terrain -->
  <rect x="120" y="50" width="960" height="680" fill="none" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="1072" y="300" width="16" height="90" fill="#ffffff"/>
  <text x="1066" y="345" font-size="18" fill="#333" text-anchor="end">Portail</text>

  <!-- ombrière envisagée -->
  <rect x="200" y="70" width="680" height="335" fill="#FFF2CC" opacity="0.55" stroke="#BF9000" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="232" y="100" font-size="18" fill="#7F6000" font-style="italic">Ombrière envisagée</text>
  <text x="232" y="122" font-size="18" fill="#7F6000" font-style="italic">(environ 175 m²)</text>

  <!-- rangée des fourgonnettes (5 places, le long de la clôture nord) -->
  <g stroke="#1F3864" stroke-width="2.5" fill="#DCE6F1">
    <rect x="490" y="80" width="76" height="130"/><rect x="566" y="80" width="76" height="130"/><rect x="642" y="80" width="76" height="130"/><rect x="718" y="80" width="76" height="130"/><rect x="794" y="80" width="76" height="130"/>
  </g>
  <rect x="548" y="128" width="264" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="680" y="152" font-size="19" font-weight="700" fill="#1F3864" text-anchor="middle">5 places des fourgonnettes</text>

  <!-- rangée du personnel (9 places) -->
  <g stroke="#595959" stroke-width="2" fill="#F2F2F2">
    <rect x="212" y="265" width="73" height="130"/><rect x="285" y="265" width="73" height="130"/><rect x="358" y="265" width="73" height="130"/><rect x="431" y="265" width="73" height="130"/><rect x="504" y="265" width="73" height="130"/><rect x="577" y="265" width="73" height="130"/><rect x="650" y="265" width="73" height="130"/><rect x="723" y="265" width="73" height="130"/><rect x="796" y="265" width="74" height="130"/>
  </g>
  <rect x="515" y="310" width="210" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="620" y="333" font-size="19" fill="#404040" text-anchor="middle">9 places du personnel</text>

  <!-- manguier et son ombre -->
  <polygon points="200,190 430,262 430,395 212,395 170,250" fill="url(#hach2)"/>
  <circle cx="160" cy="185" r="58" fill="#A9D18E" stroke="#538135" stroke-width="3"/>
  <text x="160" y="181" font-size="17" font-weight="700" fill="#385723" text-anchor="middle">Manguier</text>
  <text x="160" y="203" font-size="15" fill="#385723" text-anchor="middle">à tailler</text>
  <text x="322" y="430" font-size="16" fill="#404040" text-anchor="middle">ombre dès 14 h</text>

  <!-- bâtiment -->
  <rect x="200" y="470" width="680" height="220" fill="#F7F7F7" stroke="#262626" stroke-width="3.5"/>
  <line x1="420" y1="470" x2="420" y2="690" stroke="#262626" stroke-width="3"/>
  <text x="310" y="585" font-size="22" font-weight="700" fill="#262626" text-anchor="middle">Bureaux</text>
  <text x="600" y="585" font-size="22" font-weight="700" fill="#262626" text-anchor="middle">Entrepôt</text>
  <rect x="740" y="490" width="120" height="80" fill="#DEEBF7" stroke="#2E75B6" stroke-width="2.5"/>
  <text x="800" y="525" font-size="16" fill="#1F4E79" text-anchor="middle">Chambre</text>
  <text x="800" y="545" font-size="16" fill="#1F4E79" text-anchor="middle">froide</text>
  <!-- TGBT -->
  <rect x="850" y="620" width="26" height="40" fill="#1F3864"/>
  <text x="840" y="676" font-size="18" font-weight="700" fill="#1F3864" text-anchor="end">TGBT</text>
  <!-- prise extérieure -->
  <circle cx="600" cy="470" r="11" fill="#C00000"/>
  <text x="618" y="458" font-size="16" fill="#C00000">prise extérieure 16 A</text>

  <!-- fourreau vide le long de la clôture est -->
  <polyline points="880,650 1050,650 1050,395" fill="none" stroke="#7030A0" stroke-width="4" stroke-dasharray="4 7"/>
  <text x="895" y="690" font-size="16" fill="#7030A0">fourreau vide Ø 63 mm,</text>
  <text x="895" y="710" font-size="16" fill="#7030A0">20 m environ</text>

  <!-- cote TGBT - milieu de la rangée des fourgonnettes -->
  <polyline points="886,630 930,630 930,236 680,236 680,216" fill="none" stroke="#333" stroke-width="2" marker-end="url(#f2)"/>
  <text x="940" y="440" font-size="17" fill="#333">35 m</text>
  <text x="940" y="462" font-size="15" fill="#333">le long</text>
  <text x="940" y="480" font-size="15" fill="#333">des murs</text>

  <!-- nord -->
  <g transform="translate(1040,120)">
    <line x1="0" y1="40" x2="0" y2="-20" stroke="#000" stroke-width="3" marker-end="url(#f2)"/>
    <text x="0" y="-30" font-size="22" font-weight="700" text-anchor="middle">N</text>
  </g>
  <text x="130" y="752" font-size="15" fill="#7F7F7F">Plan sans échelle · Punaauia, zone de la Punaruu</text>
</svg>
