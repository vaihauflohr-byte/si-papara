<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- papier jauni : document de 1996 -->
  <rect x="10" y="10" width="1180" height="680" fill="#FBF8EF" stroke="#C9BFA3" stroke-width="2"/>

  <!-- Réseau et comptage -->
  <rect x="40" y="55" width="210" height="100" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
  <text x="145" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3864">Réseau EDT</text>
  <text x="145" y="117" text-anchor="middle" font-size="19" fill="#333">220/380 V – 60 Hz</text>
  <text x="145" y="142" text-anchor="middle" font-size="19" fill="#333">schéma TT</text>
  <line x1="250" y1="105" x2="302" y2="105" stroke="#1F3864" stroke-width="4" marker-end="url(#f1)"/>
  <rect x="310" y="55" width="210" height="100" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
  <text x="415" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3864">Comptage EDT</text>
  <text x="415" y="124" text-anchor="middle" font-size="19" fill="#333">limite de propriété</text>
  <line x1="520" y1="105" x2="632" y2="105" stroke="#1F3864" stroke-width="5" marker-end="url(#f1)"/>
  <text x="576" y="88" text-anchor="middle" font-size="18" fill="#333">4 × 35 mm²</text>
  <text x="576" y="134" text-anchor="middle" font-size="18" fill="#333">15 m</text>

  <!-- TGBT -->
  <rect x="640" y="40" width="380" height="140" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="3"/>
  <path d="M648,40 H1012 A8,8 0 0 1 1020,48 V82 H640 V48 A8,8 0 0 1 648,40 z" fill="#1F3864"/>
  <text x="830" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">TGBT</text>
  <text x="660" y="116" font-size="20" fill="#1F3864">Interrupteur 4P 125 A</text>
  <text x="660" y="150" font-size="20" fill="#1F3864">Bloc différentiel 300 mA retardé</text>

  <!-- jeu de barres -->
  <line x1="830" y1="180" x2="830" y2="235" stroke="#1F3864" stroke-width="5"/>
  <line x1="165" y1="235" x2="1035" y2="235" stroke="#1F3864" stroke-width="6"/>

  <!-- départs -->
  <g stroke="#1F3864" stroke-width="4" fill="none">
    <line x1="165" y1="235" x2="165" y2="290"/><line x1="165" y1="345" x2="165" y2="440"/>
    <line x1="455" y1="235" x2="455" y2="290"/><line x1="455" y1="345" x2="455" y2="440"/>
    <line x1="745" y1="235" x2="745" y2="290"/><line x1="745" y1="345" x2="745" y2="440"/>
    <line x1="1035" y1="235" x2="1035" y2="290"/><line x1="1035" y1="345" x2="1035" y2="440" stroke-dasharray="14 8"/>
  </g>
  <g font-size="20" font-weight="700" fill="#1F3864" text-anchor="middle">
    <rect x="115" y="290" width="100" height="55" rx="4" fill="#DCE6F1" stroke="#1F3864" stroke-width="2.5"/>
    <text x="165" y="314">Q1</text><text x="165" y="338" font-size="18" font-weight="400">40 A C</text>
    <rect x="405" y="290" width="100" height="55" rx="4" fill="#DCE6F1" stroke="#1F3864" stroke-width="2.5"/>
    <text x="455" y="314">Q2</text><text x="455" y="338" font-size="18" font-weight="400">63 A C</text>
    <rect x="695" y="290" width="100" height="55" rx="4" fill="#DCE6F1" stroke="#1F3864" stroke-width="2.5"/>
    <text x="745" y="314">Q3</text><text x="745" y="338" font-size="18" font-weight="400">63 A C</text>
    <rect x="985" y="290" width="100" height="55" rx="4" fill="#DCE6F1" stroke="#1F3864" stroke-width="2.5"/>
    <text x="1035" y="314">Q4</text><text x="1035" y="338" font-size="18" font-weight="400">32 A D</text>
  </g>
  <g font-size="18" fill="#333">
    <text x="178" y="385">5G10</text><text x="178" y="409">10 m</text>
    <text x="468" y="385">5G10</text><text x="468" y="409">35 m</text>
    <text x="758" y="385">5G16</text><text x="758" y="409">25 m</text>
    <text x="1048" y="385">5G4</text><text x="1048" y="409">50 m</text>
    <text x="1048" y="431" font-size="16">enterré</text>
  </g>

  <!-- destinations -->
  <g text-anchor="middle">
    <rect x="70" y="440" width="190" height="90" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
    <text x="165" y="480" font-size="21" font-weight="700" fill="#1F3864">Bureaux</text>
    <text x="165" y="508" font-size="17" fill="#333">tableau existant</text>
    <rect x="360" y="440" width="190" height="90" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
    <text x="455" y="480" font-size="21" font-weight="700" fill="#1F3864">Coffret</text>
    <text x="455" y="508" font-size="21" font-weight="700" fill="#1F3864">atelier</text>
    <rect x="650" y="440" width="190" height="90" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
    <text x="745" y="480" font-size="21" font-weight="700" fill="#1F3864">Coffret</text>
    <text x="745" y="508" font-size="21" font-weight="700" fill="#1F3864">magasin</text>
    <rect x="925" y="440" width="220" height="90" rx="8" fill="#ffffff" stroke="#1F3864" stroke-width="2.5"/>
    <text x="1035" y="474" font-size="21" font-weight="700" fill="#1F3864">Coffret unité</text>
    <text x="1035" y="502" font-size="21" font-weight="700" fill="#1F3864">de traitement</text>
    <text x="1035" y="523" font-size="15" fill="#333">sous l'auvent</text>
  </g>

  <!-- cartouche -->
  <g>
    <rect x="740" y="575" width="430" height="100" fill="#ffffff" stroke="#6B6150" stroke-width="2"/>
    <line x1="740" y1="610" x2="1170" y2="610" stroke="#6B6150" stroke-width="1.5"/>
    <text x="955" y="600" text-anchor="middle" font-size="19" font-weight="700" fill="#3B3426">PACIFIC MATÉRIAUX — FAA'A</text>
    <text x="755" y="636" font-size="17" fill="#3B3426">Schéma de principe de la distribution</text>
    <text x="755" y="662" font-size="17" fill="#3B3426">Dessiné le 12/04/1996 · indice A · sans échelle</text>
  </g>
  <text x="40" y="600" font-size="17" fill="#6B6150">Repères Q1 à Q4 : ceux du schéma ;</text>
  <text x="40" y="624" font-size="17" fill="#6B6150">ils ne sont pas inscrits dans le tableau.</text>
</svg>
