<script>
  if (window.SIP_CONFIG && SIP_CONFIG.supabaseUrl && SIP_CONFIG.supabaseAnonKey)
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');

<script src="site.js"></script>
<script>
/* ---------- outils ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=(x,s=3)=>{if(!isFinite(x))return '—';const v=Number(Number(x).toPrecision(s));return v.toLocaleString('fr-FR',{maximumSignificantDigits:s+1}).replace('-','−');};
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const V=s=>`<i class="v">${s}</i>`;
const deg=x=>x*180/Math.PI, rad=x=>x*Math.PI/180;
/* tracé générique */
function plot(o){const W=o.W||640,H=o.H||300,m={l:58,r:30,t:16,b:44},pw=W-m.l-m.r,ph=H-m.t-m.b;
 const lx=o.logx,X=x=>m.l+(lx?(Math.log10(x)-Math.log10(o.x0))/(Math.log10(o.x1)-Math.log10(o.x0)):(x-o.x0)/(o.x1-o.x0))*pw,Y=y=>m.t+(1-(y-o.y0)/(o.y1-o.y0))*ph;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${o.alt||'courbe'}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="#fff" stroke="#9fb3c2"/>`;
 if(lx){for(let d=Math.round(Math.log10(o.x0));d<=Math.round(Math.log10(o.x1));d++){for(let k=1;k<10;k++){const x=k*10**d;if(x<o.x0*0.999||x>o.x1*1.001)continue;s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${m.t}" y2="${m.t+ph}" stroke="${k==1?'#9fb3c2':'#e3eaf0'}"/>`;if(k==1)s+=`<text x="${X(x)}" y="${m.t+ph+16}" font-size="12" text-anchor="middle" fill="#42596b">${fmt(x,2)}</text>`;}}}
 else{for(let x=o.x0,i=0;x<=o.x1+1e-9;x+=o.dx,i++){const maj=!o.xmaj||i%o.xmaj==0;s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${m.t}" y2="${m.t+ph}" stroke="${maj?'#c3d0da':'#e9eef2'}"/>`;if(maj)s+=`<text x="${X(x)}" y="${m.t+ph+16}" font-size="12" text-anchor="middle" fill="#42596b">${fmt(x,4)}</text>`;}}
 for(let y=o.y0,i=0;y<=o.y1+1e-9;y+=o.dy,i++){const maj=!o.ymaj||i%o.ymaj==0;s+=`<line x1="${m.l}" x2="${m.l+pw}" y1="${Y(y)}" y2="${Y(y)}" stroke="${maj?'#c3d0da':'#e9eef2'}"/>`;if(maj)s+=`<text x="${m.l-7}" y="${Y(y)+4}" font-size="12" text-anchor="end" fill="#42596b">${fmt(y,4)}</text>`;}
 for(const h of (o.hl||[]))s+=`<line x1="${m.l}" x2="${m.l+pw}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c||'#c9483b'}" stroke-dasharray="6 4"/><text x="${m.l+pw-4}" y="${Y(h.y)-5}" font-size="12" text-anchor="end" fill="${h.c||'#c9483b'}">${h.t||''}</text>`;
 for(const c of o.curves){let d='';c.pts.forEach((p,i)=>{const yy=Math.max(o.y0,Math.min(o.y1,p[1]));d+=(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(yy).toFixed(1);});s+=`<path d="${d}" fill="none" stroke="${c.c||'#12566f'}" stroke-width="${c.w||2.4}" ${c.dash?'stroke-dasharray="6 4"':''}/>`;}
 s+=`<text x="${m.l+pw/2}" y="${H-6}" font-size="13" text-anchor="middle" fill="#183047">${o.xl||''}</text><text transform="translate(14 ${m.t+ph/2}) rotate(-90)" font-size="13" text-anchor="middle" fill="#183047">${o.yl||''}</text></svg>`;return s;}
const step1=(K,tau,T,n=160)=>Array.from({length:n+1},(_,i)=>{const t=T*i/n;return [t,K*(1-Math.exp(-t/tau))];});
function step2(K,xi,w0,T,n=300){const wd=w0*Math.sqrt(1-xi*xi),ph=Math.acos(xi);return Array.from({length:n+1},(_,i)=>{const t=T*i/n;return [t,K*(1-Math.exp(-xi*w0*t)/Math.sqrt(1-xi*xi)*Math.sin(wd*t+ph))];});}
/* schéma-bloc */
function bd(o){const W=680,H=o.fb?170:150;const box=(x,t)=>`<rect x="${x}" y="40" width="120" height="50" rx="6" fill="#eef5f8" stroke="#12566f" stroke-width="1.6"/><text x="${x+60}" y="70" font-size="14" text-anchor="middle" fill="#183047">${t}</text>`;
 const ar=(x1,x2,y,l)=>`<line x1="${x1}" y1="${y}" x2="${x2-7}" y2="${y}" stroke="#183047" stroke-width="1.6"/><path d="M${x2-8} ${y-5}L${x2} ${y}L${x2-8} ${y+5}Z" fill="#183047"/>${l?`<text x="${(x1+x2)/2}" y="${y-9}" font-size="13" text-anchor="middle" fill="#183047">${l}</text>`:''}`;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="schéma-bloc de la boucle">`;
 s+=ar(10,110,65,o.in)+`<circle cx="124" cy="65" r="14" fill="#fff" stroke="#183047" stroke-width="1.6"/><text x="112" y="56" font-size="13" fill="#183047">+</text><text x="130" y="92" font-size="15" fill="#183047">−</text>`;
 s+=ar(138,210,65,o.err||'ε')+box(210,o.c)+ar(330,400,65,o.mid||'')+box(400,o.g)+ar(520,670,65,o.out);
 s+=`<circle cx="590" cy="65" r="3.2" fill="#183047"/><line x1="590" y1="65" x2="590" y2="130" stroke="#183047" stroke-width="1.6"/>`;
 if(o.fb){s+=`<line x1="590" y1="130" x2="420" y2="130" stroke="#183047" stroke-width="1.6"/><rect x="300" y="108" width="120" height="44" rx="6" fill="#eef5f8" stroke="#12566f" stroke-width="1.6"/><text x="360" y="135" font-size="14" text-anchor="middle" fill="#183047">${o.fb}</text><line x1="300" y1="130" x2="124" y2="130" stroke="#183047" stroke-width="1.6"/>`;}
 else s+=`<line x1="590" y1="130" x2="124" y2="130" stroke="#183047" stroke-width="1.6"/>`;
 s+=`<line x1="124" y1="130" x2="124" y2="87" stroke="#183047" stroke-width="1.6"/><path d="M119 87L124 79L129 87Z" fill="#183047"/></svg>`;return s;}
/* Bode d'une FT produit de pôles réels, intégrateurs éventuels */
function bodePts(K,taus,nint,w0,w1,n=240){const g=[],p=[];for(let i=0;i<=n;i++){const w=w0*(w1/w0)**(i/n);let mag=K/w**nint,phi=-90*nint;for(const t of taus){mag/=Math.sqrt(1+(w*t)**2);phi-=deg(Math.atan(w*t));}g.push([w,20*Math.log10(mag)]);p.push([w,phi]);}return {g,p};}
function bodeFig(K,taus,nint,w0,w1,gr,pr){const b=bodePts(K,taus,nint,w0,w1);
 return plot({W:660,H:270,logx:1,x0:w0,x1:w1,y0:gr[0],y1:gr[1],dy:5,ymaj:2,curves:[{pts:b.g}],hl:[{y:0,t:'0 dB',c:'#587083'}],xl:'',yl:'Gain (dB)',alt:'diagramme de Bode, gain'})+
 plot({W:660,H:270,logx:1,x0:w0,x1:w1,y0:pr[0],y1:pr[1],dy:15,ymaj:3,curves:[{pts:b.p}],hl:[{y:-180,t:'−180°',c:'#587083'}],xl:'Pulsation ω (rad/s)',yl:'Phase (°)',alt:'diagramme de Bode, phase'});}
function solve(f,a,b){let fa=f(a);for(let i=0;i<80;i++){const m=Math.sqrt(a*b),fm=f(m);if((fa<0)==(fm<0)){a=m;fa=fm;}else b=m;}return Math.sqrt(a*b);}


/* ---------- figures supplémentaires ---------- */
function bars(o){const W=o.W||600,H=o.H||260,m={l:58,r:16,t:14,b:44},pw=W-m.l-m.r,ph=H-m.t-m.b,n=o.items.length,bw=pw/n;
 const Y=y=>m.t+(1-y/o.y1)*ph;let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${o.alt||'spectre'}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="#fff" stroke="#9fb3c2"/>`;
 for(let y=0,i=0;y<=o.y1+1e-9;y+=o.dy,i++){const maj=!o.ymaj||i%o.ymaj==0;s+=`<line x1="${m.l}" x2="${m.l+pw}" y1="${Y(y)}" y2="${Y(y)}" stroke="${maj?'#c3d0da':'#e9eef2'}"/>`;if(maj)s+=`<text x="${m.l-7}" y="${Y(y)+4}" font-size="12" text-anchor="end" fill="#42596b">${fmt(y,4)}</text>`;}
 o.items.forEach((it,i)=>{const x=m.l+i*bw+bw*.3;s+=`<rect x="${x}" y="${Y(it.y)}" width="${bw*.4}" height="${m.t+ph-Y(it.y)}" fill="#12566f"/><text x="${x+bw*.2}" y="${m.t+ph+16}" font-size="12" text-anchor="middle" fill="#42596b">${it.x}</text>`;});
 s+=`<text x="${m.l+pw/2}" y="${H-6}" font-size="13" text-anchor="middle" fill="#183047">${o.xl||''}</text><text transform="translate(14 ${m.t+ph/2}) rotate(-90)" font-size="13" text-anchor="middle" fill="#183047">${o.yl||''}</text></svg>`;return s;}
function wave(fn,T,o){const n=o.n||400,pts=[];for(let i=0;i<=n;i++){const t=T*i/n;pts.push([t,fn(t)]);}return plot(Object.assign({x0:0,x1:T,curves:[{pts}]},o));}
function serie(parts,src,par){const n=parts.length,W=Math.max(420,150+n*140)+(par?60:0),H=par?230:170;let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="schéma du circuit"><g fill="none" stroke="#183047" stroke-width="1.6">`;
 const y=40,yb=H-30,x0=60,x1=W-(par?60:40);s+=`<path d="M${x0} ${y}H${x1}V${yb}H${x0}V${(y+yb)/2+18}M${x0} ${(y+yb)/2-18}V${y}"/><circle cx="${x0}" cy="${(y+yb)/2}" r="18" fill="#fff"/></g>`;
 s+=`<text x="${x0}" y="${(y+yb)/2+5}" font-size="14" text-anchor="middle" fill="#183047">~</text><text x="${x0-26}" y="${(y+yb)/2+5}" font-size="13" text-anchor="end" fill="#183047">${src||'v'}</text>`;
 parts.forEach((p,i)=>{const x=x0+60+i*140;s+=`<rect x="${x}" y="${y-16}" width="100" height="32" rx="5" fill="#eef5f8" stroke="#12566f" stroke-width="1.6"/><text x="${x+50}" y="${y+5}" font-size="13" text-anchor="middle" fill="#183047">${p}</text>`;});
 if(par){const x=x1;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${yb}" stroke="#183047" stroke-width="1.6"/><rect x="${x-45}" y="${(y+yb)/2-16}" width="90" height="32" rx="5" fill="#eef5f8" stroke="#12566f" stroke-width="1.6"/><text x="${x}" y="${(y+yb)/2+5}" font-size="13" text-anchor="middle" fill="#183047">${par}</text>`;}
 return s+'</svg>';}
function para(parts,src){const n=parts.length,W=170+n*130,H=190,y=30,yb=160;let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="schéma du circuit"><g fill="none" stroke="#183047" stroke-width="1.6"><path d="M60 ${y}H${W-60}M60 ${yb}H${W-60}M60 ${y}V${(y+yb)/2-18}M60 ${(y+yb)/2+18}V${yb}"/><circle cx="60" cy="${(y+yb)/2}" r="18" fill="#fff"/></g><text x="60" y="${(y+yb)/2+5}" font-size="14" text-anchor="middle">~</text><text x="34" y="${(y+yb)/2+5}" font-size="13" text-anchor="end">${src||'v'}</text>`;

const JURY_GENERAL=`Attentes constantes des jurys de l'agrégation SII ingénierie électrique (rapports 2022 à 2026, interne et externe) :
- Application numérique en quatre temps : expression littérale d'abord, puis remplacement de chaque grandeur par sa valeur à la place qu'elle occupait, puis résultat avec son unité, mis en évidence (encadré). "Calculer" signifie donner un nombre avec son unité.
- Un résultat donné sans calcul ni justification ne rapporte aucun point, même s'il est juste. Un calcul faux sans détail non plus.
- Les hypothèses doivent être énoncées explicitement ; la démarche est valorisée même si la conclusion n'est pas atteinte.
- L'homogénéité et l'ordre de grandeur doivent être vérifiés ; un résultat aberrant doit être signalé et commenté (c'est valorisé), sinon il est pénalisé.
- Trop de chiffres significatifs est pénalisé ; trois chiffres significatifs conviennent en général.
- Utiliser exclusivement les notations du sujet ; numéroter la question ; répondre précisément à ce qui est demandé, sans hors-sujet.
- Conclure : comparer au cahier des charges ou à l'exigence, avec les valeurs. Les conclusions et synthèses sont rarement rédigées alors qu'elles rapportent.
- Phrases complètes, français correct, orthographe soignée, vocabulaire technique exact (ne pas inventer de terminologie).
- Les lacunes les plus reprochées : puissances active/réactive et notation complexe (oubli de j), séries de Fourier, valeurs moyenne et efficace, marges de gain et de phase, classe et écart statique, tracé de Bode asymptotique, théorème de Millman, bus I2C/CAN/SPI.`;

 <p class="muted">Les notes portent sur les paliers BTS, agrégation et parties d’annales (coefficients 1, 2 et 2), au premier essai du dernier passage. Une rédaction compte pour la note donnée par l’IA, ou à défaut pour ton auto-évaluation (14 ou 4 sur 20). Ce sont des repères, pas des notes de jury.</p>
 <div class="modes"><button class="mode" data-go="seance"><b>Séance du jour</b><span>10 questions : d’abord celles à réviser, puis des nouvelles dans l’ordre des paliers.</span></button><button class="mode" data-go="epreuve"><b>Épreuve blanche</b><span>10 questions de niveau BTS et agrégation, 45 minutes, un seul essai, note sur 20.</span></button></div><h2 class="sec">Notions</h2><div class="grid">`;
 for(const [id,name] of PLAN){const N=NOTIONS.find(n=>n.id==id);if(!N){h+=`<div class="ncard off"><b>${name}</b><small>À venir</small></div>`;continue;}
  h+=`<button class="ncard" data-go="n-${N.id}"><b>${N.name}</b><small>${N.desc}</small><div class="lv">${N.levels.map(L=>{const n=L.qs.length,d=L.qs.filter((_,j)=>rec(`${N.id}.${L.id}.${j}`).ok>=2).length;return `<div><span>${L.name}</span><div class="bar"><i style="width:${100*d/n}%"></i></div><span>${d}/${n}</span></div>`;}).join('')}</div>${N.cours?`<small class="cr">Cours : ${(st.c[N.id]||[]).length} / ${N.cours.length} chapitres lus</small>`:''}${(g=>`<small class="nt"><b>${n20(g.traite)}</b>${g.n?` sur ${g.n} / ${g.tot} traitées`:' · rien de traité aux paliers notés'}</small>`)(noteOf(Q.filter(x=>x.N==N)))}<small class="jr">${N.jury}</small></button>`;}
 h+=`</div><p class="muted" style="margin-top:22px">Une question est validée après deux réussites au premier essai sur deux tirages différents. Une question réussie revient à 1, 3, 7, 14 puis 30 jours ; une question ratée revient le lendemain. ${HOOK&&HOOK.synced&&HOOK.synced()?'La progression est enregistrée sur ton compte professeur et suit d’un appareil à l’autre.':'La progression est gardée dans ce navigateur.'}</p>`;app().innerHTML=h;app().onclick=e=>{const b=e.target.closest('[data-go]');if(b)location.hash=b.dataset.go;};app().onsubmit=null;}

/* ---------- mode notion : cours et entraînement ---------- */
const C2='#e0803a';
function notion(N){const seen=N.levels.some(L=>L.qs.some((_,j)=>(st.q[`${N.id}.${L.id}.${j}`]||{}).seen));
 let mode=(N.cours&&!seen)?'cours':'train',lv=N.levels.findIndex(L=>L.qs.some((_,j)=>rec(`${N.id}.${L.id}.${j}`).ok<2)),qi=0,ci=0;if(lv<0)lv=0;
 app().innerHTML=`<a class="back" href="#accueil">← Toutes les notions</a><h1>${N.name}</h1><p class="muted">${N.desc}</p>${N.cours?`<div class="switch"><button data-m="cours">Cours</button><button data-m="train">Entraînement</button></div>`:''}<div id="zone"></div>`;
 app().onclick=e=>{const b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;go();}};
 function go(){document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));mode=='cours'?cours():train();}
 function train(){$('#zone').innerHTML=`<div class="tabs" id="tabs"></div><div id="fiche"></div><div class="qnav" id="qnav"></div><div class="card" id="card"></div>`;
  function tabs(){$('#tabs').innerHTML=N.levels.map((L,i)=>{const n=L.qs.length,d=L.qs.filter((_,j)=>rec(`${N.id}.${L.id}.${j}`).ok>=2).length;return `<button class="tab${i==lv?' on':''}" data-i="${i}"><b>${i+1}. ${L.name}</b><small>${L.sub}</small><div class="bar"><i style="width:${100*d/n}%"></i></div><small>${d} / ${n} validées${(g=>g.n?` · ${n20(g.note)}`:'')(lvNote(N,L))}</small></button>`;}).join('');
   const L=N.levels[lv];$('#qnav').innerHTML=L.qs.map((_,j)=>{const r=rec(`${N.id}.${L.id}.${j}`);return `<button class="qb${j==qi?' on':''}${r.ok>=2?' ok':r.seen?' half':''}" data-j="${j}" aria-label="Question ${j+1}">${j+1}</button>`;}).join('');
   const g=lvNote(N,L),ck=`${N.id}.${L.id}`,D=(L.duree||45)*60;
   $('#fiche').innerHTML=(L.id=='annale'?`<div class="partie"><div><strong>${n20(g.n?g.glob:null)}</strong>note de la partie (${g.n} / ${g.tot} questions traitées, le reste compte zéro)</div><div><strong id="chr">${L.duree||45}:00</strong><span id="chrl">chronomètre</span></div><div class="btns"><button class="b" type="button" data-p="go">${st.ch[ck]?'Relancer le chronomètre':'Lancer le chronomètre'}</button><button class="b sec" type="button" data-p="raz">Recommencer la partie</button></div></div>`:'')+`<details class="fiche"><summary>Fiche · ${L.name}</summary><ul>${L.fiche.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
   clearInterval(window.__chr);if(L.id=='annale'&&st.ch[ck]){const tick=()=>{const el=$('#chr');if(!el)return clearInterval(window.__chr);const r=D-Math.floor((Date.now()-st.ch[ck])/1000),a=Math.abs(r);el.textContent=(r<0?'+ ':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');el.style.color=r<0?'#c9483b':'';$('#chrl').textContent=r<0?'temps dépassé':'temps restant';};tick();window.__chr=setInterval(tick,1000);}
   $('#fiche').onclick=e=>{const a=e.target.dataset&&e.target.dataset.p;if(!a)return;if(a=='go'){st.ch[ck]=Date.now();save();tabs();}if(a=='raz'){delete st.ch[ck];L.qs.forEach((_,j)=>{delete st.p[`${ck}.${j}`];});save();qi=0;tabs();q();}};}
  function q(){const L=N.levels[lv];card($('#card'),{q:L.qs[qi],k:`${N.id}.${L.id}.${qi}`,N,L},{title:`${qi+1}. ${L.qs[qi].t}`,after:tabs});}
  $('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;lv=+b.dataset.i;qi=0;tabs();q();};
  $('#qnav').onclick=e=>{const b=e.target.closest('.qb');if(!b)return;qi=+b.dataset.j;tabs();q();};
  window.__go=(l,j)=>{lv=l;qi=j;tabs();q();};tabs();q();}
 function cours(){const C=N.cours,read=st.c[N.id]||(st.c[N.id]=[]);$('#zone').innerHTML=`<div class="qnav" id="cnav"></div><div class="card cours" id="cc"></div>`;
  function show(){const ch=C[ci];if(!read.includes(ci)){read.push(ci);save();}
   $('#cnav').innerHTML=C.map((c,j)=>`<button class="qb${j==ci?' on':''}${read.includes(j)?' ok':''}" data-j="${j}" aria-label="Chapitre ${j+1}">${j+1}</button>`).join('');
   let h=`<span class="src">Chapitre ${ci+1} / ${C.length}</span><h2>${ch.t}</h2>${ch.p.map(x=>`<p>${x}</p>`).join('')}`;
   if(ch.sim)h+=`<div class="sim">${ch.sim.s.map((x,j)=>`<div class="sl"><label for="sl${j}">${x.l} : <b id="sv${j}"></b></label><input type="range" id="sl${j}" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.v}"></div>`).join('')}<div class="fig" id="simfig"></div><div class="simout" id="simout"></div></div>`;
   else if(ch.fig)h+=`<div class="fig">${typeof ch.fig=='function'?ch.fig():ch.fig}</div>`;
   if(ch.more)h+=ch.more.map(x=>`<p>${x}</p>`).join('');
   if(ch.keep)h+=`<div class="keep"><b>À retenir</b><ul>${ch.keep.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
   h+=`<div class="btns" style="margin-top:16px">${ci?'<button class="b sec" data-c="-1" type="button">Précédent</button>':''}${ci<C.length-1?'<button class="b" data-c="1" type="button">Suivant</button>':'<button class="b" data-m="train" type="button">Passer à l’entraînement</button>'}${ch.go?`<button class="b sec" data-g="${ch.go[0]},${ch.go[1]}" type="button">M’entraîner sur ce point</button>`:''}</div>`;
   $('#cc').innerHTML=h;
   if(ch.sim){const upd=()=>{const v=ch.sim.s.map((x,j)=>{const val=+$('#sl'+j).value;$('#sv'+j).textContent=fmt(val,3)+(x.u?' '+x.u:'');return val;});$('#simfig').innerHTML=ch.sim.draw(...v);$('#simout').innerHTML=ch.sim.out?ch.sim.out(...v):'';};$('#cc').oninput=upd;upd();}else $('#cc').oninput=null;}
  $('#cnav').onclick=e=>{const b=e.target.closest('.qb');if(b){ci=+b.dataset.j;show();}};
  $('#cc').onclick=e=>{const d=e.target.dataset;if(d.c){ci+=+d.c;show();window.scrollTo(0,0);}if(d.g){const [l,j]=d.g.split(',').map(Number);lv=l;qi=j;mode='train';go();}};
  window.__ch=j=>{ci=j;show();};show();}
 window.__mode=m=>{mode=m;go();};go();}

/* ---------- séance du jour ---------- */
function seance(){const Q=allQ(),now=Date.now(),due=Q.filter(x=>st.q[x.k]&&st.q[x.k].seen&&st.q[x.k].due<=now).sort((a,b)=>st.q[a.k].box-st.q[b.k].box).slice(0,8);
 const fresh=Q.filter(x=>!(st.q[x.k]&&st.q[x.k].seen)).sort((a,b)=>a.li-b.li||NOTIONS.indexOf(a.N)-NOTIONS.indexOf(b.N)||a.qi-b.qi);
 const list=due.concat(fresh.slice(0,10-due.length));let i=0,good=0;
 if(!list.length){app().innerHTML=`<a class="back" href="#accueil">← Accueil</a><h1>Séance du jour</h1><div class="card"><p>Rien à réviser aujourd’hui et toutes les questions ont été vues. Passe une épreuve blanche, ou reviens demain.</p></div>`;return;}
 app().innerHTML=`<a class="back" href="#accueil">← Accueil</a><h1>Séance du jour</h1><div class="prog"><i id="pg"></i></div><div class="card" id="card"></div>`;app().onclick=null;
 function step(){if(i>=list.length){app().innerHTML=`<a class="back" href="#accueil">← Accueil</a><h1>Séance terminée</h1><div class="card"><p><b>${good} / ${list.length}</b> au premier essai.</p><p>Les questions ratées reviendront demain, les autres selon leur intervalle.</p><div class="btns"><a class="b" href="#accueil">Retour à l’accueil</a></div></div>`;return;}
  const it=list[i],f0=rec(it.k).fail;$('#pg').style.width=100*i/list.length+'%';
  card($('#card'),it,{head:`<span class="src">${i+1} / ${list.length} · ${it.N.name} · ${it.L.name}${due.includes(it)?' · révision':''}</span> `,next(){i++;step();},after(){if(rec(it.k).fail==f0)good++;}});}
 step();}

/* ---------- épreuve blanche ---------- */
function epreuve(){const pool=allQ().filter(x=>x.li>=2&&!x.q.open&&x.L.id!='annale');for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const list=pool.slice(0,10).sort((a,b)=>NOTIONS.indexOf(a.N)-NOTIONS.indexOf(b.N)||a.li-b.li).map(x=>({x,inst:x.q.gen(),ans:[]}));let i=0,end=Date.now()+45*60e3,tm=null,over=false;
 app().innerHTML=`<a class="back" href="#accueil">← Abandonner</a><h1>Épreuve blanche</h1><div class="exbar"><span id="clock"></span><div class="qnav" id="qnav"></div><button class="b" id="rendre" type="button">Rendre la copie</button></div><div class="card" id="card"></div>`;app().onclick=null;
 const keep=()=>{list[i].inst.fields.forEach((_,j)=>{const e=$('#in'+j);if(e)list[i].ans[j]=e.value;});};
 function show(){const it=list[i];$('#qnav').innerHTML=list.map((t,j)=>`<button class="qb${j==i?' on':''}${t.ans.some(v=>v&&v.trim())?' half':''}" data-j="${j}">${j+1}</button>`).join('');
  $('#card').innerHTML=`<span class="src">${it.x.N.name} · ${it.x.L.name}</span><h2>${i+1}. ${it.x.q.t}</h2><p>${it.inst.text}</p>${it.inst.fig?`<div class="fig">${it.inst.fig}</div>`:''}${fieldsHTML(it.inst)}<div class="btns">${i?'<button class="b sec" data-d="-1" type="button">Précédente</button>':''}${i<list.length-1?'<button class="b" data-d="1" type="button">Suivante</button>':''}</div>`;
  it.inst.fields.forEach((_,j)=>{if(it.ans[j]!=null)$('#in'+j).value=it.ans[j];});}
 function finish(){if(over)return;over=true;keep();clearInterval(tm);let pts=0,tot=0,h='';list.forEach((it,n)=>{let g=0;const rows=it.inst.fields.map((f,j)=>{const x=parse(it.ans[j]||''),ok=!isNaN(x)&&okf(f,x);if(ok)g++;return `<div class="fld ${ok?'good':'bad'}"><label>${f.l}</label><input disabled value="${(it.ans[j]||'').replace(/"/g,'')}"><span class="u">${f.u}</span><span class="fb">${ok?'Juste':'Attendu : '+fmt(f.a)+(f.u?' '+f.u:'')}</span></div>`;}).join('');
   const full=g==it.inst.fields.length;pts+=g/it.inst.fields.length;tot++;st.p[it.x.k]={s:g/it.inst.fields.length,d:Date.now()};mark(it.x.k,full);
   h+=`<details class="res ${full?'ok':g?'half':'ko'}"><summary>${n+1}. ${it.x.q.t} <small>${it.x.N.name} · ${it.x.L.name} · ${g} / ${it.inst.fields.length}</small></summary><p>${it.inst.text}</p>${it.inst.fig?`<div class="fig">${it.inst.fig}</div>`:''}<div class="fields">${rows}</div>${corrHTML(it.inst)}</details>`;});
  const s=20*pts/tot;st.exams.push({d:Date.now(),s});save();
  app().innerHTML=`<a class="back" href="#accueil">← Accueil</a><h1>Épreuve blanche : ${fmt(s,3)} / 20</h1><p class="muted">${s>=9?'Au-dessus de la barre d’admissibilité des quatre dernières sessions (entre 8,2 et 9).':'Sous la barre d’admissibilité des quatre dernières sessions (entre 8,2 et 9).'} Les questions incomplètes reviendront dans la séance de demain.</p>${h}<div class="btns" style="margin-top:18px"><a class="b" href="#accueil">Retour à l’accueil</a></div>`;}
 $('#card').onclick=e=>{const d=e.target.dataset&&e.target.dataset.d;if(d){keep();i+=+d;show();}};
 $('#qnav').onclick=e=>{const b=e.target.closest('.qb');if(b){keep();i=+b.dataset.j;show();}};
 $('#rendre').onclick=finish;window.__exam={list,finish};
 const tick=()=>{if(!$('#clock')){clearInterval(tm);return;}const r=Math.max(0,end-Date.now()),mm=Math.floor(r/60e3),ss=Math.floor(r%60e3/1e3);$('#clock').textContent=`${mm} min ${String(ss).padStart(2,'0')} s`;if(r<=0)finish();};tm=setInterval(tick,1000);tick();show();}

function route(){const h=(location.hash||'#accueil').slice(1);window.scrollTo(0,0);if(h=='seance')return seance();if(h=='epreuve')return epreuve();if(h.startsWith('n-')){const N=NOTIONS.find(n=>n.id==h.slice(2));if(N)return notion(N);}home();}
let PRET=!HOOK;
async function demarrer(){if(HOOK){app().innerHTML='<p class="muted">Chargement…</p>';const ok=await HOOK.ready.catch(()=>false);if(!ok){app().innerHTML=`<div class="eyebrow">Agrégation SII · ingénierie électrique</div><h1>Espace réservé</h1><div class="card"><p>Cette partie du site est réservée au professeur. Connecte-toi d’abord dans l’espace professeur, puis reviens ici.</p><div class="btns"><a class="b" href="../prof.html">Ouvrir l’espace professeur</a></div></div>`;return;}
  try{const r=await HOOK.pull();if(r&&r.q&&(r.t||0)>(st.t||0)){st=r;if(!st.c)st.c={};if(!st.r)st.r={};if(!st.p)st.p={};if(!st.ch)st.ch={};if(!st.exams)st.exams=[];try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}else if(r===undefined||(st.t&&(!r||(r.t||0)<st.t)))HOOK.push(st);}catch(e){}PRET=true;}route();}
window.addEventListener('hashchange',()=>{if(PRET)route();});window.addEventListener('DOMContentLoaded',demarrer);
